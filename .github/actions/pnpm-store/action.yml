name: pnpm store
description: >-
  Mount the root node_modules from a Blacksmith sticky disk and keep the pnpm
  store inside it. The store and the virtual store (node_modules/.pnpm) then
  share one filesystem, so pnpm hard-links instead of copying, and a warm disk
  leaves only the per-package links to write. pnpm checks every package against
  the lockfile integrity hash and prunes what the lockfile no longer lists.

  Each job mounts its own clone of the disk, so parallel jobs do not wait on
  each other. Keep Branch Protection for sticky disks on in the Blacksmith
  dashboard (Settings): then only default-branch runs commit the disk, and a
  pull request job cannot change what main reads.

runs:
  using: composite
  steps:
    - name: Mount node_modules
      uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
      with:
        key: ${{ github.repository }}-node-modules-${{ runner.os }}-${{ runner.arch }}
        path: ./node_modules

    - name: Keep the pnpm store on the same disk
      shell: bash
      run: echo "pnpm_config_store_dir=$GITHUB_WORKSPACE/node_modules/.pnpm-store" >> "$GITHUB_ENV"
