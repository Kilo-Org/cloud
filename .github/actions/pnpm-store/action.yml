name: pnpm store
description: >-
  Mount pnpm's content-addressed package store from a Blacksmith sticky disk.
  Each install creates the virtual store and workspace links from the current
  frozen dependency graph. Full and filtered installs share downloaded packages.

  Each job mounts its own clone of the disk, so parallel jobs do not wait on
  each other. Keep Branch Protection for sticky disks on in the Blacksmith
  dashboard (Settings): then only default-branch runs commit the disk, and a
  pull request job cannot change what main reads.

runs:
  using: composite
  steps:
    - name: Mount pnpm package store
      uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
      with:
        key: ${{ github.repository }}-pnpm-store-${{ runner.os }}-${{ runner.arch }}
        path: ./node_modules/.pnpm-store

    - name: Select the pnpm store
      shell: bash
      run: echo "pnpm_config_store_dir=$GITHUB_WORKSPACE/node_modules/.pnpm-store" >> "$GITHUB_ENV"
