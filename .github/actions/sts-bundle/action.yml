# Callers are listed in README.md next to this file (Callers). Read it before adding another caller.
name: 'STS bundle'
description: "Read the job's secret bundle from Kilo STS with the GitHub OIDC token and set each requested secret as a step output"
inputs:
  workload:
    description: 'STS policy name of the job, for example ci-cloud-agent-e2e; the action fails unless STS returns the bundle of this workload'
    required: true
  secrets:
    description: 'Newline-separated bundle keys; each must be in the bundle and declared under outputs, and becomes the output of the same name'
    required: true
  sts-url:
    description: 'STS origin, https://sts.kiloapps.io or https://sts-staging.kiloapps.io; also the audience of the GitHub OIDC token'
    required: false
    default: 'https://sts.kiloapps.io'
# One output per bundle key that a policy read by this repository's workflows grants
# (services/sts/policy/ci-*.yaml). A composite action passes on only declared outputs, and the
# script refuses a requested key that is not declared here. A private key or certificate chain that
# its consumer reads from a file would be declared as `<KEY>_FILE`; the script writes it to a mode
# 0600 file under RUNNER_TEMP and sets the path.
outputs:
  E2E_ACCESS_CLIENT_ID:
    description: 'Cloudflare Access service token client id of the Cloud Agent e2e Worker (ci-cloud-agent-e2e)'
    value: ${{ steps.bundle.outputs.E2E_ACCESS_CLIENT_ID }}
  E2E_ACCESS_CLIENT_SECRET:
    description: 'Cloudflare Access service token client secret of the Cloud Agent e2e Worker (ci-cloud-agent-e2e)'
    value: ${{ steps.bundle.outputs.E2E_ACCESS_CLIENT_SECRET }}
  VERCEL_TOKEN_APP:
    description: 'Vercel token of the kilocode-app project (ci-vercel-stage, ci-vercel-stage-staging)'
    value: ${{ steps.bundle.outputs.VERCEL_TOKEN_APP }}
  VERCEL_TOKEN_AI_GATEWAY:
    description: 'Vercel token of the AI gateway project (ci-vercel-stage, ci-vercel-stage-staging)'
    value: ${{ steps.bundle.outputs.VERCEL_TOKEN_AI_GATEWAY }}
  VERCEL_TOKEN_AI_GATEWAY_SECURE_PROXY:
    description: 'Vercel token of the AI gateway secure proxy project (ci-vercel-stage)'
    value: ${{ steps.bundle.outputs.VERCEL_TOKEN_AI_GATEWAY_SECURE_PROXY }}
  VERCEL_TOKEN:
    description: 'Vercel token that promotes and inspects deployments (ci-vercel-promote)'
    value: ${{ steps.bundle.outputs.VERCEL_TOKEN }}
  AXIOM_ANNOTATION_TOKEN:
    description: 'Axiom token that writes deployment annotations (ci-vercel-promote)'
    value: ${{ steps.bundle.outputs.AXIOM_ANNOTATION_TOKEN }}
  SENTRY_AUTH_TOKEN:
    description: 'Sentry token that uploads Cloud Agent source maps (ci-cloud-agent-sentry, ci-cloud-agent-sentry-staging)'
    value: ${{ steps.bundle.outputs.SENTRY_AUTH_TOKEN }}
  EXPO_TOKEN:
    description: 'Expo access token of the kilo-app release (ci-kilo-app-release)'
    value: ${{ steps.bundle.outputs.EXPO_TOKEN }}
  DOC_WEBHOOK_URL:
    description: 'Docs intake webhook URL (ci-auto-docs)'
    value: ${{ steps.bundle.outputs.DOC_WEBHOOK_URL }}
  DOC_WEBHOOK_SECRET:
    description: 'Docs intake webhook shared secret (ci-auto-docs)'
    value: ${{ steps.bundle.outputs.DOC_WEBHOOK_SECRET }}
  FLY_DEV_API_TOKEN:
    description: 'Fly development registry token (ci-kiloclaw-dev-push)'
    value: ${{ steps.bundle.outputs.FLY_DEV_API_TOKEN }}
runs:
  using: 'composite'
  steps:
    - name: Read the STS bundle
      id: bundle
      shell: bash
      env:
        INPUT_WORKLOAD: ${{ inputs.workload }}
        INPUT_SECRETS: ${{ inputs.secrets }}
        INPUT_STS_URL: ${{ inputs['sts-url'] }}
      run: bash "$GITHUB_ACTION_PATH/sts-bundle.sh"
