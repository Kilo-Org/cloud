name: tRPC declarations
description: >-
  Restore packages/trpc/dist from the cache, or build it. The cache key hashes
  every repository file in the tRPC declaration program (from
  `tsgo --listFilesOnly`), the build configuration, and the lockfile entries of
  the package's importer closure, which pin every file the build reads under
  node_modules. A hit therefore restores exactly what the build would write. Run
  it after `pnpm install`.

runs:
  using: composite
  steps:
    - name: Hash tRPC declaration inputs
      id: key
      shell: bash
      run: node scripts/trpc-declaration-key.mjs >> "$GITHUB_OUTPUT"

    - name: Restore tRPC declarations
      id: cache
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: packages/trpc/dist
        key: ${{ runner.os }}-trpc-declarations-${{ steps.key.outputs.key }}

    # A hit proves the key, not the tree: a restore that failed halfway, or an
    # entry written by a future build step that emits something else, would
    # otherwise be served as a build. Only a hit that carries the package's two
    # declaration entries skips the build.
    - name: Check the restored declarations
      id: restored
      shell: bash
      run: |
        set -euo pipefail
        usable='false'
        if [ '${{ steps.cache.outputs.cache-hit }}' = 'true' ]; then
          usable='true'
          for file in packages/trpc/dist/index.d.ts packages/trpc/dist/mobile.d.ts; do
            if [ ! -f "$file" ]; then
              echo "::warning::the restored tRPC declarations have no $file"
              usable='false'
            fi
          done
        fi
        echo "usable=$usable" >> "$GITHUB_OUTPUT"

    # The build script keeps tsgo under 2 GiB for memory-capped sandboxes. CI
    # runners have at least 8 GB, where that limit only slows the build down.
    - name: Build trpc types
      if: steps.restored.outputs.usable != 'true'
      shell: bash
      env:
        GOMEMLIMIT: 'off'
      run: pnpm --filter @kilocode/trpc run build
