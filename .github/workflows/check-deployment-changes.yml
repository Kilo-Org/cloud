name: Check Deployment Changes

on:
  workflow_call:
    inputs:
      workflow_file:
        required: true
        type: string
    outputs:
      base_sha:
        value: ${{ jobs.check.outputs.base_sha }}
      target_sha:
        value: ${{ jobs.check.outputs.target_sha }}
      should_deploy:
        value: ${{ jobs.check.outputs.should_deploy }}

permissions:
  contents: read
  actions: read
  deployments: read

jobs:
  check:
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    # Every deployment waits on this job. The checkout post step must be able to
    # finish inside the job budget: actions/checkout does no Blacksmith mirror
    # refresh, and 10 minutes covers a cold partial-clone fetch of main plus the
    # GitHub API paging below.
    timeout-minutes: 10
    outputs:
      base_sha: ${{ steps.changes.outputs.base_sha }}
      target_sha: ${{ steps.changes.outputs.target_sha }}
      should_deploy: ${{ steps.changes.outputs.should_deploy }}
    steps:
      # The caller admits the trigger. The `github` context belongs to the
      # caller workflow, so the trigger is available here for the run summary.
      - name: Record admitted trigger
        env:
          TRIGGERING_RUN: ${{ github.event.workflow_run.html_url }}
        run: |
          echo "Admitted \`$GITHUB_EVENT_NAME\` trigger." >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$TRIGGERING_RUN" ]; then
            echo "Triggering CI run: $TRIGGERING_RUN" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify main branch
        run: test "$GITHUB_REF" = refs/heads/main

      # Full history so the merge-base and the deploy-input diff below resolve
      # the last deployed sha against the CI-green candidate, and no blobs up
      # front: both compare trees only.
      # actions/checkout has no Blacksmith mirror to refresh.
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          filter: blob:none
          ref: ${{ github.sha }}
          # Nothing here pushes, and the repository is public: the lazy blob
          # fetches below need no token.
          persist-credentials: false

      - name: Check changes since last complete deployment
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: ${{ inputs.workflow_file }}
        run: |
          set -euo pipefail
          find_latest_successful_main_push() {
            local workflow_file="$1"
            local ancestor_ref="${2:-}"
            local page=1
            local response run_shas run_count sha

            while :; do
              if ! response=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_file/runs?per_page=100&page=$page"); then
                echo "::error::Failed to look up workflow runs for $workflow_file" >&2
                return 1
              fi
              if ! run_shas=$(jq -r '.workflow_runs | sort_by(.created_at) | reverse | .[] | select(.head_branch == "main" and .event == "push" and .status == "completed" and .conclusion == "success") | .head_sha' <<< "$response"); then
                echo "::error::Failed to parse workflow runs for $workflow_file" >&2
                return 1
              fi
              while IFS= read -r sha; do
                if [ -n "$sha" ] && { [ -z "$ancestor_ref" ] || git merge-base --is-ancestor "$sha" "$ancestor_ref"; }; then
                  printf '%s\n' "$sha"
                  return 0
                fi
              done <<< "$run_shas"
              if ! run_count=$(jq -r '.workflow_runs | length' <<< "$response"); then
                echo "::error::Failed to count workflow runs for $workflow_file" >&2
                return 1
              fi
              if [ "$run_count" -lt 100 ]; then
                return 0
              fi
              page=$((page + 1))
            done
          }

          if ! target_sha=$(find_latest_successful_main_push ci.yml HEAD); then
            exit 1
          fi

          if [ -z "$target_sha" ]; then
            echo "::notice::No successful main CI candidate is available"
            echo "No successful main CI candidate is available for this run." >> "$GITHUB_STEP_SUMMARY"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

          deployments=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=scheduled-${WORKFLOW_FILE%.yml}&per_page=100" \
            --jq '.[] | [.id, .sha] | @tsv')
          base_sha=""
          while read -r deployment_id sha; do
            if [ -z "$deployment_id" ]; then
              continue
            fi
            state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses?per_page=1" \
              --jq '.[0].state // empty')
            if [ "$state" = success ]; then
              base_sha="$sha"
              break
            fi
          done <<< "$deployments"

          if [ -z "$base_sha" ]; then
            if ! base_sha=$(find_latest_successful_main_push "$WORKFLOW_FILE"); then
              exit 1
            fi
          fi

          if [ -z "$base_sha" ]; then
            base_sha=$(git hash-object -t tree /dev/null)
          elif ! git merge-base --is-ancestor "$base_sha" "$target_sha"; then
            if git merge-base --is-ancestor "$target_sha" "$base_sha"; then
              echo "::notice::The most recent successful CI candidate is already deployed"
              echo "CI-green candidate \`$target_sha\` is already included in last completed release \`$base_sha\`." >> "$GITHUB_STEP_SUMMARY"
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Last deployed SHA and tested candidate have diverged"
            exit 1
          fi

          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "CI-green candidate: \`$target_sha\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$base_sha" = "$(git hash-object -t tree /dev/null)" ]; then
            echo "No prior completed release was found." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Last completed release: \`$base_sha\`" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Exclusion list: a diff that touches only paths no deployed artifact
          # reads skips the release. An unknown path still deploys. The list
          # tracks the Vercel callers (stage-vercel-deployment.yml) and the
          # worker discovery in deploy-workers.yml (find services -name
          # wrangler.jsonc): apps/web, apps/ai-gateway,
          # apps/ai-gateway-secure-proxy, packages, services, and the root
          # build inputs stay deploy-triggering. A skipped commit stays in the
          # next real release: base_sha is the last recorded deployment, so the
          # next deployment's diff absorbs it.
          # Markdown is excluded at the repository root only: the web app
          # compiles page.md and page.mdx under its app directory into routes
          # (pageExtensions in apps/web/next.config.mjs), so markdown inside
          # apps/web stays deploy-triggering. The docs directory exclusion
          # covers the docs tree; markdown in other package directories is
          # documentation by convention and the next real release absorbs a
          # skipped docs-only commit.
          if git diff --quiet "$base_sha" "$target_sha" -- . \
            ':(exclude)apps/mobile' \
            ':(exclude)apps/extension' \
            ':(exclude)apps/storybook' \
            ':(exclude).github' \
            ':(exclude)dev' \
            ':(exclude)tools' \
            ':(exclude)scripts' \
            ':(exclude)script' \
            ':(exclude)docs' \
            ':(exclude).specs' \
            ':(exclude).agents' \
            ':(exclude).kilo' \
            ':(exclude).kfab' \
            ':(exclude).vscode' \
            ':(exclude).cursor' \
            ':(exclude).husky' \
            ':(exclude).plans' \
            ':(exclude,glob)*.md'; then
            echo "No deployment needed: only files outside the deploy inputs changed." >> "$GITHUB_STEP_SUMMARY"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Deploying candidate \`$target_sha\`." >> "$GITHUB_STEP_SUMMARY"
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
