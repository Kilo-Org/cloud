name: Check Deployment Changes

on:
  workflow_call:
    inputs:
      workflow_file:
        required: true
        type: string
    outputs:
      base_sha:
        value: ${{ jobs.check.outputs.base_sha }}
      target_sha:
        value: ${{ jobs.check.outputs.target_sha }}
      should_deploy:
        value: ${{ jobs.check.outputs.should_deploy }}
      deploy_kiloclaw:
        value: ${{ jobs.check.outputs.deploy_kiloclaw }}

permissions:
  contents: read
  actions: read
  deployments: read

jobs:
  check:
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      base_sha: ${{ steps.changes.outputs.base_sha }}
      target_sha: ${{ steps.changes.outputs.target_sha }}
      should_deploy: ${{ steps.changes.outputs.should_deploy }}
      deploy_kiloclaw: ${{ steps.changes.outputs.deploy_kiloclaw }}
    steps:
      - name: Verify main branch
        run: test "$GITHUB_REF" = refs/heads/main

      - name: Checkout code
        uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Check changes since last complete deployment
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: ${{ inputs.workflow_file }}
        run: |
          set -euo pipefail
          ci_shas=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --branch main \
            --event push \
            --status success \
            --json headSha \
            --limit 100 \
            --jq '.[].headSha')
          target_sha=""
          while read -r sha; do
            if [ -n "$sha" ] && git merge-base --is-ancestor "$sha" HEAD; then
              target_sha="$sha"
              break
            fi
          done <<< "$ci_shas"

          if [ -z "$target_sha" ]; then
            echo "::notice::No successful main CI candidate is available"
            echo "No successful main CI candidate is available for this run." >> "$GITHUB_STEP_SUMMARY"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

          deployments=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=scheduled-${WORKFLOW_FILE%.yml}&per_page=100" \
            --jq '.[] | [.id, .sha] | @tsv')
          base_sha=""
          while read -r deployment_id sha; do
            if [ -z "$deployment_id" ]; then
              continue
            fi
            state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses?per_page=1" \
              --jq '.[0].state // empty')
            if [ "$state" = success ]; then
              base_sha="$sha"
              break
            fi
          done <<< "$deployments"

          if [ -z "$base_sha" ]; then
            base_sha=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$WORKFLOW_FILE" \
              --branch main \
              --event push \
              --status success \
              --json headSha \
              --limit 1 \
              --jq '.[0].headSha // empty')
          fi

          if [ -z "$base_sha" ]; then
            base_sha=$(git hash-object -t tree /dev/null)
          elif ! git merge-base --is-ancestor "$base_sha" "$target_sha"; then
            if git merge-base --is-ancestor "$target_sha" "$base_sha"; then
              echo "::notice::The most recent successful CI candidate is already deployed"
              echo "The most recent successful main CI candidate is already deployed: \`$base_sha\`." >> "$GITHUB_STEP_SUMMARY"
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Last deployed SHA and tested candidate have diverged"
            exit 1
          fi

          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "CI-green candidate: \`$target_sha\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$base_sha" = "$(git hash-object -t tree /dev/null)" ]; then
            echo "No prior completed release was found." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Last completed release: \`$base_sha\`" >> "$GITHUB_STEP_SUMMARY"
          fi

          if git diff --quiet "$base_sha" "$target_sha" -- . ':(exclude)apps/mobile'; then
            echo "No deployment needed: only mobile files changed." >> "$GITHUB_STEP_SUMMARY"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Deploying candidate \`$target_sha\`." >> "$GITHUB_STEP_SUMMARY"
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          if git diff --quiet "$base_sha" "$target_sha" -- services/kiloclaw pnpm-lock.yaml pnpm-workspace.yaml patches packages/worker-utils; then
            echo "deploy_kiloclaw=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_kiloclaw=true" >> "$GITHUB_OUTPUT"
          fi
