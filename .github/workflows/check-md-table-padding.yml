name: Check markdown table padding
on:
  pull_request:
    paths:
      - '**/*.md'
      - 'script/check-md-table-padding.ts'
      - '.github/workflows/check-md-table-padding.yml'
  workflow_dispatch:
jobs:
  check:
    name: Check markdown table padding
    # Guard: a manual dispatch from a fork would otherwise run this check
    # against the fork's own files. For pull_request events github.repository is
    # already the base repo, so the guard is a no-op there and only blocks the
    # fork-triggerable path.
    if: github.repository == 'Kilo-Org/cloud'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
      - name: Run check
        run: bun run script/check-md-table-padding.ts
