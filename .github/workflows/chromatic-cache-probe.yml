name: Chromatic cache probe

on:
  push:
    branches:
      - drain/chromatic-caches

permissions:
  contents: read

jobs:
  probe-blacksmith:
    runs-on: ${{ vars.RUNNER_LARGE_LABEL || 'ubuntu-24.04-8core' }}
    timeout-minutes: 30
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Mount pnpm store
        uses: ./.github/actions/pnpm-store

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Report the mounted store
        run: |
          test -d node_modules/.pnpm-store && echo "mounted store present"
          echo "top-level links: $(find node_modules -maxdepth 1 -type l | wc -l)"

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Report the restored browser tree
        run: ls ~/.cache/ms-playwright || echo "no browser tree before install"

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install chromium

      - name: Launch Chromium
        run: |
          pnpm --filter web exec node -e "
          const { chromium } = require('@playwright/test');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.setContent('<h1>probe</h1>');
            console.log('heading:', await page.textContent('h1'));
            console.log('ua:', await page.evaluate(() => navigator.userAgent));
            await browser.close();
          })();
          "

  probe-bare:
    needs: probe-blacksmith
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Mount pnpm store
        uses: ./.github/actions/pnpm-store

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter 'web...' --filter kilocode-monorepo

      - name: Report the mounted store
        run: |
          test -d node_modules/.pnpm-store && echo "mounted store present"
          echo "top-level links: $(find node_modules -maxdepth 1 -type l | wc -l)"

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Report the restored browser tree
        run: ls ~/.cache/ms-playwright || echo "no browser tree before install"

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install chromium

      - name: Launch Chromium
        run: |
          pnpm --filter web exec node -e "
          const { chromium } = require('@playwright/test');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.setContent('<h1>probe</h1>');
            console.log('heading:', await page.textContent('h1'));
            await browser.close();
          })();
          "