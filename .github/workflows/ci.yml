name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# Cancel in-progress runs when a new commit is pushed to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

# Optional repo/org variables for runner migration:
# - RUNNER_DEFAULT_LABEL=blacksmith-2vcpu-ubuntu-2404
# - RUNNER_MEDIUM_LABEL=blacksmith-4vcpu-ubuntu-2404
# - RUNNER_LARGE_LABEL=blacksmith-8vcpu-ubuntu-2404
jobs:
  changes:
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      # Fall back to the retry attempt when the first Detect changes step died
      # on a transient GitHub API failure (it sets no outputs when it fails).
      kilocode_backend: ${{ steps.filter.outputs.kilocode_backend || steps.filter_retry.outputs.kilocode_backend }}
      cloud_agent_next: ${{ steps.filter.outputs.cloud_agent_next || steps.filter_retry.outputs.cloud_agent_next }}
      # harness-sdk is detected by its own step pair below: the shared pair's
      # filter set is pinned byte-for-byte by scripts/changes-filter-retry.test.mjs
      # and must stay exactly as origin/main wrote it.
      harness_sdk: ${{ steps.filter_harness.outputs.harness_sdk || steps.filter_harness_retry.outputs.harness_sdk }}
      ai_gateway: ${{ steps.filter.outputs.ai_gateway || steps.filter_retry.outputs.ai_gateway }}
      # Detected by its own step pair for the same reason as harness_sdk.
      ai_gateway_secure_proxy: ${{ steps.filter_secure_proxy.outputs.ai_gateway_secure_proxy || steps.filter_secure_proxy_retry.outputs.ai_gateway_secure_proxy }}
      # The diagram host document and its browser checks, also their own pair.
      mobile_diagram_host: ${{ steps.filter_diagram.outputs.mobile_diagram_host || steps.filter_diagram_retry.outputs.mobile_diagram_host }}
      # The session-sync account database suite, also its own pair.
      session_sync: ${{ steps.filter_session_sync.outputs.session_sync || steps.filter_session_sync_retry.outputs.session_sync }}
      # Every input the ci-wiring job reads, also its own pair.
      wiring: ${{ steps.filter_wiring.outputs.wiring || steps.filter_wiring_retry.outputs.wiring }}
      # The resource manifests the detector parses with a dependency
      # (DEPENDENCY_MANIFESTS in scripts/affected-workspaces.mjs). Gates the
      # root install below; its own pair.
      resources: ${{ steps.filter_resources.outputs.resources || steps.filter_resources_retry.outputs.resources }}
      workspace_matrix: ${{ steps.workspaces.outputs.matrix }}
      # JSON from scripts/affected-workspaces.mjs, and the typecheck and lint
      # groups and cloud-agent-next parts it needs.
      affected: ${{ steps.affected.outputs.affected }}
      typecheck_groups: ${{ steps.affected.outputs.typecheck_groups }}
      # The same lists with the trpc row removed. Only the trpc rows read the
      # trpc-declarations artifact, so they get their own jobs and the other
      # rows must not wait for the producer.
      typecheck_groups_non_trpc: ${{ steps.affected.outputs.typecheck_groups_non_trpc }}
      lint_groups: ${{ steps.affected.outputs.lint_groups }}
      lint_groups_non_trpc: ${{ steps.affected.outputs.lint_groups_non_trpc }}
      cloud_agent_next_parts: ${{ steps.affected.outputs.cloud_agent_next_parts }}
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      # dorny/paths-filter has no built-in retry: one dropped connection to
      # api.github.com ("other side closed" while listing the PR's changed
      # files) fails the step and, with it, every check that needs this job.
      # The first attempt is allowed to fail so the retry below absorbs
      # transient resets; a persistent failure still fails the job.
      - name: Detect resource-manifest changes
        id: filter_resources
        continue-on-error: true
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            resources:
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
      - name: Detect resource-manifest changes (retry)
        id: filter_resources_retry
        if: steps.filter_resources.outcome == 'failure'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            resources:
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

      # dorny/paths-filter answers from the pull request's own diff (its
      # merge-base), while scripts/affected-workspaces.mjs diffs the base tip.
      # On a branch that is behind main the two disagree about a manifest main
      # changed after the branch point: only the detector's diff names it, and
      # its run then calls scripts/changed-dependencies.mjs, which imports
      # js-yaml. This check diffs the detector's own base for that run. The
      # manifest list comes from the detector, so the set stays in one place.
      - name: Detect resource-manifest changes against the detector base
        id: resources_base
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
        run: |
          manifests=$(node -e 'import("./scripts/affected-workspaces.mjs").then(module => console.log([...module.DEPENDENCY_MANIFESTS].join("\n")))' 2>/dev/null || true)
          if [ -z "$manifests" ]; then
            # An unreadable detector list cannot prove the diff is clean, so
            # keep the install rather than risk a run without js-yaml.
            echo "manifests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          manifests_changed=false
          # A base that is not a commit in the checkout selects every
          # workspace, and that selection parses no manifest.
          if [ -n "$BASE_SHA" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            while IFS= read -r file; do
              if grep -qxF "$file" <<< "$manifests"; then
                manifests_changed=true
                break
              fi
            done < <(git diff --name-only "$BASE_SHA" HEAD)
          fi
          echo "manifests=$manifests_changed" >> "$GITHUB_OUTPUT"

      # scripts/changed-dependencies.mjs parses a resource manifest with
      # js-yaml when the diff touches one, so the root install runs only on
      # that run: every detection step would otherwise read the repository,
      # not node_modules.
      - name: Mount pnpm store
        uses: ./.github/actions/pnpm-store

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      # The detector runs without the install unless a diff touches a resource
      # manifest, so a wrong skip fails its step and the run.
      - name: Install root dependencies
        if: steps.filter_resources.outputs.resources == 'true' || steps.filter_resources_retry.outputs.resources == 'true' || steps.resources_base.outputs.manifests == 'true'
        run: pnpm --filter kilocode-monorepo install --frozen-lockfile --ignore-scripts

      - name: Detect changes
        id: filter
        continue-on-error: true
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            kilocode_backend:
              - 'apps/web/src/**'
              - 'apps/web/.env'
              - 'apps/web/.env.test'
              - 'apps/web/.env.development.local.example'
              - '.env.local.example'
              - 'apps/web/package.json'
              - 'apps/web/tsconfig.json'
              - 'apps/web/tsconfig.*.json'
              - 'apps/web/next.config.mjs'
              - 'apps/web/ai-gateway-rewrites*.mjs'
              - 'apps/ai-gateway/src/**'
              - 'apps/web/jest.config.ts'
              - 'apps/web/postcss.config.mjs'
              - 'apps/web/sentry.*'
              - 'packages/db/**'
              - 'packages/encryption/**'
              - 'packages/trpc/**'
              - 'packages/web-shared/**'
              - 'packages/worker-utils/**'
              - 'services/session-ingest/**'
              - 'tools/oxlint/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            cloud_agent_next:
              - 'services/cloud-agent-next/**'
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
            ai_gateway:
              - 'apps/ai-gateway/**'
              - 'apps/web/.env'
              - 'apps/web/.env.test'
              - 'packages/**'
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
      - name: Detect changes (retry)
        id: filter_retry
        # Keep the filters byte-identical to the attempt above:
        # scripts/changes-filter-retry.test.mjs fails the job when they drift.
        if: steps.filter.outcome == 'failure'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            kilocode_backend:
              - 'apps/web/src/**'
              - 'apps/web/.env'
              - 'apps/web/.env.test'
              - 'apps/web/.env.development.local.example'
              - '.env.local.example'
              - 'apps/web/package.json'
              - 'apps/web/tsconfig.json'
              - 'apps/web/tsconfig.*.json'
              - 'apps/web/next.config.mjs'
              - 'apps/web/ai-gateway-rewrites*.mjs'
              - 'apps/ai-gateway/src/**'
              - 'apps/web/jest.config.ts'
              - 'apps/web/postcss.config.mjs'
              - 'apps/web/sentry.*'
              - 'packages/db/**'
              - 'packages/encryption/**'
              - 'packages/trpc/**'
              - 'packages/web-shared/**'
              - 'packages/worker-utils/**'
              - 'services/session-ingest/**'
              - 'tools/oxlint/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            cloud_agent_next:
              - 'services/cloud-agent-next/**'
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
            ai_gateway:
              - 'apps/ai-gateway/**'
              - 'apps/web/.env'
              - 'apps/web/.env.test'
              - 'packages/**'
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
      # The harness-sdk filter runs as its own attempt/retry pair: it cannot
      # drift from the shared pair above, whose filter set is pinned by
      # scripts/changes-filter-retry.test.mjs.
      - name: Detect harness-sdk changes
        id: filter_harness
        continue-on-error: true
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            harness_sdk:
              - 'packages/harness-sdk/**'
      - name: Detect harness-sdk changes (retry)
        id: filter_harness_retry
        if: steps.filter_harness.outcome == 'failure'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            harness_sdk:
              - 'packages/harness-sdk/**'
      - name: Detect ai-gateway-secure-proxy changes
        id: filter_secure_proxy
        continue-on-error: true
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            ai_gateway_secure_proxy:
              - 'apps/ai-gateway-secure-proxy/**'
              - 'packages/ai-gateway-secure-proxy-contracts/**'
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
      - name: Detect ai-gateway-secure-proxy changes (retry)
        id: filter_secure_proxy_retry
        if: steps.filter_secure_proxy.outcome == 'failure'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            ai_gateway_secure_proxy:
              - 'apps/ai-gateway-secure-proxy/**'
              - 'packages/ai-gateway-secure-proxy-contracts/**'
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
      - name: Detect diagram host changes
        id: filter_diagram
        continue-on-error: true
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            mobile_diagram_host:
              - 'apps/mobile/src/components/agents/markdown-mermaid*'
              - 'apps/mobile/assets/vendor/mermaid-*'
              - 'apps/web/tests/mobile-mermaid-host/**'
              - 'apps/web/playwright.mobile-mermaid.config.ts'
              - 'apps/web/package.json'
              - '.github/workflows/ci.yml'
              - 'pnpm-lock.yaml'
      - name: Detect diagram host changes (retry)
        id: filter_diagram_retry
        if: steps.filter_diagram.outcome == 'failure'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            mobile_diagram_host:
              - 'apps/mobile/src/components/agents/markdown-mermaid*'
              - 'apps/mobile/assets/vendor/mermaid-*'
              - 'apps/web/tests/mobile-mermaid-host/**'
              - 'apps/web/playwright.mobile-mermaid.config.ts'
              - 'apps/web/package.json'
              - '.github/workflows/ci.yml'
              - 'pnpm-lock.yaml'
      - name: Detect session-sync changes
        id: filter_session_sync
        continue-on-error: true
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            session_sync:
              - 'services/session-sync/**'
              - 'packages/db/**'
              - 'packages/worker-utils/**'
              - '.github/workflows/ci.yml'
              - 'pnpm-lock.yaml'
      - name: Detect session-sync changes (retry)
        id: filter_session_sync_retry
        if: steps.filter_session_sync.outcome == 'failure'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            session_sync:
              - 'services/session-sync/**'
              - 'packages/db/**'
              - 'packages/worker-utils/**'
              - '.github/workflows/ci.yml'
              - 'pnpm-lock.yaml'
      # The ci-wiring job reads more than one workflow: two of its suites scan
      # .github/workflows/ as a directory, so every workflow there is an input.
      # The paths below are the inputs those suites read, each one taken from
      # the suite that reads it: the workflows and the actions their cache keys
      # hash, the scripts they execute, the workspace manifests and the lockfile
      # they parse, the files two suites copy into a fixture root, and the node
      # version and install policy every step runs on. A path that cannot reach
      # one of them belongs elsewhere; a wider list only costs this one job.
      - name: Detect wiring changes
        id: filter_wiring
        continue-on-error: true
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            wiring:
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'scripts/**'
              - 'services/cloud-agent-next/scripts/**'
              - 'services/usage-ingest/scripts/provision-queues.mjs'
              - 'packages/harness-sdk/tsconfig.json'
              - 'package.json'
              - '**/package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'patches/**'
              - 'apps/mobile/eas.json'
              - '.gitignore'
              - '.nvmrc'
              - '.npmrc'
      - name: Detect wiring changes (retry)
        id: filter_wiring_retry
        if: steps.filter_wiring.outcome == 'failure'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            wiring:
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'scripts/**'
              - 'services/cloud-agent-next/scripts/**'
              - 'services/usage-ingest/scripts/provision-queues.mjs'
              - 'packages/harness-sdk/tsconfig.json'
              - 'package.json'
              - '**/package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'patches/**'
              - 'apps/mobile/eas.json'
              - '.gitignore'
              - '.nvmrc'
              - '.npmrc'
      # A pull request and a main push both check only the workspaces their own
      # diff can affect: the pull request the branch's base, the push the commit
      # main moved from. The merge queue passes no base, so it still checks
      # every workspace as the last gate before a merge. A base that is not a
      # commit in the checkout (a first push or a force push) selects every
      # workspace too. The document names the base it was computed for, so the
      # matrix step below reuses it instead of selecting the repository again.
      - name: Detect affected workspaces
        id: affected
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
          CLOUD_AGENT_NEXT_CHANGED: ${{ steps.filter.outputs.cloud_agent_next || steps.filter_retry.outputs.cloud_agent_next }}
        run: |
          affected=$(node scripts/affected-workspaces.mjs "$BASE_SHA")
          jq . <<< "$affected"
          # The matrix groups this selection pays for. scripts/affected-workspaces.mjs
          # owns the decision, so the trpc rows follow the extension's own
          # workflow: extension-ci.yml typechecks and lints the extension for
          # this same selection, so those rows run only on a full check. That
          # keeps the extension's gate on the merge queue, whose workflow has no
          # extension trigger.
          groups=$(node scripts/affected-workspaces.mjs --groups <<< "$affected")
          # Only the trpc rows read the trpc-declarations artifact, so those
          # rows get their own jobs. These lists drive the matrices that must
          # start as soon as `changes` completes.
          typecheck_groups_non_trpc=$(jq -c '[.typecheck_groups[] | select(. != "trpc")]' <<< "$groups")
          lint_groups_non_trpc=$(jq -c '[.lint_groups[] | select(. != "trpc")]' <<< "$groups")
          # Every part when cloud-agent-next is affected. When only its tests
          # read changed data, the unit part covers a reading test under src/,
          # scripts/ or test/unit/; any other reading test runs every part.
          cloud_agent_next_parts=$(jq -c --arg changed "$CLOUD_AGENT_NEXT_CHANGED" '
            ["unit", "workers", "wrapper-process", "other"] as $all |
            if $changed == "true" or (.packages | index("cloud-agent-next")) then $all
            else [.test_only_files[] | select(startswith("services/cloud-agent-next/"))
              | if test("^services/cloud-agent-next/(src|scripts|test/unit)/.+\\.test\\.ts$") then "unit" else $all[] end
            ] | unique end' <<< "$affected")
          {
            echo "affected=$(jq -c . <<< "$affected")"
            echo "typecheck_groups=$(jq -c .typecheck_groups <<< "$groups")"
            echo "typecheck_groups_non_trpc=$typecheck_groups_non_trpc"
            echo "lint_groups=$(jq -c .lint_groups <<< "$groups")"
            echo "lint_groups_non_trpc=$lint_groups_non_trpc"
            echo "cloud_agent_next_parts=$cloud_agent_next_parts"
          } >> "$GITHUB_OUTPUT"

      # Also test the workspaces whose tests read changed data
      # (test_only_dirs); their typecheck and lint stay skipped. The matrix
      # decides from the document the step above published, so one run selects
      # the repository once.
      - name: Detect changed workspaces with tests
        id: workspaces
        env:
          AFFECTED: ${{ steps.affected.outputs.affected }}
          HARNESS_SDK: ${{ steps.filter_harness.outputs.harness_sdk || steps.filter_harness_retry.outputs.harness_sdk }}
        run: |
          mapfile -t includes < <(jq -r '.test_only_dirs[] | ("--include", .)' <<< "$AFFECTED")
          excludes=(--exclude services/cloud-agent-next --exclude apps/web --exclude apps/mobile)
          # The dedicated harness-sdk job runs the same vitest suite through
          # check:ci when the filter matches, so the matrix entry only repeats
          # it. A dependency-driven selection (lockfile change, filter false)
          # keeps calling for it.
          if [ "$HARNESS_SDK" = "true" ]; then
            excludes+=(--exclude packages/harness-sdk)
          fi
          matrix=$(scripts/changed-workspaces.sh "${excludes[@]}" "${includes[@]}")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # The workflow wiring suites and the checks that read the workflows. No job
  # waits for this one, so it adds no time before the workspace checks start;
  # the required `test` job needs it, so a failure still blocks the merge.
  # Every suite here parses .github/workflows/ or the scripts that select
  # workspaces, so a run that changes none of the paths the `wiring` filter lists
  # cannot change a result here. On such a run the job is skipped, and the `test`
  # fan-in passes a skipped job. The plugin contract checks this job used to
  # carry now run in their own job: their inputs are product files rather than
  # workflow wiring, so gating them here would skip them on the very changes
  # they protect.
  ci-wiring:
    needs: changes
    if: needs.changes.outputs.wiring == 'true'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Mount pnpm store
        uses: ./.github/actions/pnpm-store

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      - name: Install root dependencies
        run: pnpm --filter kilocode-monorepo install --frozen-lockfile --ignore-scripts

      - name: Check runtime publication workflow admission
        run: pnpm --filter cloud-agent-next test:runtime-ci

      # The relay regression executes Wrangler's real config parser.
      - name: Install usage-ingest deployment test dependencies
        run: pnpm --filter cloudflare-usage-ingest install --frozen-lockfile --ignore-scripts

      # The stacked-CI admission runs on every change to a wiring input. All
      # wiring suites run in one invocation: the test runner starts the named
      # files concurrently, so the step pays one start-up and one parse of the
      # YAML they share. The job is off the critical path, and the required
      # `test` job needs it, so a broken admission still blocks the merge.
      # sbom.yml is only reached by a PR that changes the workflow or its test,
      # and that path set does not trip the kilocode_backend filter that gates
      # test-scripts, so its wiring check runs here. This list is the only place
      # that suite runs: the `test:mobile-sbom` script that test-scripts reaches
      # must not name it, or one run executes the file in two jobs.
      - name: Test workflow wiring
        run: >-
          node --test
          scripts/stacked-ci.test.mjs
          scripts/changed-dependencies.test.mjs
          scripts/build-key-inputs.test.mjs
          scripts/ttsc-plugin-key.test.mjs
          scripts/affected-workspaces.test.mjs
          scripts/changed-workspaces.test.mjs
          scripts/changes-filter-retry.test.mjs
          scripts/typecheck-ci.test.mjs
          scripts/deployment-workflows.test.mjs
          scripts/main-workflow-failure.test.mjs
          scripts/production-deploy-failure.test.mjs
          scripts/meta-janitor-approve.test.mjs
          scripts/mobile-sbom-workflow.test.mjs

      # The same gap for the release workflow: a PR that changes it or its test
      # does not trip the backend filter either, so its wiring checks run here
      # and a workflow change cannot drop a release gate unnoticed. This step is
      # the only place the suite runs, for the same reason as the list above.
      - name: Test release workflow wiring
        run: node --test scripts/kilo-app-release-workflow.test.mjs

  # The bundled plugins' contract checks: each plugin's copy of the shared wire
  # schemas must match the package it is synced from, and every exact runtime pin
  # must match the version the image installs. Both read product files rather
  # than the workflows, so a path filter that gates them would have to name those
  # product paths. This job therefore runs on every run, installs nothing, and
  # the required `test` job needs it, so a drift still blocks the merge.
  plugin-contract:
    needs: changes
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      - name: Plugin shared-schemas sync check
        run: bash scripts/sync-plugin-shared.sh --check

      - name: Plugin openclaw peer-dep pin check
        run: bash scripts/check-plugin-openclaw-pin.sh

  # One producer for the tRPC declarations. Both matrices used to run the
  # trpc-declarations action behind `matrix.group == 'trpc'`, so a cache miss
  # compiled the same declaration program in two 4 vCPU jobs that started
  # together, and both raced to save the one cache key. The cache stays here;
  # the two trpc rows below, each its own job, download the built tree instead
  # of building it again.
  trpc-declarations:
    needs: changes
    # Only the trpc rows consume the declarations, so only they wait for this
    # job. The web and packages typecheck rows and the lint-rest row run in
    # jobs that need `changes` alone and never read packages/trpc/dist.
    if: contains(fromJSON(needs.changes.outputs.typecheck_groups), 'trpc') || contains(fromJSON(needs.changes.outputs.lint_groups), 'trpc')
    runs-on: ${{ vars.RUNNER_MEDIUM_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Mount pnpm store
        uses: ./.github/actions/pnpm-store

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      # Only the two dependency closures this job reads and the root project are
      # installed. The composite action below builds `@kilocode/trpc` alone, but
      # that declaration program also reads web-shared and apps/web sources
      # through their path aliases. Widen the filter when a step here imports a
      # workspace outside these closures.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter '@kilocode/trpc...' --filter 'web...' --filter kilocode-monorepo

      - name: Restore or build tRPC declarations
        uses: ./.github/actions/trpc-declarations

      - name: Upload tRPC declarations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trpc-declarations
          path: packages/trpc/dist
          retention-days: 1
          # A hit that restored nothing must fail here, not in a consumer.
          if-no-files-found: error

  # The typecheck rows that read no trpc-declarations artifact. They need
  # `changes` alone, so they start as soon as the group lists exist.
  typecheck-groups:
    needs: changes
    if: needs.changes.outputs.typecheck_groups_non_trpc != '[]'
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.changes.outputs.typecheck_groups_non_trpc) }}
    name: typecheck (${{ matrix.group }})
    # tsgo loads the whole web program, which outgrows the 8 GB of the default
    # 2 vCPU runner. The 4 vCPU runner has 16 GB.
    runs-on: ${{ vars.RUNNER_MEDIUM_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Mount pnpm store
        uses: ./.github/actions/pnpm-store

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The harness-sdk row of workspace-tests saves the compiled plugin; this
      # group only reads it, so a skipped saver costs a compile, never a failure.
      - name: Restore compiler plugins
        uses: ./.github/actions/ttsc-plugin-cache

      - name: Typecheck
        env:
          KILO_AFFECTED: ${{ needs.changes.outputs.affected }}
        run: scripts/typecheck-all.sh --group ${{ matrix.group }}

  # The trpc typecheck row: the extension group, the only typecheck row that
  # reads the trpc-declarations artifact. `always()` makes a failed producer
  # surface as a failed download here instead of a quietly skipped row the
  # aggregator would pass, and it lets a run with no trpc typecheck row skip
  # this job alone. A failed `changes` job keeps it skipped, because its
  # outputs carry no group list.
  typecheck-trpc:
    needs: [changes, trpc-declarations]
    if: always() && needs.changes.result == 'success' && contains(fromJSON(needs.changes.outputs.typecheck_groups), 'trpc')
    name: typecheck (trpc)
    # tsgo loads the whole web program, which outgrows the 8 GB of the default
    # 2 vCPU runner. The 4 vCPU runner has 16 GB.
    runs-on: ${{ vars.RUNNER_MEDIUM_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Mount pnpm store
        uses: ./.github/actions/pnpm-store

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The harness-sdk row of workspace-tests saves the compiled plugin; this
      # group only reads it, so a skipped saver costs a compile, never a failure.
      - name: Restore compiler plugins
        uses: ./.github/actions/ttsc-plugin-cache

      - name: Download tRPC declarations
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: trpc-declarations
          path: packages/trpc/dist

      - name: Typecheck
        env:
          KILO_AFFECTED: ${{ needs.changes.outputs.affected }}
          # The download above is the build, so the script must not rebuild it.
          KILO_TYPECHECK_TRPC_BUILT: '1'
        run: scripts/typecheck-all.sh --group trpc

  # Required check. Skipped groups (nothing affected) pass; a failed or
  # cancelled group fails this job.
  typecheck:
    needs: [changes, typecheck-groups, typecheck-trpc]
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Check typecheck results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if jq -e 'any(.[]; . == "failure" or . == "cancelled")' <<< "$RESULTS" > /dev/null; then
            exit 1
          fi

  # The lint rows that read no trpc-declarations artifact. They need `changes`
  # alone, so they start as soon as the group lists exist.
  lint-groups:
    needs: changes
    if: needs.changes.outputs.lint_groups_non_trpc != '[]'
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.changes.outputs.lint_groups_non_trpc) }}
    name: lint (${{ matrix.group }})
    # Type-aware lint loads the same program as the typecheck groups.
    runs-on: ${{ vars.RUNNER_MEDIUM_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Mount pnpm store
        uses: ./.github/actions/pnpm-store

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        env:
          KILO_AFFECTED: ${{ needs.changes.outputs.affected }}
        run: scripts/lint-all.sh --group ${{ matrix.group }}

  # The trpc lint row: the extension sources lint against the built tRPC types,
  # and the only lint row that reads the trpc-declarations artifact. `always()`
  # makes a failed producer surface as a failed download here instead of a
  # quietly skipped row the aggregator would pass, and it lets a run with no
  # trpc lint row skip this job alone. A failed `changes` job keeps it skipped,
  # because its outputs carry no group list.
  lint-trpc:
    needs: [changes, trpc-declarations]
    if: always() && needs.changes.result == 'success' && contains(fromJSON(needs.changes.outputs.lint_groups), 'trpc')
    name: lint (trpc)
    # Type-aware lint loads the same program as the typecheck groups.
    runs-on: ${{ vars.RUNNER_MEDIUM_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Mount pnpm store
        uses: ./.github/actions/pnpm-store

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download tRPC declarations
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: trpc-declarations
          path: packages/trpc/dist

      # A full lint also covers apps/mobile, which needs the harness SDK build.
      - name: Restore or build the harness SDK
        if: contains(fromJSON(needs.changes.outputs.affected).full_checks, 'lint')
        uses: ./.github/actions/harness-sdk-build

      - name: Lint
        env:
          KILO_AFFECTED: ${{ needs.changes.outputs.affected }}
        run: scripts/lint-all.sh --group trpc

  # Required check. Skipped groups (nothing affected) pass; a failed or
  # cancelled group fails this job.
  lint:
    needs: [changes, lint-groups, lint-trpc]
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Check lint results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if jq -e 'any(.[]; . == "failure" or . == "cancelled")' <<< "$RESULTS" > /dev/null; then
            exit 1
          fi

  format-check:
    needs: changes
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Mount pnpm store
        uses: ./.github/actions/pnpm-store

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      # oxfmt is a root dev dependency; the workspace packages are not needed.
      - name: Install dependencies
        run: pnpm --filter kilocode-monorepo install --frozen-lockfile --ignore-scripts

      - name: Format check
        run: |
          pnpm run format:check || {
            echo "::error::oxfmt formatting check failed. Please run 'pnpm run format' locally and commit the changes before pushing."
            exit 1
          }

  drizzle-check:
    needs: changes
    if: fromJSON(needs.changes.outputs.affected).full || contains(fromJSON(needs.changes.outputs.affected).packages, '@kilocode/db')
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Mount pnpm store
        uses: ./.github/actions/pnpm-store

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter '@kilocode/db...' --filter kilocode-monorepo

      - name: Drizzle check
        run: pnpm drizzle check
        env:
          POSTGRES_URL: postgresql://unused:unused@localhost:5432/unused

  # The web Jest suite is the slowest suite in CI. Eight shards run it in
  # parallel; the `test` job below reports the combined result under the
  # required check name. It also runs when a web test reads changed data.
  web-test:
    needs: changes
    if: needs.changes.outputs.kilocode_backend == 'true' || contains(fromJSON(needs.changes.outputs.affected).test_only_packages, 'web')
    name: web-test (${{ matrix.shard }}/8)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ${{ vars.RUNNER_LARGE_LABEL || 'ubuntu-24.04-8core' }}
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 25
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --tmpfs /data
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 25
      redis-http:
        image: hiett/serverless-redis-http:0.0.10
        env:
          SRH_MODE: env
          SRH_TOKEN: example_token
          SRH_CONNECTION_STRING: redis://redis:6379
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:80/ >/dev/null || exit 1"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 25
        ports:
          - 8079:80

    env:
      NODE_ENV: test
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
      POSTGRES_CONNECT_TIMEOUT: 30000
      POSTGRES_MAX_QUERY_TIME: 30000
      UPSTASH_REDIS_REST_URL: http://localhost:8079
      UPSTASH_REDIS_REST_TOKEN: example_token
      JEST_MAX_WORKERS: 4

    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Mount pnpm store
        uses: ./.github/actions/pnpm-store

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      # The shards run one Jest suite, and that suite reads four projects: web,
      # its web-shared and db dependencies, and ai-gateway, whose src is one of
      # its roots. Only those closures and the root project are installed, so a
      # shard stops linking the workspaces its Jest run never reads. Widen the
      # filter when a step here imports a workspace outside the closure.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter 'web...' --filter 'ai-gateway...' --filter kilocode-monorepo

      - name: Run web tests
        run: pnpm --filter web test --shard=${{ matrix.shard }}/8

  test-scripts:
    needs: changes
    if: needs.changes.outputs.kilocode_backend == 'true'
    # The Postgres regressions ran on the large runner in the job this one
    # replaces. The builder cleanup test drives two claims against the same
    # rows, so keep the runner it was written for.
    runs-on: ${{ vars.RUNNER_LARGE_LABEL || 'ubuntu-24.04-8core' }}
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 25
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --tmpfs /data
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 25
      redis-http:
        image: hiett/serverless-redis-http:0.0.10
        env:
          SRH_MODE: env
          SRH_TOKEN: example_token
          SRH_CONNECTION_STRING: redis://redis:6379
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:80/ >/dev/null || exit 1"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 25
        ports:
          - 8079:80

    env:
      NODE_ENV: test
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
      POSTGRES_CONNECT_TIMEOUT: 30000
      POSTGRES_MAX_QUERY_TIME: 30000
      UPSTASH_REDIS_REST_URL: http://localhost:8079
      UPSTASH_REDIS_REST_TOKEN: example_token
      JEST_MAX_WORKERS: 2

    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Mount pnpm store
        uses: ./.github/actions/pnpm-store

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run script tests
        run: pnpm run test:scripts

      - name: Run container usage Postgres tests
        # The meter suite connects to POSTGRES_URL directly. Avoid the Jest worker
        # suffix that computeDatabaseUrl adds whenever NODE_ENV=test.
        run: NODE_ENV=development pnpm drizzle migrate && pnpm --filter container-usage-meter test:postgres

      - name: Run Session Ingest Durable Object regressions
        run: pnpm --filter cloudflare-session-ingest run test:integration

      - name: Run Session Ingest Postgres tests
        run: NODE_ENV=development pnpm --filter cloudflare-session-ingest test:postgres

  # In its own job, madge runs beside the script tests instead of before them.
  dependency-cycle-check:
    needs: changes
    if: needs.changes.outputs.kilocode_backend == 'true'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Mount pnpm store
        uses: ./.github/actions/pnpm-store

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      # Only the web app's dependency closure and the root project are
      # installed: the step below runs `--filter web`. Widen the filter when a
      # step here imports a workspace outside the closure.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter 'web...' --filter kilocode-monorepo

      - name: Dependency cycle check
        run: pnpm run dependency-cycle-check

  # Required check. A skipped job (nothing relevant changed) passes; a failed
  # or cancelled job fails this one. Besides the web tests it covers the
  # workspace tests, the dependency cycle check, drizzle-check, harness-sdk, the
  # plugin contract checks and the ai-gateway builds, which have no required
  # check of their own.
  test:
    needs:
      - changes
      - ci-wiring
      - plugin-contract
      - web-test
      - test-scripts
      - dependency-cycle-check
      - workspace-tests
      - drizzle-check
      - harness-sdk
      - mobile-diagram-host
      - session-sync-postgres
      - build-ai-gateway
      - build-ai-gateway-secure-proxy
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Check test results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if jq -e 'any(.[]; . == "failure" or . == "cancelled")' <<< "$RESULTS" > /dev/null; then
            exit 1
          fi

  build:
    needs: changes
    if: needs.changes.outputs.kilocode_backend == 'true'
    runs-on: ${{ vars.RUNNER_LARGE_LABEL || 'ubuntu-24.04-8core' }}
    timeout-minutes: 30
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        # next.config.mjs fails the build unless public/kilo-anim.mp4 is the
        # real LFS object, so this job keeps LFS.
        with:
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Mount pnpm store
        uses: ./.github/actions/pnpm-store

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ github.workspace }}/apps/web/.next/cache
          # Key on the build inputs, not the commit: a cache entry is immutable,
          # so a key that carries github.sha writes a new entry on every run for
          # one dependency graph. The lockfile digest keeps its own segment, so
          # the prefix restore-key below still matches this key when only a
          # source file changed, which also reaches the sha-keyed entries left
          # by earlier runs. The source globs stay inside the app tree, so none
          # of them walks node_modules.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**/*', 'apps/web/*.mjs', 'apps/web/*.ts', 'apps/web/*.tsx', 'apps/web/*.json', 'apps/web/.env', 'apps/web/.env.test') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Setup dummy build env
        working-directory: apps/web
        run: cp .env.test .env.production.local

      - name: Build application
        env:
          NODE_ENV: production
          VERCEL_ENV: production
          NEXTAUTH_URL: https://ci-build.invalid
          POSTGRES_URL: postgres://unused:unused@localhost:5432/unused
          UPSTASH_REDIS_REST_URL: https://redis.test.invalid
          UPSTASH_REDIS_REST_TOKEN: dummy-test-redis-token
          SENTRY_AUTH_TOKEN: ''
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: pnpm run build

  build-ai-gateway:
    needs: changes
    if: needs.changes.outputs.ai_gateway == 'true' && (fromJSON(needs.changes.outputs.affected).full || contains(fromJSON(needs.changes.outputs.affected).packages, 'ai-gateway'))
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Mount pnpm store
        uses: ./.github/actions/pnpm-store

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      # Only this app's dependency closure and the root project are installed:
      # every step below runs `--filter ai-gateway`. Widen the filter when a
      # step here imports a workspace outside the closure, as
      # build-ai-gateway-secure-proxy does.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter 'ai-gateway...' --filter kilocode-monorepo

      - name: Cache Next.js build
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ github.workspace }}/apps/ai-gateway/.next/cache
          # Same input-keyed scheme as the web build cache: the lockfile digest
          # is its own segment so the prefix restore-key below still matches.
          # The job copies apps/web/.env and apps/web/.env.test into the app
          # before building, so those files are build inputs here too.
          key: ${{ runner.os }}-nextjs-ai-gateway-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/ai-gateway/src/**/*', 'apps/ai-gateway/*.mjs', 'apps/ai-gateway/*.json', 'apps/web/.env', 'apps/web/.env.test') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-ai-gateway-${{ hashFiles('pnpm-lock.yaml') }}-

      # The app runs with the web app's environment; see apps/ai-gateway/scripts/dev.sh.
      - name: Setup dummy build env
        working-directory: apps/ai-gateway
        run: |
          cp ../web/.env .env
          cp ../web/.env.test .env.production.local

      - name: Check ai-gateway usage queue targets
        run: pnpm --filter ai-gateway run test:usage-queue

      - name: Build ai-gateway
        env:
          NODE_ENV: production
          VERCEL_ENV: production
          NEXTAUTH_URL: https://ci-build.invalid
          POSTGRES_URL: postgres://unused:unused@localhost:5432/unused
          UPSTASH_REDIS_REST_URL: https://redis.test.invalid
          UPSTASH_REDIS_REST_TOKEN: dummy-test-redis-token
          SENTRY_AUTH_TOKEN: ''
        run: pnpm --filter ai-gateway run build

  build-ai-gateway-secure-proxy:
    needs: changes
    if: needs.changes.outputs.ai_gateway_secure_proxy == 'true'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Mount pnpm store
        uses: ./.github/actions/pnpm-store

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter 'ai-gateway-secure-proxy...' --filter kilocode-monorepo

      - name: Build ai-gateway-secure-proxy
        env:
          NODE_ENV: production
        run: pnpm --filter ai-gateway-secure-proxy run build

  cloud-agent-next:
    needs: changes
    # On a pull request, also run when a dependency of cloud-agent-next
    # changed (for example packages/db), or only the parts that hold a test
    # reading changed data (cloud_agent_next_parts). Main pushes and the merge
    # queue keep the path filter alone.
    if: >-
      needs.changes.outputs.cloud_agent_next == 'true' ||
      (github.event_name == 'pull_request' &&
      needs.changes.outputs.cloud_agent_next_parts != '[]')
    # The suite runs as four parallel parts; test:all chains the same suites.
    strategy:
      fail-fast: false
      matrix:
        # unit, workers, wrapper-process and other. process.test.ts alone
        # takes about as long as the rest of the wrapper suite, so it runs as
        # its own part.
        part: ${{ fromJSON(needs.changes.outputs.cloud_agent_next_parts) }}
    name: cloud-agent-next (${{ matrix.part }})
    runs-on: ${{ vars.RUNNER_LARGE_LABEL || 'ubuntu-24.04-8core' }}
    timeout-minutes: 15

    env:
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres

    # Only the `other` part runs the Postgres tests. An empty image skips the
    # service container.
    services:
      postgres:
        image: ${{ matrix.part == 'other' && 'pgvector/pgvector:pg16' || '' }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 25
        ports:
          - 5432:5432

    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Mount pnpm store
        uses: ./.github/actions/pnpm-store

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run cloud-agent-next unit tests
        if: matrix.part == 'unit'
        run: pnpm --filter cloud-agent-next test

      - name: Build runtime artifacts for Worker integration tests
        if: matrix.part == 'workers'
        run: pnpm --filter cloud-agent-next build:wrapper

      - name: Run cloud-agent-next Workers tests
        if: matrix.part == 'workers'
        run: pnpm --filter cloud-agent-next test:integration

      - name: Build wrapper bundles with isolated production dependencies
        if: matrix.part == 'other'
        run: |
          build_dir=$(mktemp -d "$RUNNER_TEMP/wrapper-build.XXXXXX")
          trap 'rm -rf "$build_dir"' EXIT

          # Match Dockerfile inputs without access to workspace node_modules.
          tar -C services/cloud-agent-next --exclude=node_modules --exclude=dist \
            -cf - wrapper src/shared | tar -C "$build_dir" -xf -
          cd "$build_dir/wrapper"
          bun install --production
          ln -sfn "$build_dir/wrapper/node_modules" "$build_dir/node_modules"
          bun run build.ts --install-dir "$build_dir/bin"

      - name: Test cloud-agent-next checkers
        if: matrix.part == 'other'
        run: pnpm --filter cloud-agent-next test:checkers

      - name: Check cloud-agent-next duplication
        if: matrix.part == 'other'
        run: pnpm --filter cloud-agent-next check:duplication

      - name: Run the wrapper process tests
        if: matrix.part == 'wrapper-process'
        working-directory: services/cloud-agent-next/wrapper
        run: bun test ./src/control-plane/process.test.ts

      # Every other wrapper test file, in bun's own discovery order: some
      # files mock modules for the whole process, so the order matters.
      - name: Run the other wrapper tests
        if: matrix.part == 'other'
        working-directory: services/cloud-agent-next/wrapper
        run: bun test src --path-ignore-patterns='**/control-plane/process.test.ts'

      - name: Run Cloud Agent Postgres aggregate tests
        if: matrix.part == 'other'
        run: NODE_ENV=development pnpm drizzle migrate && pnpm --filter cloud-agent-next test:postgres

  harness-sdk:
    needs: changes
    if: needs.changes.outputs.harness_sdk == 'true'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Mount pnpm store
        uses: ./.github/actions/pnpm-store

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The check below builds the SDK, so this job stores the plugin cache.
      - name: Restore compiler plugins
        id: plugins
        uses: ./.github/actions/ttsc-plugin-cache

      # Everything but the timing gate, which needs a machine nobody else is
      # using. The migration check is why this job exists: the store's SQL is
      # inlined into the bundle, and nothing at run time notices when the
      # inlined copy stops matching the schema.
      - name: Check harness-sdk
        run: pnpm --filter @kilocode/harness-sdk check:ci

      - name: Save compiler plugins
        if: steps.plugins.outputs.cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: node_modules/.cache/ttsc/plugins
          key: ${{ runner.os }}-${{ runner.arch }}-ttsc-plugins-${{ steps.plugins.outputs.key }}

  mobile-diagram-host:
    needs: changes
    if: needs.changes.outputs.mobile_diagram_host == 'true'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Mount pnpm store
        uses: ./.github/actions/pnpm-store

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      # Only the web app's dependency closure and the root project are
      # installed: every step below runs `pnpm --filter web`. Widen the filter
      # when a step here imports a workspace outside the closure.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter 'web...' --filter kilocode-monorepo

      # The version comes from the dependency graph this install just built, so
      # a bump to @playwright/test changes the key and downloads the matching
      # build. No restore-keys: an older browser tree never satisfies the
      # install and would only grow the cached entry.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}

      # No --with-deps: the runner image already ships the Chromium system
      # libraries, and the apt-get behind --with-deps can hang until the job
      # timeout when the fleet's apt egress degrades.
      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install chromium

      - name: Check the diagram host page in a browser
        run: pnpm --filter web run test:mobile-mermaid

  session-sync-postgres:
    needs: changes
    if: needs.changes.outputs.session_sync == 'true'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 25
        ports:
          - 5432:5432

    env:
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Mount pnpm store
        uses: ./.github/actions/pnpm-store

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The exchange suite reads the real account tables. Avoid the Jest worker
      # suffix that computeDatabaseUrl adds whenever NODE_ENV=test.
      - name: Run session-sync account database tests
        run: NODE_ENV=development pnpm drizzle migrate && pnpm --filter cloudflare-session-sync test:postgres

  workspace-tests:
    needs: changes
    if: ${{ needs.changes.outputs.workspace_matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJson(needs.changes.outputs.workspace_matrix) }}
    name: test (${{ matrix.workspace.name }})
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Mount pnpm store
        uses: ./.github/actions/pnpm-store

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      # A full install: several workspace suites import other workspaces
      # without declaring them (kiloclaw reaches kiloclaw-billing and
      # event-service), and packages/harness-sdk documents that a filtered
      # install breaks its ttsx transform.
      #
      # The extension row installs and tests only in the merge queue, which
      # extension-ci.yml does not enter: on a pull request and a main push that
      # workflow's `verify` runs the same `pnpm --filter kilo-extension test`
      # behind its own install. The row stays in the matrix so the check keeps
      # reporting on every run, and a skipped step passes the required `test`.
      - name: Install dependencies
        if: matrix.workspace.name != 'kilo-extension' || github.event_name == 'merge_group'
        run: pnpm install --frozen-lockfile

      # The harness SDK's own vitest run compiles the typia plugin through
      # @ttsc/unplugin, and this row is selected whenever the plugin key moves,
      # so it is the one job that saves the compiled plugin. kilo-app is not in
      # this matrix: its sharded suite runs in kilo-app CI.
      - name: Restore compiler plugins
        id: plugins
        if: matrix.workspace.name == '@kilocode/harness-sdk'
        uses: ./.github/actions/ttsc-plugin-cache

      - name: Run tests
        if: matrix.workspace.name != 'kilo-extension' || github.event_name == 'merge_group'
        run: pnpm --filter ${{ matrix.workspace.name }} test

      # Stores what the run compiled, unless this run selected the harness-sdk
      # job, which stores it then.
      - name: Save compiler plugins
        if: matrix.workspace.name == '@kilocode/harness-sdk' && steps.plugins.outputs.cache-hit != 'true' && needs.changes.outputs.harness_sdk != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: node_modules/.cache/ttsc/plugins
          key: ${{ runner.os }}-${{ runner.arch }}-ttsc-plugins-${{ steps.plugins.outputs.key }}

      # test-scripts runs the whole test/integration set through
      # `test:integration` when the kilocode_backend filter matches, so this
      # file would run in two jobs of one run. Keep the step for the selection
      # that misses that filter, a dependency or test-only change that still
      # selects this row, where it is the only place the file runs.
      - name: Test native heartbeat attachment compatibility
        if: matrix.workspace.name == 'cloudflare-session-ingest' && needs.changes.outputs.kilocode_backend != 'true'
        run: pnpm --filter cloudflare-session-ingest run test:integration test/integration/user-connection-attachment.test.ts
