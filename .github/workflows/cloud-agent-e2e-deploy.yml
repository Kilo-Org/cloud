name: Cloud Agent E2E deploy

on:
  workflow_dispatch:
    inputs:
      runtime_source_sha:
        # Only main publishes a runtime. A dispatch from a branch must name a
        # main SHA, and an empty input falls back to the run SHA, which the
        # resolution step then requires to be a main commit as well.
        description: 'Main SHA whose published runtime to use; empty uses the run SHA, which must be a main commit'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      runtime_source_sha:
        description: 'Main SHA whose published runtime to use; empty uses the run SHA, which must be a main commit'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  # Preparation can read this SHA's runtime-publication workflow runs.
  actions: read

concurrency:
  group: cloud-agent-e2e-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Guard: this workflow_dispatch is reachable from a fork, and the job
    # deploys Workers with admin secrets against production Postgres and R2.
    # Only the canonical repo may run it.
    if: github.repository == 'Kilo-Org/cloud'
    runs-on: ubuntu-latest
    # Runtime preparation may wait up to 45 minutes for the exact-SHA handoff.
    timeout-minutes: 75
    env:
      FAKE_LLM_WORKER_URL: https://fake-llm.engineering-e11.workers.dev
    steps:
      # Admission code and history come from main, never from the caller-named
      # revision, and full history is what the ancestry check reads.
      - name: Checkout main for admission
        uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      # Only main publishes a runtime, so the runtime source must be a main
      # commit. Refusing here costs a second; preparation would wait up to 45
      # minutes for a publication that can never arrive.
      - name: Verify the runtime source is a main commit
        id: runtime_source
        env:
          SOURCE_SHA: ${{ inputs.runtime_source_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::runtime_source_sha must be a full 40-character hexadecimal commit SHA"
            exit 1
          fi
          SOURCE_SHA="${SOURCE_SHA,,}"
          if ! git rev-parse --verify --quiet "$SOURCE_SHA^{commit}" > /dev/null; then
            echo "::error::runtime_source_sha is not a commit on main; a branch dispatch must name a main SHA"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SOURCE_SHA" origin/main; then
            echo "::error::runtime_source_sha is not on origin/main; a branch dispatch must name a main SHA"
            exit 1
          fi
          echo "runtime_source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout the runtime source
        uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          ref: ${{ steps.runtime_source.outputs.runtime_source_sha }}
          lfs: true

      # The prepared config is rendered from the runtime SHA's Worker config, so
      # the run SHA may borrow the runtime only when the two agree. Comparing
      # here costs one shallow fetch and fails before preparation, which can
      # wait up to 45 minutes for a publication the run could never use.
      - name: Verify the run SHA shares the runtime Worker config
        if: steps.runtime_source.outputs.runtime_source_sha != github.sha
        env:
          RUNTIME_SOURCE_SHA: ${{ steps.runtime_source.outputs.runtime_source_sha }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$RUN_SHA"
          if ! git diff --quiet "$RUNTIME_SOURCE_SHA" "$RUN_SHA" -- \
            services/cloud-agent-next/wrangler.jsonc \
            services/cloud-agent-next/runtime-targets.json; then
            echo "::error::wrangler.jsonc or runtime-targets.json differs from the runtime SHA"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Prepare downloaded Cloud Agent runtime
        working-directory: services/cloud-agent-next
        env:
          SOURCE_SHA: ${{ steps.runtime_source.outputs.runtime_source_sha }}
          RUNTIME_R2_ACCOUNT_ID: ${{ vars.CLOUD_AGENT_RUNTIME_ACCOUNT_ID }}
          RUNTIME_R2_BUCKET: ${{ vars.CLOUD_AGENT_RUNTIME_BUCKET }}
          RUNTIME_R2_ACCESS_KEY_ID: ${{ secrets.CLOUD_AGENT_RUNTIME_R2_ACCESS_KEY_ID }}
          RUNTIME_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUD_AGENT_RUNTIME_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUD_AGENT_RUNTIME_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Read-only: lets preparation stop waiting once the SHA's publication has failed.
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec tsx scripts/prepare-runtime-deploy.ts production "$SOURCE_SHA"

      # The Worker and fake LLM deploy from the run's own checkout; the runtime
      # revision only lends its published runtime and its Worker config.
      - name: Switch to the run SHA
        if: steps.runtime_source.outputs.runtime_source_sha != github.sha
        env:
          RUNTIME_SOURCE_SHA: ${{ steps.runtime_source.outputs.runtime_source_sha }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          generated=services/cloud-agent-next/wrangler.runtime-generated.json
          mv "$generated" "$RUNNER_TEMP/wrangler.runtime-generated.json"
          # The Worker config matches the runtime SHA; the earlier comparison
          # already fetched this revision and refused a mismatch.
          git checkout --detach "$RUN_SHA"
          pnpm install --frozen-lockfile
          mv "$RUNNER_TEMP/wrangler.runtime-generated.json" "$generated"

      - name: Deploy fake-LLM Worker
        working-directory: services/cloud-agent-next
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FAKE_LLM_ADMIN_TOKEN: ${{ secrets.FAKE_LLM_ADMIN_TOKEN }}
        run: test/e2e/deploy/deploy-fake-llm.sh deploy

      - name: Deploy Cloud Agent e2e Worker
        working-directory: services/cloud-agent-next
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          E2E_INTERNAL_API_SECRET: ${{ secrets.E2E_INTERNAL_API_SECRET }}
          FAKE_LLM_BASE_URL: ${{ env.FAKE_LLM_WORKER_URL }}/api/openrouter
        run: test/e2e/deploy/deploy-e2e-worker.sh deploy
