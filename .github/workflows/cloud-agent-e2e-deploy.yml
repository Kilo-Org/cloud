name: Cloud Agent E2E deploy

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  # Preparation can read this SHA's runtime-publication workflow runs.
  actions: read

concurrency:
  group: cloud-agent-e2e-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Guard: this workflow_dispatch is reachable from a fork, and the job
    # deploys Workers with admin secrets against production Postgres and R2.
    # Only the canonical repo may run it.
    if: github.repository == 'Kilo-Org/cloud'
    runs-on: ubuntu-latest
    # Runtime preparation may wait up to 45 minutes for the exact-SHA handoff.
    timeout-minutes: 75
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FAKE_LLM_ADMIN_TOKEN: ${{ secrets.FAKE_LLM_ADMIN_TOKEN }}
      E2E_INTERNAL_API_SECRET: ${{ secrets.E2E_INTERNAL_API_SECRET }}
      FAKE_LLM_WORKER_URL: https://fake-llm.engineering-e11.workers.dev
      # The e2e Worker writes to production Postgres and R2, so this deployed
      # stack is a deliberate opt-in, not an isolation boundary.
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Deploy fake-LLM Worker
        working-directory: services/cloud-agent-next
        run: test/e2e/deploy/deploy-fake-llm.sh deploy

      - name: Prepare downloaded Cloud Agent runtime
        working-directory: services/cloud-agent-next
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUNTIME_R2_ACCOUNT_ID: ${{ vars.CLOUD_AGENT_RUNTIME_ACCOUNT_ID }}
          RUNTIME_R2_BUCKET: ${{ vars.CLOUD_AGENT_RUNTIME_BUCKET }}
          RUNTIME_R2_ACCESS_KEY_ID: ${{ secrets.CLOUD_AGENT_RUNTIME_R2_ACCESS_KEY_ID }}
          RUNTIME_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUD_AGENT_RUNTIME_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUD_AGENT_RUNTIME_ACCOUNT_ID }}
          # Read-only: lets preparation stop waiting once the SHA's publication has failed.
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec tsx scripts/prepare-runtime-deploy.ts production "$SOURCE_SHA"

      - name: Deploy Cloud Agent e2e Worker
        working-directory: services/cloud-agent-next
        env:
          FAKE_LLM_BASE_URL: ${{ env.FAKE_LLM_WORKER_URL }}/api/openrouter
        run: test/e2e/deploy/deploy-e2e-worker.sh deploy
