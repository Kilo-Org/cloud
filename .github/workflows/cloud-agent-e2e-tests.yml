name: Cloud Agent E2E tests

on:
  workflow_dispatch:
    inputs:
      worker_url:
        description: 'HTTPS URL of the deployed cloud-agent-next Worker'
        required: true
        type: string
        default: 'https://cloud-agent-e2e-test.engineering-e11.workers.dev'
      fake_llm_url:
        description: 'HTTPS URL of the deployed fake-LLM Worker'
        required: true
        type: string
        default: 'https://fake-llm.engineering-e11.workers.dev'
      backend_url:
        description: 'HTTPS URL of the Kilo backend that issues stream tickets'
        required: true
        type: string
        default: 'https://api.kilo.ai'

permissions:
  contents: read

concurrency:
  group: cloud-agent-e2e-tests
  cancel-in-progress: false

jobs:
  # Resolve the batch names once, with no pnpm install: the batch module is
  # dependency-free and runs on Node's default TypeScript stripping.
  plan:
    runs-on: ubuntu-latest
    outputs:
      batches: ${{ steps.batches.outputs.batches }}
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      - name: Resolve batch names
        id: batches
        run: echo "batches=$(node services/cloud-agent-next/test/e2e/scenarios-batches.ts)" >> "$GITHUB_OUTPUT"

  # One runner per batch. There is deliberately no job-level `concurrency`:
  # a shared group here would serialize the matrix instead of running batches
  # in parallel. The workflow-level group above still serializes whole runs.
  batches:
    needs: plan
    runs-on: ubuntu-latest
    # Per-batch ceiling, not a certified bound. The longest batch is dominated
    # by an intrinsic idle wait, so 90 minutes covers runner variance.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJSON(needs.plan.outputs.batches) }}
    env:
      WORKER_URL: ${{ inputs.worker_url }}
      FAKE_LLM_URL: ${{ inputs.fake_llm_url }}
      E2E_BACKEND_URL: ${{ inputs.backend_url }}
      # Secrets are exposed as environment variables only; never echoed.
      E2E_USER_TOKEN: ${{ secrets.E2E_USER_TOKEN }}
      FAKE_LLM_ADMIN_TOKEN: ${{ secrets.FAKE_LLM_ADMIN_TOKEN }}
      E2E_INTERNAL_API_SECRET: ${{ secrets.E2E_INTERNAL_API_SECRET }}
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run deployed e2e batch
        env:
          # The batch record owns concurrency; E2E_PARALLEL is deliberately unset.
          E2E_BATCH: ${{ matrix.batch }}
        run: |
          set -o pipefail
          pnpm --filter cloud-agent-next run e2e:parallel 2>&1 | tee "e2e-batch-${{ matrix.batch }}.log"

      - name: Upload batch log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-batch-${{ matrix.batch }}-log
          path: e2e-batch-${{ matrix.batch }}.log
          retention-days: 7

  # Validate every expected batch's accounting and emit one combined summary.
  # The consumer's `ok` means the accounting is valid, not that the tests
  # passed; a batch's own failures still flow into the combined summary. The
  # job must also fail outright when the plan or any batch job did not succeed.
  aggregate:
    needs: [plan, batches]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1

      - name: Download batch logs
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: e2e-batch-*-log
          merge-multiple: true

      - name: Aggregate batch results
        run: |
          node services/cloud-agent-next/test/e2e/deploy/aggregate-batch-logs.mjs '${{ needs.plan.outputs.batches }}' .

      - name: Fail when the plan or a batch failed
        if: ${{ needs.plan.result != 'success' || needs.batches.result != 'success' }}
        run: exit 1
