name: Cloud Agent E2E tests

# e2e runs only from main: the cloud-agent-e2e environment admits main alone,
# and the job refuses any other ref.
on:
  workflow_dispatch:
    inputs:
      fake_llm_url:
        description: 'HTTPS URL of the deployed fake-LLM Worker'
        required: true
        type: string
        default: 'https://fake-llm.engineering-e11.workers.dev'
      backend_url:
        description: 'HTTPS URL of the non-production Kilo backend that issues control tokens and stream tickets'
        required: true
        type: string
      only:
        description: 'Comma-separated scenario names to run; empty runs every scenario'
        required: false
        type: string
        default: ''
      parallel:
        description: 'Scenario concurrency'
        required: false
        type: string
        default: '4'
  # The nightly workflow calls this after it deploys the e2e stack.
  workflow_call:
    inputs:
      fake_llm_url:
        description: 'HTTPS URL of the deployed fake-LLM Worker'
        required: false
        type: string
        default: 'https://fake-llm.engineering-e11.workers.dev'
      backend_url:
        description: 'HTTPS URL of the non-production Kilo backend that issues control tokens and stream tickets'
        required: true
        type: string
      only:
        description: 'Comma-separated scenario names to run; empty runs every scenario'
        required: false
        type: string
        default: ''
      parallel:
        description: 'Scenario concurrency'
        required: false
        type: string
        default: '4'
    outputs:
      failed:
        description: 'Number of failed scenarios, or unknown'
        value: ${{ jobs.e2e.outputs.failed }}
      summary:
        description: 'The harness summary line without its prefix'
        value: ${{ jobs.e2e.outputs.summary }}

permissions:
  contents: read

concurrency:
  group: cloud-agent-e2e-tests
  cancel-in-progress: false

jobs:
  e2e:
    # Guard: this workflow_dispatch is reachable from a fork, and the job uses
    # admin secrets. Only the canonical repo's main may run it.
    if: github.repository == 'Kilo-Org/cloud' && github.ref == 'refs/heads/main'
    outputs:
      failed: ${{ steps.summarize.outputs.failed }}
      summary: ${{ steps.summarize.outputs.summary }}
    runs-on: ubuntu-latest
    # The Access service token lives only in this environment. Its deployment
    # branch policy keeps it to main.
    environment: cloud-agent-e2e
    # Operational ceiling for one whole run, not a registry-derived bound.
    timeout-minutes: 180
    env:
      # The Worker has no public address: workers.dev and preview URLs are off.
      # Its only hostname sits behind a Cloudflare Access application whose
      # policy admits one service token, which the driver sends on every
      # request to the Worker and registers on callback targets.
      E2E_WORKER_HOSTNAME: ${{ vars.CLOUD_AGENT_E2E_WORKER_HOSTNAME }}
      WORKER_URL: https://${{ vars.CLOUD_AGENT_E2E_WORKER_HOSTNAME }}
      FAKE_LLM_URL: ${{ inputs.fake_llm_url || 'https://fake-llm.engineering-e11.workers.dev' }}
      E2E_BACKEND_URL: ${{ inputs.backend_url }}
      # Secrets are exposed as environment variables only; never echoed.
      E2E_USER_TOKEN: ${{ secrets.E2E_USER_TOKEN }}
      FAKE_LLM_ADMIN_TOKEN: ${{ secrets.FAKE_LLM_ADMIN_TOKEN }}
      E2E_INTERNAL_API_SECRET: ${{ secrets.E2E_INTERNAL_API_SECRET }}
      E2E_ACCESS_CLIENT_ID: ${{ secrets.E2E_ACCESS_CLIENT_ID }}
      E2E_ACCESS_CLIENT_SECRET: ${{ secrets.E2E_ACCESS_CLIENT_SECRET }}
      # The harness's existing DEFAULT_PARALLEL; the runner owns concurrency.
      E2E_PARALLEL: ${{ inputs.parallel || '4' }}
      E2E_ONLY: ${{ inputs.only }}
    steps:
      # Inert until the Access hostname, its service token and a non-production
      # backend exist: refuse each missing piece before any request leaves the
      # runner.
      - name: Check the closed Worker path
        run: |
          set -euo pipefail
          if [[ ! "$E2E_WORKER_HOSTNAME" =~ ^[a-z0-9.-]+$ ]] || [[ "$E2E_WORKER_HOSTNAME" == *workers.dev ]]; then
            echo "::error::Set vars.CLOUD_AGENT_E2E_WORKER_HOSTNAME in the cloud-agent-e2e environment to the Access-protected hostname"
            exit 1
          fi
          if [ -z "$E2E_ACCESS_CLIENT_ID" ] || [ -z "$E2E_ACCESS_CLIENT_SECRET" ]; then
            echo "::error::Set E2E_ACCESS_CLIENT_ID and E2E_ACCESS_CLIENT_SECRET in the cloud-agent-e2e environment"
            exit 1
          fi
          case "$E2E_BACKEND_URL" in
            https://api.kilo.ai | https://api.kilo.ai/ | https://app.kilo.ai | https://app.kilo.ai/ | "")
              echo "::error::backend_url must be a non-production backend that signs with NEXTAUTH_SECRET_DEV"
              exit 1
              ;;
          esac

      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          lfs: true

      - name: Check that Access refuses an anonymous request
        run: services/cloud-agent-next/test/e2e/deploy/check-access-closed.sh "$E2E_WORKER_HOSTNAME"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run deployed e2e
        run: |
          set -o pipefail
          only_args=()
          if [ -n "$E2E_ONLY" ]; then only_args=(--only "$E2E_ONLY"); fi
          pnpm --filter cloud-agent-next run e2e:parallel "${only_args[@]}" 2>&1 | tee e2e.log

      - name: Summarize results
        id: summarize
        if: always()
        run: |
          # The harness always ends with `Summary: <p> passed, <f> failed, <u> unsupported`.
          summary="$(grep -E '^Summary:' e2e.log | tail -n 1 || true)"
          failed="$(printf '%s\n' "$summary" | grep -oE '[0-9]+ failed' | grep -oE '[0-9]+' || true)"
          if [ -z "$failed" ]; then
            # No summary line (crash/timeout): fall back to the per-scenario failure marker.
            failed="$(grep -c '❌' e2e.log || true)"
          fi
          echo "summary=${summary#Summary: }" >> "$GITHUB_OUTPUT"
          echo "failed=${failed:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-log
          path: e2e.log
          retention-days: 7
