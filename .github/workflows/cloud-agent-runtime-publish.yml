name: Publish Cloud Agent runtime

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  admit:
    # Failed or cancelled CI never publishes; the script verifies the conclusion again.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.admit.outputs.source_sha }}
    steps:
      # Admission code comes from trusted main, never the triggering PR.
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Verify trusted successful CI run
        id: admit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node services/cloud-agent-next/scripts/runtime-ci-admission.mjs

  publish:
    needs: admit
    # Infrastructure owners enable this only after bucket/credential approval.
    if: vars.CLOUD_AGENT_RUNTIME_PUBLICATION_ENABLED == 'true'
    environment: cloud-agent-runtime-publication
    runs-on: ${{ vars.RUNNER_LARGE_LABEL || 'ubuntu-24.04-8core' }}
    timeout-minutes: 45
    concurrency:
      group: cloud-agent-runtime-publisher-${{ needs.admit.outputs.source_sha }}
      cancel-in-progress: false
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b
        with:
          ref: ${{ needs.admit.outputs.source_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: '.nvmrc'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile
      - name: Publish verified runtime and exact-SHA handoff
        working-directory: services/cloud-agent-next
        env:
          SOURCE_SHA: ${{ needs.admit.outputs.source_sha }}
          RUNTIME_R2_ACCOUNT_ID: ${{ vars.CLOUD_AGENT_RUNTIME_ACCOUNT_ID }}
          RUNTIME_R2_BUCKET: ${{ vars.CLOUD_AGENT_RUNTIME_BUCKET }}
          RUNTIME_R2_ACCESS_KEY_ID: ${{ secrets.CLOUD_AGENT_RUNTIME_R2_WRITE_ACCESS_KEY_ID }}
          RUNTIME_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUD_AGENT_RUNTIME_R2_WRITE_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUD_AGENT_RUNTIME_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUD_AGENT_RUNTIME_REGISTRY_PUBLISH_TOKEN }}
        run: pnpm runtime:publish --bucket "$RUNTIME_R2_BUCKET" --source-sha "$SOURCE_SHA"
