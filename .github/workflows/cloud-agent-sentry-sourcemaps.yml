name: Upload Cloud Agent Sentry source maps

# Called by deploy-workers.yml after a successful Cloud Agent deploy job. The
# deploy job validates the built maps and hands them over with the argument
# lists to upload them (services/cloud-agent-next/scripts/sentry-source-maps.ts,
# stageSentryUploads). This job reads the Sentry token from STS, checks the
# hand-off archive, and runs only a sentry-cli binary it verified against the
# lockfile of the deployed commit. Policies: ci-cloud-agent-sentry (production)
# and ci-cloud-agent-sentry-staging (staging), D53/M112. Keep deploy-workers.yml
# its only caller: any workflow on main that calls this file in one of those
# environments receives the token.
on:
  workflow_call:
    inputs:
      target_environment:
        description: 'GitHub environment of the deploy: production or staging'
        required: true
        type: string
      source_sha:
        description: 'Commit the deploy built; its lockfile pins the Sentry CLI (defaults to the caller SHA)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  upload:
    # Guard: only the canonical repo may run this workflow.
    if: github.repository == 'Kilo-Org/cloud'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    # Best-effort, like the upload step it replaces: a failed upload never fails
    # the deploy that called it.
    continue-on-error: true
    # The STS policy names this environment; its branch policy keeps it to main.
    # The deploy job already records the deployment.
    environment:
      name: ${{ inputs.target_environment }}
      deployment: false
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      # The run's own commit: the sts-bundle action and the hand-off check.
      - name: Checkout the STS action and the hand-off check
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            .github/actions/sts-bundle
            scripts/ci

      # The deployed commit: only the two files that pin the Sentry CLI.
      - name: Checkout the lockfile of the deployed commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          path: deployed
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /pnpm-workspace.yaml
            /pnpm-lock.yaml

      # Before anything from the deploy job reaches the runner: every step ahead
      # of the read is trusted.
      - name: Read the Sentry token from STS
        id: sts
        uses: ./.github/actions/sts-bundle
        with:
          workload: ${{ inputs.target_environment == 'production' && 'ci-cloud-agent-sentry' || format('ci-cloud-agent-sentry-{0}', inputs.target_environment) }}
          secrets: SENTRY_AUTH_TOKEN

      # The hand-off has no digest: the archive check, handoff.json, the
      # lockfile-verified binary and the argument allowlist below are what this
      # job relies on. It takes only this attempt's cloud-agent-sentry-<attempt>,
      # whose handoff.json must name this run, attempt and deployed commit; an older
      # attempt's maps are never uploaded under this run's result. Re-running only
      # this job, or only another leg, skips the maps with this warning; re-run the
      # deploy leg too to upload them. The hand-off lands in a private directory
      # that must hold exactly one regular file.
      # sentry-cli then runs with `env -i` and an allowlist: HOME and
      # its working directory are new empty directories with no .sentryclirc or
      # sentry.properties up to /, no SENTRY_* variable but the token, the fixed
      # host and SENTRY_LOAD_DOTENV=0, and each argument list is a source map
      # upload to the kilo-code organization's kilo-cloud-agent project with
      # fixed flags and map paths under the hand-off only
      # (check-sentry-handoff.sh --upload-args).
      - name: Upload source maps
        env:
          GH_TOKEN: ${{ github.token }}
          SENTRY_AUTH_TOKEN: ${{ steps.sts.outputs.SENTRY_AUTH_TOKEN }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          handoff=$(mktemp -d "$RUNNER_TEMP/handoff.XXXXXX")
          name="cloud-agent-sentry-$GITHUB_RUN_ATTEMPT"
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$name" |
            jq -r --arg name "$name" '[.artifacts[] | select(.name == $name and (.expired | not))] | .[0].id // empty')
          if [[ -z $artifact_id ]]; then
            echo "::warning::No $name hand-off in this run attempt; no Cloud Agent source maps uploaded"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/handoff.zip"
          unzip -q "$RUNNER_TEMP/handoff.zip" -d "$handoff"
          bash scripts/ci/check-sentry-handoff.sh --artifact "$handoff"
          bash scripts/ci/check-sentry-handoff.sh "$handoff/cloud-agent-sentry.tgz"
          stage=$(mktemp -d "$RUNNER_TEMP/stage.XXXXXX")
          package=$(mktemp -d "$RUNNER_TEMP/sentry-cli-package.XXXXXX")
          tar -xzf "$handoff/cloud-agent-sentry.tgz" -C "$stage" --no-same-owner
          jq -e --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" --arg source_sha "$EXPECTED_SOURCE_SHA" '
            type == "object" and .run_id == $run_id and .run_attempt == $run_attempt
            and .source_sha == $source_sha and .worker == "services/cloud-agent-next"
          ' "$stage/handoff.json" >/dev/null || fail "handoff.json does not name this run attempt and deployed commit"

          version=$(sed -nE "s/^  '@sentry\/cli': ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p" deployed/pnpm-workspace.yaml | head -n 1)
          case "$RUNNER_ARCH" in
            X64) platform=linux-x64 ;;
            ARM64) platform=linux-arm64 ;;
            *) fail "no Sentry CLI platform package for $RUNNER_ARCH" ;;
          esac
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "no @sentry/cli catalog version in pnpm-workspace.yaml"
          integrity=$(awk -v key="  '@sentry/cli-$platform@$version':" '$0 == key { getline; print; exit }' deployed/pnpm-lock.yaml |
            sed -nE 's/.*integrity: (sha512-[A-Za-z0-9+\/=]+).*/\1/p')
          [[ -n $integrity ]] || fail "pnpm-lock.yaml has no integrity for @sentry/cli-$platform@$version"
          curl -fsSL --proto '=https' --max-time 120 -o "$package/sentry-cli.tgz" \
            "https://registry.npmjs.org/@sentry/cli-$platform/-/cli-$platform-$version.tgz"
          actual="sha512-$(openssl dgst -sha512 -binary "$package/sentry-cli.tgz" | base64 -w0)"
          [[ $actual == "$integrity" ]] || fail "@sentry/cli-$platform@$version does not match the lockfile integrity"
          tar -xzf "$package/sentry-cli.tgz" -C "$package" package/bin/sentry-cli
          cli="$package/package/bin/sentry-cli"
          cmp -s "$cli" "$stage/sentry-cli" || fail "the handed-over sentry-cli is not the lockfile's binary"
          chmod 0755 "$cli"

          work=$(mktemp -d)
          home=$(mktemp -d)
          bash scripts/ci/check-sentry-handoff.sh --workdir "$work"
          bash scripts/ci/check-sentry-handoff.sh --workdir "$home"
          count=$(jq -e 'if type == "array" and length > 0 then length else error("no uploads") end' \
            "$stage/uploads.json") || fail "uploads.json is not a list of uploads"
          argv=$(mktemp)
          for ((i = 0; i < count; i++)); do
            bash scripts/ci/check-sentry-handoff.sh --upload-args "$stage" "$i" >"$argv"
            args=()
            while IFS= read -r -d '' arg; do args+=("$arg"); done <"$argv"
            (cd "$work" && env -i PATH=/usr/bin:/bin HOME="$home" TMPDIR="$RUNNER_TEMP" \
              SENTRY_AUTH_TOKEN="$SENTRY_AUTH_TOKEN" SENTRY_URL=https://sentry.io/ SENTRY_LOAD_DOTENV=0 \
              "$cli" "${args[@]}")
          done
