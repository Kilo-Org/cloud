name: Deploy to Production

on:
  # A completed main CI run is the normal start: a new deployable candidate can
  # only appear when CI turns a main push green. The hourly poll is the catch-up
  # path when a completion event is missed, and dispatch stays manual.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VERCEL_VERSION: '59.5.0'
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}

jobs:
  # Only a successful CI run may start an automatic deploy; the poll and the
  # dispatch pass the same guard unchanged. Every later job depends on this one,
  # so a CI completion that must not deploy skips the whole run. The deployed
  # SHA is still chosen by check-deployment-changes.yml, which also verifies
  # main and records the admitted trigger.
  check-changes:
    # Guard: privileged workflow — only the canonical repo may run it.
    if: >-
      github.repository == 'Kilo-Org/cloud' &&
      (github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success')
    uses: ./.github/workflows/check-deployment-changes.yml
    with:
      workflow_file: deploy-production.yml

  # One checkout and one install gate both database checks: the startup probe
  # runs first, so an unreachable database fails here before the migrations try
  # the same connection.
  db-gate:
    needs: check-changes
    # Guard: privileged workflow — only the canonical repo may run it.
    if: github.repository == 'Kilo-Org/cloud' && needs.check-changes.outputs.should_deploy == 'true'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 45
    environment: production

    env:
      DATABASE_CA: ${{ secrets.DATABASE_CA }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}

    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          lfs: true
          ref: ${{ needs.check-changes.outputs.target_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      # The probe imports @kilocode/db and the migrate step runs drizzle-kit from
      # that package, so the database workspace and the root project are enough.
      # Widen this filter when a step in this job imports another workspace.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter '@kilocode/db...' --filter kilocode-monorepo

      - name: Check production DB startup path
        run: NODE_ENV=production pnpm exec tsx scripts/check-production-db-startup.ts

      - name: Run Drizzle migrations
        run: NODE_ENV=production pnpm run drizzle migrate

  stage-app:
    needs: check-changes
    # Guard: privileged workflow — only the canonical repo may run it.
    if: github.repository == 'Kilo-Org/cloud' && needs.check-changes.outputs.should_deploy == 'true'
    uses: ./.github/workflows/stage-vercel-deployment.yml
    with:
      target_environment: production
      vercel_project_id_var: VERCEL_PROJECT_ID_APP
      source_sha: ${{ needs.check-changes.outputs.target_sha }}
    secrets:
      VERCEL_PROJECT_TOKEN: ${{ secrets.VERCEL_TOKEN_APP }}

  stage-ai-gateway:
    needs: check-changes
    # Guard: privileged workflow — only the canonical repo may run it.
    if: github.repository == 'Kilo-Org/cloud' && needs.check-changes.outputs.should_deploy == 'true'
    uses: ./.github/workflows/stage-vercel-deployment.yml
    with:
      target_environment: production
      vercel_project_id_var: VERCEL_PROJECT_ID_AI_GATEWAY
      source_sha: ${{ needs.check-changes.outputs.target_sha }}
    secrets:
      VERCEL_PROJECT_TOKEN: ${{ secrets.VERCEL_TOKEN_AI_GATEWAY }}

  promote-app:
    needs: [stage-app, db-gate, stage-ai-gateway, promote-ai-gateway]
    # Guard: privileged workflow — only the canonical repo may run it.
    if: >-
      ${{
        github.repository == 'Kilo-Org/cloud' &&
        !cancelled() &&
        needs.stage-app.result == 'success' &&
        needs.db-gate.result == 'success' &&
        (
          (needs.stage-ai-gateway.result == 'success' && needs.promote-ai-gateway.result == 'success') ||
          (needs.stage-ai-gateway.result == 'skipped' && needs.promote-ai-gateway.result == 'skipped')
        )
      }}
    uses: ./.github/workflows/promote-vercel-deployment.yml
    with:
      deployment_url: ${{ needs.stage-app.outputs.deployment_url }}
      axiom_annotation_dataset: kilocode-app
    secrets:
      AXIOM_ANNOTATION_TOKEN: ${{ secrets.AXIOM_ANNOTATION_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  promote-ai-gateway:
    needs: [stage-ai-gateway, db-gate]
    # stage-ai-gateway skips when there is nothing to deploy, which skips this job too.
    # Guard: privileged workflow — only the canonical repo may run it.
    if: github.repository == 'Kilo-Org/cloud'
    uses: ./.github/workflows/promote-vercel-deployment.yml
    with:
      deployment_url: ${{ needs.stage-ai-gateway.outputs.deployment_url }}
      # The gateway has no dedicated Axiom dataset. Its logs reach Axiom through
      # the Axiom Vercel integration's drain, which feeds the shared `vercel`
      # dataset, so annotate promotes there.
      axiom_annotation_dataset: vercel
      axiom_expected_project: kilocode-ai-gateway
    secrets:
      AXIOM_ANNOTATION_TOKEN: ${{ secrets.AXIOM_ANNOTATION_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  deploy-workers:
    needs: [db-gate, check-changes, stage-app, stage-ai-gateway, promote-app, promote-ai-gateway]
    if: >-
      ${{
        github.repository == 'Kilo-Org/cloud' &&
        !cancelled() &&
        needs.check-changes.outputs.should_deploy == 'true' &&
        needs.db-gate.result == 'success' &&
        contains(fromJSON('["success","skipped"]'), needs.stage-app.result) &&
        contains(fromJSON('["success","skipped"]'), needs.stage-ai-gateway.result) &&
        contains(fromJSON('["success","skipped"]'), needs.promote-app.result) &&
        contains(fromJSON('["success","skipped"]'), needs.promote-ai-gateway.result)
      }}
    uses: ./.github/workflows/deploy-workers.yml
    with:
      base_sha: ${{ needs.check-changes.outputs.base_sha }}
      source_sha: ${{ needs.check-changes.outputs.target_sha }}
    secrets: inherit

  # The kilo-mcp changelog, GitHub Release and SBOM. It runs after every
  # successful worker deploy and releases only when the kilo-mcp bundle changed.
  kilo-mcp-release:
    needs: [check-changes, deploy-workers]
    if: ${{ github.repository == 'Kilo-Org/cloud' && !cancelled() && needs.deploy-workers.result == 'success' }}
    # Ceiling for the reusable workflow's GITHUB_TOKEN (a called workflow cannot
    # exceed the caller).
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/kilo-mcp-release.yml
    with:
      source_sha: ${{ needs.check-changes.outputs.target_sha }}
    secrets: inherit

  # The KiloClaw image and worker deploy (deploy-kiloclaw.yml) is not part of
  # the scheduled pipeline. It runs manually via workflow_dispatch from the
  # Actions tab.

  record-deployment:
    needs:
      [
        check-changes,
        db-gate,
        stage-app,
        stage-ai-gateway,
        promote-app,
        promote-ai-gateway,
        deploy-workers,
      ]
    if: >-
      ${{
        github.repository == 'Kilo-Org/cloud' &&
        !cancelled() &&
        needs.check-changes.outputs.should_deploy == 'true' &&
        needs.db-gate.result == 'success' &&
        needs.stage-app.result == 'success' &&
        needs.stage-ai-gateway.result == 'success' &&
        needs.promote-app.result == 'success' &&
        needs.promote-ai-gateway.result == 'success' &&
        needs.deploy-workers.result == 'success'
      }}
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      deployments: write
    steps:
      - name: Record fully deployed production SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.check-changes.outputs.target_sha }}
        run: |
          deployment_id=$(jq -n \
            --arg ref "$SOURCE_SHA" \
            '{ref:$ref, environment:"scheduled-deploy-production", auto_merge:false, required_contexts:[], production_environment:true}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input - --jq '.id')
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
            -f state=success > /dev/null
          echo "Production release completed: \`$SOURCE_SHA\`." >> "$GITHUB_STEP_SUMMARY"
