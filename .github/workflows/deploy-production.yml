name: Deploy to Production

on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VERCEL_VERSION: '59.5.0'
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}

jobs:
  check-changes:
    uses: ./.github/workflows/check-deployment-changes.yml
    with:
      workflow_file: deploy-production.yml

  check-production-db-startup:
    # Guard: this workflow only triggers on schedule/workflow_dispatch, both
    # fork-reachable, and it touches production secrets. Only the canonical
    # repo may run it.
    needs: check-changes
    if: needs.check-changes.outputs.should_deploy == 'true' && github.repository == 'Kilo-Org/cloud'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    environment: production

    env:
      DATABASE_CA: ${{ secrets.DATABASE_CA }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}

    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          lfs: true
          ref: ${{ needs.check-changes.outputs.target_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check production DB startup path
        run: NODE_ENV=production pnpm exec tsx scripts/check-production-db-startup.ts

  run-migrations:
    needs: check-changes
    if: needs.check-changes.outputs.should_deploy == 'true' && github.repository == 'Kilo-Org/cloud'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    environment: production

    env:
      DATABASE_CA: ${{ secrets.DATABASE_CA }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}

    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          lfs: true
          ref: ${{ needs.check-changes.outputs.target_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Drizzle migrations
        run: NODE_ENV=production pnpm run drizzle migrate

  stage-app:
    needs: check-changes
    if: needs.check-changes.outputs.should_deploy == 'true' && github.repository == 'Kilo-Org/cloud'
    uses: ./.github/workflows/stage-vercel-deployment.yml
    with:
      target_environment: production
      vercel_project_id_var: VERCEL_PROJECT_ID_APP
      source_sha: ${{ needs.check-changes.outputs.target_sha }}
    secrets:
      VERCEL_PROJECT_TOKEN: ${{ secrets.VERCEL_TOKEN_APP }}

  stage-global-app:
    needs: check-changes
    if: needs.check-changes.outputs.should_deploy == 'true' && github.repository == 'Kilo-Org/cloud'
    uses: ./.github/workflows/stage-vercel-deployment.yml
    with:
      target_environment: production
      vercel_project_id_var: VERCEL_PROJECT_ID_GLOBAL_APP
      source_sha: ${{ needs.check-changes.outputs.target_sha }}
    secrets:
      VERCEL_PROJECT_TOKEN: ${{ secrets.VERCEL_TOKEN_GLOBAL_APP }}

  promote-app:
    needs: [stage-app, check-production-db-startup, run-migrations]
    if: github.repository == 'Kilo-Org/cloud'
    uses: ./.github/workflows/promote-vercel-deployment.yml
    with:
      deployment_url: ${{ needs.stage-app.outputs.deployment_url }}
      axiom_annotation_dataset: kilocode-app
    secrets:
      AXIOM_ANNOTATION_TOKEN: ${{ secrets.AXIOM_ANNOTATION_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  promote-global-app:
    needs: [stage-global-app, check-production-db-startup, run-migrations]
    if: github.repository == 'Kilo-Org/cloud'
    uses: ./.github/workflows/promote-vercel-deployment.yml
    with:
      deployment_url: ${{ needs.stage-global-app.outputs.deployment_url }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  deploy-workers:
    needs:
      [
        check-production-db-startup,
        run-migrations,
        check-changes,
        stage-app,
        stage-global-app,
        promote-app,
        promote-global-app,
      ]
    if: >-
      ${{
        github.repository == 'Kilo-Org/cloud' &&
        !cancelled() &&
        needs.check-changes.outputs.should_deploy == 'true' &&
        needs.check-production-db-startup.result == 'success' &&
        needs.run-migrations.result == 'success' &&
        contains(fromJSON('["success","skipped"]'), needs.stage-app.result) &&
        contains(fromJSON('["success","skipped"]'), needs.stage-global-app.result) &&
        contains(fromJSON('["success","skipped"]'), needs.promote-app.result) &&
        contains(fromJSON('["success","skipped"]'), needs.promote-global-app.result)
      }}
    uses: ./.github/workflows/deploy-workers.yml
    with:
      base_sha: ${{ needs.check-changes.outputs.base_sha }}
      source_sha: ${{ needs.check-changes.outputs.target_sha }}
    secrets: inherit

  detect-gastown-wasteland-changes:
    needs: check-changes
    if: needs.check-changes.outputs.should_deploy == 'true' && github.repository == 'Kilo-Org/cloud'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      deploy_wasteland: ${{ steps.detect.outputs.deploy_wasteland }}
      deploy_gastown: ${{ steps.detect.outputs.deploy_gastown }}

    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          fetch-depth: 0
          ref: ${{ needs.check-changes.outputs.target_sha }}

      - name: Detect Gastown and Wasteland changes
        id: detect
        run: |
          BASE_SHA="${{ needs.check-changes.outputs.base_sha }}"

          changed_any() {
            git diff --name-only "$BASE_SHA" HEAD -- "$@" | grep -q .
          }

          SHARED_WORKER_INPUTS=(
            pnpm-lock.yaml
            pnpm-workspace.yaml
            patches
            packages/worker-utils
          )

          WASTELAND_INPUTS=(
            services/wasteland
            packages/wl-sdk
            "${SHARED_WORKER_INPUTS[@]}"
          )

          GASTOWN_INPUTS=(
            services/gastown
            packages/db
            "${SHARED_WORKER_INPUTS[@]}"
          )

          deploy_wasteland=false
          deploy_gastown=false

          if changed_any "${WASTELAND_INPUTS[@]}"; then
            deploy_wasteland=true
          fi

          if changed_any "${GASTOWN_INPUTS[@]}"; then
            deploy_gastown=true
          fi

          echo "deploy_wasteland=$deploy_wasteland" >> "$GITHUB_OUTPUT"
          echo "deploy_gastown=$deploy_gastown" >> "$GITHUB_OUTPUT"

          echo "deploy_wasteland=$deploy_wasteland"
          echo "deploy_gastown=$deploy_gastown"

  deploy-gastown-wasteland:
    needs:
      [
        check-production-db-startup,
        run-migrations,
        check-changes,
        detect-gastown-wasteland-changes,
        stage-app,
        stage-global-app,
        promote-app,
        promote-global-app,
      ]
    if: >-
      ${{
        github.repository == 'Kilo-Org/cloud' &&
        !cancelled() &&
        needs.check-changes.outputs.should_deploy == 'true' &&
        needs.check-production-db-startup.result == 'success' &&
        needs.run-migrations.result == 'success' &&
        needs.detect-gastown-wasteland-changes.result == 'success' &&
        contains(fromJSON('["success","skipped"]'), needs.stage-app.result) &&
        contains(fromJSON('["success","skipped"]'), needs.stage-global-app.result) &&
        contains(fromJSON('["success","skipped"]'), needs.promote-app.result) &&
        contains(fromJSON('["success","skipped"]'), needs.promote-global-app.result) &&
        (
          needs.detect-gastown-wasteland-changes.outputs.deploy_wasteland == 'true' ||
          needs.detect-gastown-wasteland-changes.outputs.deploy_gastown == 'true'
        )
      }}
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 45
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          ref: ${{ needs.check-changes.outputs.target_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Wasteland
        if: needs.detect-gastown-wasteland-changes.outputs.deploy_wasteland == 'true'
        run: pnpm --filter cloudflare-wasteland deploy:prod

      - name: Upload Wasteland source maps
        if: needs.detect-gastown-wasteland-changes.outputs.deploy_wasteland == 'true'
        continue-on-error: true
        run: pnpm --filter cloudflare-wasteland sentry:sourcemaps

      - name: Deploy Gastown
        if: needs.detect-gastown-wasteland-changes.outputs.deploy_gastown == 'true'
        run: pnpm --filter cloudflare-gastown deploy:prod

      - name: Upload Gastown source maps
        if: needs.detect-gastown-wasteland-changes.outputs.deploy_gastown == 'true'
        continue-on-error: true
        run: pnpm --filter cloudflare-gastown sentry:sourcemaps

  deploy-kiloclaw:
    needs: [check-changes, check-production-db-startup, run-migrations]
    if: needs.check-changes.outputs.deploy_kiloclaw == 'true' && github.repository == 'Kilo-Org/cloud'
    # Ceiling for the reusable workflow's GITHUB_TOKEN (a called workflow cannot
    # exceed the caller). The reusable workflow restricts further per job — only
    # its isolated attest-sbom job actually uses id-token/attestations.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/deploy-kiloclaw.yml
    with:
      source_sha: ${{ needs.check-changes.outputs.target_sha }}
    secrets: inherit

  record-deployment:
    needs:
      [
        check-changes,
        check-production-db-startup,
        run-migrations,
        stage-app,
        stage-global-app,
        promote-app,
        promote-global-app,
        deploy-workers,
        detect-gastown-wasteland-changes,
        deploy-gastown-wasteland,
        deploy-kiloclaw,
      ]
    if: >-
      ${{
        github.repository == 'Kilo-Org/cloud' &&
        !cancelled() &&
        needs.check-changes.outputs.should_deploy == 'true' &&
        needs.check-production-db-startup.result == 'success' &&
        needs.run-migrations.result == 'success' &&
        needs.stage-app.result == 'success' &&
        needs.stage-global-app.result == 'success' &&
        needs.promote-app.result == 'success' &&
        needs.promote-global-app.result == 'success' &&
        needs.deploy-workers.result == 'success' &&
        needs.detect-gastown-wasteland-changes.result == 'success' &&
        contains(fromJSON('["success","skipped"]'), needs.deploy-gastown-wasteland.result) &&
        contains(fromJSON('["success","skipped"]'), needs.deploy-kiloclaw.result)
      }}
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      deployments: write
    steps:
      - name: Record fully deployed production SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.check-changes.outputs.target_sha }}
        run: |
          deployment_id=$(jq -n \
            --arg ref "$SOURCE_SHA" \
            '{ref:$ref, environment:"scheduled-deploy-production", auto_merge:false, required_contexts:[], production_environment:true}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input - --jq '.id')
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
            -f state=success > /dev/null
          echo "Production release completed: \`$SOURCE_SHA\`." >> "$GITHUB_STEP_SUMMARY"
