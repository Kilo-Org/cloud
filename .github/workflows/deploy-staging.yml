name: Deploy Web to Staging

on:
  # Same trigger as the production pipeline: a completed main CI run starts the
  # lookup, the hourly poll is the catch-up path, and dispatch stays manual.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # Only a successful CI run may start an automatic deploy; the poll and the
  # dispatch pass the same guard unchanged. Every later job depends on this one,
  # so a CI completion that must not deploy skips the whole run.
  check-changes:
    # Guard: this workflow_dispatch is reachable from a fork. Only the
    # canonical repo may run it, and only a successful CI completion may start
    # an automatic deploy.
    if: >-
      github.repository == 'Kilo-Org/cloud' &&
      (github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success')
    uses: ./.github/workflows/check-deployment-changes.yml
    with:
      workflow_file: deploy-staging.yml

  # One checkout and one install gate both database checks: the startup probe
  # runs first, so an unreachable database fails here before the migrations try
  # the same connection.
  db-gate:
    needs: check-changes
    # Guard: this workflow_dispatch is reachable from a fork, and it deploys
    # the web app to staging using repo secrets. Only the canonical repo may
    # run it.
    if: github.repository == 'Kilo-Org/cloud' && needs.check-changes.outputs.should_deploy == 'true'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    environment: staging

    env:
      DATABASE_CA: ${{ secrets.DATABASE_CA }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}

    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          ref: ${{ needs.check-changes.outputs.target_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      # The probe imports @kilocode/db and the migrate step runs drizzle-kit from
      # that package, so the database workspace and the root project are enough.
      # Widen this filter when a step in this job imports another workspace.
      # This job also owns the LFS decision: it builds nothing from apps/web, so
      # its checkout skips LFS objects. Add `lfs: true` back before a step here
      # reads a path tracked by Git LFS.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter '@kilocode/db...' --filter kilocode-monorepo

      - name: Check staging DB startup path
        run: NODE_ENV=production pnpm exec tsx scripts/check-production-db-startup.ts

      - name: Run Drizzle migrations
        run: NODE_ENV=production pnpm run drizzle migrate

  # Both Vercel staging deploys start as soon as check-changes publishes the
  # SHAs, beside the database gate, which is how deploy-production.yml already
  # starts its stage jobs. A custom environment cannot separate the build from
  # the traffic switch: `vercel deploy --target=staging` publishes at build
  # success, vercel@59.5.0 rejects `--skip-domain` for any target other than
  # production, and its only promote path targets production. So staging code can
  # become reachable while db-gate is still migrating. The measured deploy runs
  # far longer than the gate, so the gate normally finishes first; the window
  # exists only while a migration outlasts the deploy, bounded by the gate's
  # timeout. A failed migration still fails db-gate, which stops the Worker
  # deploy and the release record below.
  deploy-app:
    needs: check-changes
    # Guard: privileged workflow — only the canonical repo may run it.
    if: github.repository == 'Kilo-Org/cloud' && needs.check-changes.outputs.should_deploy == 'true'
    uses: ./.github/workflows/stage-vercel-deployment.yml
    with:
      target_environment: staging
      vercel_project_id_var: VERCEL_PROJECT_ID_APP
      source_sha: ${{ needs.check-changes.outputs.target_sha }}
    secrets:
      VERCEL_PROJECT_TOKEN: ${{ secrets.VERCEL_TOKEN_APP }}

  deploy-ai-gateway:
    needs: check-changes
    # Guard: privileged workflow — only the canonical repo may run it.
    if: github.repository == 'Kilo-Org/cloud' && needs.check-changes.outputs.should_deploy == 'true'
    uses: ./.github/workflows/stage-vercel-deployment.yml
    with:
      target_environment: staging
      vercel_project_id_var: VERCEL_PROJECT_ID_AI_GATEWAY
      source_sha: ${{ needs.check-changes.outputs.target_sha }}
    secrets:
      VERCEL_PROJECT_TOKEN: ${{ secrets.VERCEL_TOKEN_AI_GATEWAY }}

  # Worker change detection reads only the SHAs check-changes publishes, so this
  # call runs beside the Vercel staging deploys instead of after them: the matrix
  # is ready when the Worker deploy below opens. It deploys nothing by itself.
  detect-workers:
    needs: check-changes
    # Guard: privileged workflow — only the canonical repo may run it.
    if: github.repository == 'Kilo-Org/cloud' && needs.check-changes.outputs.should_deploy == 'true'
    uses: ./.github/workflows/deploy-workers.yml
    with:
      base_sha: ${{ needs.check-changes.outputs.base_sha }}
      source_sha: ${{ needs.check-changes.outputs.target_sha }}
      target_environment: staging

  # The Worker deploy waits for the gate and the matrix above; the two Vercel
  # staging deploys start earlier, beside the gate. record-deployment still
  # requires every one of the three.
  deploy-workers:
    needs: [check-changes, db-gate, detect-workers]
    # Guard: this workflow_dispatch is reachable from a fork, and the reusable
    # workflow inherits repo secrets. Only the canonical repo may run it.
    if: github.repository == 'Kilo-Org/cloud' && needs.check-changes.outputs.should_deploy == 'true'
    uses: ./.github/workflows/deploy-workers.yml
    with:
      target_environment: staging
      worker_matrix: ${{ needs.detect-workers.outputs.matrix }}
      deploy_cloud_agent_after_session_ingest: ${{ needs.detect-workers.outputs.deploy-cloud-agent-after-session-ingest }}
      source_sha: ${{ needs.check-changes.outputs.target_sha }}
    secrets: inherit

  record-deployment:
    needs: [check-changes, db-gate, deploy-app, deploy-ai-gateway, deploy-workers]
    if: >-
      ${{
        github.repository == 'Kilo-Org/cloud' &&
        !cancelled() &&
        needs.check-changes.outputs.should_deploy == 'true' &&
        needs.db-gate.result == 'success' &&
        needs.deploy-app.result == 'success' &&
        needs.deploy-ai-gateway.result == 'success' &&
        needs.deploy-workers.result == 'success'
      }}
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      deployments: write
    steps:
      - name: Record fully deployed staging SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.check-changes.outputs.target_sha }}
        run: |
          deployment_id=$(jq -n \
            --arg ref "$SOURCE_SHA" \
            '{ref:$ref, environment:"scheduled-deploy-staging", auto_merge:false, required_contexts:[], production_environment:false}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input - --jq '.id')
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
            -f state=success > /dev/null
          echo "Staging release completed: \`$SOURCE_SHA\`." >> "$GITHUB_STEP_SUMMARY"
