name: Deploy Web to Staging

on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  check-changes:
    uses: ./.github/workflows/check-deployment-changes.yml
    with:
      workflow_file: deploy-staging.yml

  check-staging-db-startup:
    # Guard: fork-reachable schedule/dispatch touching staging secrets. Canonical repo only.
    needs: check-changes
    if: needs.check-changes.outputs.should_deploy == 'true' && github.repository == 'Kilo-Org/cloud'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    environment: staging

    env:
      DATABASE_CA: ${{ secrets.DATABASE_CA }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}

    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          lfs: true
          ref: ${{ needs.check-changes.outputs.target_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check staging DB startup path
        run: NODE_ENV=production pnpm exec tsx scripts/check-production-db-startup.ts

  run-migrations:
    needs: check-changes
    if: needs.check-changes.outputs.should_deploy == 'true' && github.repository == 'Kilo-Org/cloud'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    environment: staging

    env:
      DATABASE_CA: ${{ secrets.DATABASE_CA }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}

    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          lfs: true
          ref: ${{ needs.check-changes.outputs.target_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Drizzle migrations
        run: NODE_ENV=production pnpm run drizzle migrate

  deploy-app:
    needs: [check-changes, check-staging-db-startup, run-migrations]
    if: needs.check-changes.outputs.should_deploy == 'true' && github.repository == 'Kilo-Org/cloud'
    uses: ./.github/workflows/stage-vercel-deployment.yml
    with:
      target_environment: staging
      vercel_project_id_var: VERCEL_PROJECT_ID_APP
      source_sha: ${{ needs.check-changes.outputs.target_sha }}
    secrets:
      VERCEL_PROJECT_TOKEN: ${{ secrets.VERCEL_TOKEN_APP }}

  deploy-global-app:
    needs: [check-changes, check-staging-db-startup, run-migrations]
    if: needs.check-changes.outputs.should_deploy == 'true' && github.repository == 'Kilo-Org/cloud'
    uses: ./.github/workflows/stage-vercel-deployment.yml
    with:
      target_environment: staging
      vercel_project_id_var: VERCEL_PROJECT_ID_GLOBAL_APP
      source_sha: ${{ needs.check-changes.outputs.target_sha }}
    secrets:
      VERCEL_PROJECT_TOKEN: ${{ secrets.VERCEL_TOKEN_GLOBAL_APP }}

  deploy-workers:
    needs: [check-changes, check-staging-db-startup, run-migrations, deploy-app, deploy-global-app]
    if: needs.check-changes.outputs.should_deploy == 'true' && github.repository == 'Kilo-Org/cloud'
    uses: ./.github/workflows/deploy-workers.yml
    with:
      target_environment: staging
      base_sha: ${{ needs.check-changes.outputs.base_sha }}
      source_sha: ${{ needs.check-changes.outputs.target_sha }}
    secrets: inherit

  record-deployment:
    needs:
      [
        check-changes,
        check-staging-db-startup,
        run-migrations,
        deploy-app,
        deploy-global-app,
        deploy-workers,
      ]
    if: >-
      ${{
        github.repository == 'Kilo-Org/cloud' &&
        !cancelled() &&
        needs.check-changes.outputs.should_deploy == 'true' &&
        needs.check-staging-db-startup.result == 'success' &&
        needs.run-migrations.result == 'success' &&
        needs.deploy-app.result == 'success' &&
        needs.deploy-global-app.result == 'success' &&
        needs.deploy-workers.result == 'success'
      }}
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      deployments: write
    steps:
      - name: Record fully deployed staging SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.check-changes.outputs.target_sha }}
        run: |
          deployment_id=$(jq -n \
            --arg ref "$SOURCE_SHA" \
            '{ref:$ref, environment:"scheduled-deploy-staging", auto_merge:false, required_contexts:[], production_environment:false}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input - --jq '.id')
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
            -f state=success > /dev/null
          echo "Staging release completed: \`$SOURCE_SHA\`." >> "$GITHUB_STEP_SUMMARY"
