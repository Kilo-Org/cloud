name: Deploy Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      worker:
        description: 'Worker folder to deploy (e.g. services/session-ingest)'
        required: true
        type: string
      target_environment:
        description: 'Worker environment to deploy to'
        required: false
        default: production
        type: choice
        options:
          - production
          - staging
  workflow_call:
    inputs:
      worker:
        description: 'Worker folder to deploy for single-worker calls'
        required: false
        default: ''
        type: string
      base_sha:
        description: 'Base SHA to diff against when detecting changed workers'
        required: false
        default: ''
        type: string
      source_sha:
        description: 'Exact tested commit to deploy (defaults to the caller SHA)'
        required: false
        default: ''
        type: string
      target_environment:
        description: 'Worker environment to deploy to'
        required: false
        default: production
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-workers-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  deploy-manual:
    if: inputs.worker != ''
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.worker == 'services/cloud-agent-next' && 75 || inputs.worker == 'services/auto-routing-benchmark' && inputs.target_environment == 'production' && 60 || 25 }}
    name: Deploy ${{ inputs.worker }}
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        working-directory: ${{ inputs.worker }}
        run: pnpm install --frozen-lockfile

      - name: Prepare downloaded Cloud Agent runtime
        if: inputs.worker == 'services/cloud-agent-next'
        id: runtime
        working-directory: services/cloud-agent-next
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          RUNTIME_R2_ACCOUNT_ID: ${{ vars.CLOUD_AGENT_RUNTIME_ACCOUNT_ID }}
          RUNTIME_R2_BUCKET: ${{ vars.CLOUD_AGENT_RUNTIME_BUCKET }}
          RUNTIME_PUBLICATION_ENABLED: ${{ vars.CLOUD_AGENT_RUNTIME_PUBLICATION_ENABLED }}
          RUNTIME_R2_ACCESS_KEY_ID: ${{ secrets.CLOUD_AGENT_RUNTIME_R2_READ_ACCESS_KEY_ID }}
          RUNTIME_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUD_AGENT_RUNTIME_R2_READ_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUD_AGENT_RUNTIME_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -f scripts/prepare-runtime-deploy.ts ] || [ -f runtime-targets.json ]; then
            pnpm exec tsx scripts/prepare-runtime-deploy.ts "$TARGET_ENVIRONMENT" "$SOURCE_SHA"
          fi

      - name: Drain and deploy benchmark
        if: inputs.worker == 'services/auto-routing-benchmark' && inputs.target_environment == 'production'
        working-directory: ${{ inputs.worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm run deploy

      - name: Deploy to Cloudflare Workers
        if: inputs.worker != 'services/auto-routing-benchmark' || inputs.target_environment != 'production'
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: ${{ inputs.worker }}
          # Workers that define a `predeploy` script (e.g. D1 migrations) run it
          # right before deploy; all other workers are unaffected.
          preCommands: |
            if [ "$(jq -r '.scripts.predeploy // empty' package.json)" != "" ]; then pnpm run predeploy; fi
          command: ${{ steps.runtime.outputs.command || (inputs.target_environment == 'production' && 'deploy' || format('deploy --env {0}', inputs.target_environment)) }}

  detect-changes:
    if: inputs.worker == '' && inputs.base_sha != ''
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      # scripts/changed-dependencies.mjs parses pnpm-lock.yaml with js-yaml,
      # so detection needs the root dependencies.
      - name: Mount pnpm store
        uses: ./.github/actions/pnpm-store

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      - name: Install root dependencies
        run: pnpm --filter kilocode-monorepo install --frozen-lockfile --ignore-scripts

      - name: Find changed workers
        id: set-matrix
        run: |
          # Auto-discover all deployable workers (folders containing wrangler.jsonc)
          # and exclude workers outside the automatic deployment pipeline.
          #
          # Diff from the last complete deployment so failed runs do not lose
          # Worker changes. Staging requires an explicitly configured environment.
          BASE_SHA="${{ inputs.base_sha }}"
          TARGET_ENVIRONMENT="${{ inputs.target_environment }}"

          has_named_environment() {
            node - "$1" "$TARGET_ENVIRONMENT" <<'NODE'
          const fs = require('node:fs');

          const [file, targetEnvironment] = process.argv.slice(2);

          function stripJsonComments(value) {
            let output = '';
            let inString = false;
            let escaped = false;

            for (let index = 0; index < value.length; index += 1) {
              const current = value[index];
              const next = value[index + 1];

              if (inString) {
                output += current;
                if (escaped) escaped = false;
                else if (current === '\\') escaped = true;
                else if (current === '"') inString = false;
                continue;
              }

              if (current === '"') {
                inString = true;
                output += current;
                continue;
              }

              if (current === '/' && next === '/') {
                while (index < value.length && value[index] !== '\n') index += 1;
                output += '\n';
                continue;
              }

              if (current === '/' && next === '*') {
                index += 2;
                while (index < value.length && !(value[index] === '*' && value[index + 1] === '/')) {
                  if (value[index] === '\n') output += '\n';
                  index += 1;
                }
                index += 1;
                continue;
              }

              output += current;
            }

            return output;
          }

          const rawConfig = fs.readFileSync(file, 'utf8');
          const config = JSON.parse(stripJsonComments(rawConfig).replace(/,\s*([}\]])/g, '$1'));
          process.exit(config.env && Object.hasOwn(config.env, targetEnvironment) ? 0 : 1);
          NODE
          }

          # Workers excluded from automatic deployment:
          EXCLUDED=(
            services/app-builder
            services/deploy-infra/builder
            services/deploy-infra/dispatcher
            services/kiloclaw  # Docker-based deploy in deploy-kiloclaw.yml (manual-only)
            services/gastown   # Deployed separately
            services/wasteland # Deployed separately
            services/user-data-export # Automatic deploy suspended
            services/deploy-infra/builder-docker-container/container-files  # Build artifact template, not a deployable worker
          )

          # Discover all workers with a wrangler.jsonc
          WORKERS=()
          while IFS= read -r cfg; do
            dir=$(dirname "$cfg")
            WORKERS+=("$dir")
          done < <(find services -name "wrangler.jsonc" -not -path "*/node_modules/*" -not -path "*/test/fixtures/*" | sort)

          # Filter out excluded workers
          DEPLOYABLE=()
          for dir in "${WORKERS[@]}"; do
            skip=false
            for excluded in "${EXCLUDED[@]}"; do
              if [[ "$dir" == "$excluded" ]]; then
                skip=true
                break
              fi
            done
            if [[ "$skip" == false ]]; then
              DEPLOYABLE+=("$dir")
            fi
          done

          # A worker redeploys when its own files change, or when a workspace
          # it depends on changes (scripts/affected-workspaces.mjs). A change to
          # an unrelated shared package must not restart the worker: a rollout
          # kills in-flight containers. If detection fails, selects everything,
          # or the worker is not a workspace, use the broad rule.
          AFFECTED_DIRS=""
          NARROW=false
          if affected=$(node scripts/affected-workspaces.mjs "$BASE_SHA") \
            && [ "$(jq -r '.full' <<< "$affected")" = false ] \
            && AFFECTED_DIRS=$(jq -r '.dirs[]' <<< "$affected") \
            && WORKSPACE_DIRS=$(set -o pipefail; pnpm ls -r --depth -1 --json | jq -r --arg root "$(pwd -P)/" '.[].path | ltrimstr($root)'); then
            NARROW=true
          else
            echo "Workspace detection unavailable or selected everything; using the broad rule"
          fi

          CHANGED=()
          for dir in "${DEPLOYABLE[@]}"; do
            if [ "$TARGET_ENVIRONMENT" != "production" ] && ! has_named_environment "$dir/wrangler.jsonc"; then
              echo "Skipping $dir: wrangler.jsonc does not define env.$TARGET_ENVIRONMENT"
            elif ! git diff --quiet "$BASE_SHA" HEAD -- "$dir/"; then
              CHANGED+=("$dir")
            elif [ "$NARROW" = true ] && grep -Fxq "$dir" <<< "$WORKSPACE_DIRS"; then
              if grep -Fxq "$dir" <<< "$AFFECTED_DIRS"; then
                CHANGED+=("$dir")
              fi
            elif ! git diff --quiet "$BASE_SHA" HEAD -- packages pnpm-lock.yaml pnpm-workspace.yaml patches; then
              CHANGED+=("$dir")
            fi
          done

          if [ ${#CHANGED[@]} -eq 0 ]; then
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
          else
            MATRIX=$(printf '%s\n' "${CHANGED[@]}" | jq -R . | jq -sc .)
            echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          fi

  deploy-changed:
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix != '[]' && needs.detect-changes.outputs.matrix != ''
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: ${{ matrix.worker == 'services/cloud-agent-next' && 75 || matrix.worker == 'services/auto-routing-benchmark' && inputs.target_environment == 'production' && 60 || 25 }}
    environment: ${{ inputs.target_environment }}
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    name: Deploy ${{ matrix.worker }}
    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        working-directory: ${{ matrix.worker }}
        run: pnpm install --frozen-lockfile

      - name: Prepare downloaded Cloud Agent runtime
        if: matrix.worker == 'services/cloud-agent-next'
        id: runtime
        working-directory: services/cloud-agent-next
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          RUNTIME_R2_ACCOUNT_ID: ${{ vars.CLOUD_AGENT_RUNTIME_ACCOUNT_ID }}
          RUNTIME_R2_BUCKET: ${{ vars.CLOUD_AGENT_RUNTIME_BUCKET }}
          RUNTIME_PUBLICATION_ENABLED: ${{ vars.CLOUD_AGENT_RUNTIME_PUBLICATION_ENABLED }}
          RUNTIME_R2_ACCESS_KEY_ID: ${{ secrets.CLOUD_AGENT_RUNTIME_R2_READ_ACCESS_KEY_ID }}
          RUNTIME_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUD_AGENT_RUNTIME_R2_READ_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUD_AGENT_RUNTIME_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -f scripts/prepare-runtime-deploy.ts ] || [ -f runtime-targets.json ]; then
            pnpm exec tsx scripts/prepare-runtime-deploy.ts "$TARGET_ENVIRONMENT" "$SOURCE_SHA"
          fi

      - name: Drain and deploy benchmark
        if: matrix.worker == 'services/auto-routing-benchmark' && inputs.target_environment == 'production'
        working-directory: ${{ matrix.worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm run deploy

      - name: Deploy to Cloudflare Workers
        if: matrix.worker != 'services/auto-routing-benchmark' || inputs.target_environment != 'production'
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: ${{ matrix.worker }}
          # Workers that define a `predeploy` script (e.g. D1 migrations) run it
          # right before deploy; all other workers are unaffected.
          preCommands: |
            if [ "$(jq -r '.scripts.predeploy // empty' package.json)" != "" ]; then pnpm run predeploy; fi
          command: ${{ steps.runtime.outputs.command || (inputs.target_environment == 'production' && 'deploy' || format('deploy --env {0}', inputs.target_environment)) }}
