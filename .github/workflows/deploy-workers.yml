name: Deploy Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      worker:
        description: 'Worker folder to deploy (e.g. services/session-ingest)'
        required: true
        type: string
      target_environment:
        description: 'Worker environment to deploy to'
        required: false
        default: production
        type: choice
        options:
          - production
          - staging
  workflow_call:
    inputs:
      worker:
        description: 'Worker folder to deploy for single-worker calls'
        required: false
        default: ''
        type: string
      base_sha:
        description: 'Base SHA to diff against when detecting changed workers'
        required: false
        default: ''
        type: string
      source_sha:
        description: 'Exact tested commit to deploy (defaults to the caller SHA)'
        required: false
        default: ''
        type: string
      cloud_agent_runtime_artifact:
        description: 'Verified Cloud Agent candidate evidence from the early release gate'
        required: false
        default: ''
        type: string
      target_environment:
        description: 'Worker environment to deploy to'
        required: false
        default: production
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-workers-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  admit-cloud-agent-source:
    if: >-
      inputs.worker == 'services/cloud-agent-next' || inputs.cloud_agent_runtime_artifact != '' ||
      (inputs.worker == '' && inputs.base_sha != '' && inputs.target_environment == 'production')
    uses: ./.github/workflows/cloud-agent-runtime-admission.yml
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}

  prepare-cloud-agent-runtime:
    if: >-
      inputs.cloud_agent_runtime_artifact == '' &&
      inputs.worker == 'services/cloud-agent-next'
    uses: ./.github/workflows/cloud-agent-runtime-release.yml
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}
      base_sha: ${{ inputs.base_sha }}
      target_environment: ${{ inputs.target_environment }}
    secrets: inherit

  deploy-manual:
    needs: [prepare-cloud-agent-runtime, admit-cloud-agent-source]
    if: >-
      !cancelled() && inputs.worker != '' &&
      contains(fromJSON('["success","skipped"]'), needs.admit-cloud-agent-source.result) &&
      contains(fromJSON('["success","skipped"]'), needs.prepare-cloud-agent-runtime.result)
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 25
    name: Deploy ${{ inputs.worker }}
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        working-directory: ${{ inputs.worker }}
        run: pnpm install --frozen-lockfile

      - name: Download Cloud Agent release evidence
        if: inputs.worker == 'services/cloud-agent-next'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: ${{ inputs.cloud_agent_runtime_artifact || needs.prepare-cloud-agent-runtime.outputs.artifact_name }}
          path: services/cloud-agent-next/.wrangler/runtime-release

      - name: Verify Cloud Agent release and deployment order
        if: inputs.worker == 'services/cloud-agent-next'
        working-directory: services/cloud-agent-next
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUD_AGENT_RUNTIME_R2_ACCESS_KEY_ID: ${{ secrets.CLOUD_AGENT_RUNTIME_R2_ACCESS_KEY_ID }}
          CLOUD_AGENT_RUNTIME_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUD_AGENT_RUNTIME_R2_SECRET_ACCESS_KEY }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: pnpm run runtime:release verify --source-sha "$SOURCE_SHA" --environment "$TARGET_ENVIRONMENT"

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: ${{ inputs.worker }}
          # Workers that define a `predeploy` script (e.g. D1 migrations) run it
          # right before deploy; all other workers are unaffected.
          preCommands: |
            if [ "$(jq -r '.scripts.predeploy // empty' package.json)" != "" ]; then pnpm run predeploy; fi
          command: ${{ format('{0}{1}', inputs.target_environment == 'production' && 'deploy' || format('deploy --env {0}', inputs.target_environment), inputs.worker == 'services/cloud-agent-next' && format(' --config wrangler.runtime-release.json --tag runtime-ci-{0}', inputs.source_sha || github.sha) || '') }}

  detect-changes:
    if: inputs.worker == '' && inputs.base_sha != ''
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Find changed workers
        id: set-matrix
        run: |
          # Auto-discover all deployable workers (folders containing wrangler.jsonc)
          # and exclude workers outside the automatic deployment pipeline.
          #
          # Diff from the last complete deployment so failed runs do not lose
          # Worker changes. Staging requires an explicitly configured environment.
          BASE_SHA="${{ inputs.base_sha }}"
          TARGET_ENVIRONMENT="${{ inputs.target_environment }}"

          has_named_environment() {
            node - "$1" "$TARGET_ENVIRONMENT" <<'NODE'
          const fs = require('node:fs');

          const [file, targetEnvironment] = process.argv.slice(2);

          function stripJsonComments(value) {
            let output = '';
            let inString = false;
            let escaped = false;

            for (let index = 0; index < value.length; index += 1) {
              const current = value[index];
              const next = value[index + 1];

              if (inString) {
                output += current;
                if (escaped) escaped = false;
                else if (current === '\\') escaped = true;
                else if (current === '"') inString = false;
                continue;
              }

              if (current === '"') {
                inString = true;
                output += current;
                continue;
              }

              if (current === '/' && next === '/') {
                while (index < value.length && value[index] !== '\n') index += 1;
                output += '\n';
                continue;
              }

              if (current === '/' && next === '*') {
                index += 2;
                while (index < value.length && !(value[index] === '*' && value[index + 1] === '/')) {
                  if (value[index] === '\n') output += '\n';
                  index += 1;
                }
                index += 1;
                continue;
              }

              output += current;
            }

            return output;
          }

          const rawConfig = fs.readFileSync(file, 'utf8');
          const config = JSON.parse(stripJsonComments(rawConfig).replace(/,\s*([}\]])/g, '$1'));
          process.exit(config.env && Object.hasOwn(config.env, targetEnvironment) ? 0 : 1);
          NODE
          }

          # Workers excluded from automatic deployment:
          EXCLUDED=(
            services/app-builder
            services/deploy-infra/builder
            services/deploy-infra/dispatcher
            services/kiloclaw  # Docker-based deploy in deploy-kiloclaw.yml (manual-only)
            services/gastown   # Deployed separately
            services/wasteland # Deployed separately
            services/deploy-infra/builder-docker-container/container-files  # Build artifact template, not a deployable worker
          )

          # Discover all workers with a wrangler.jsonc
          WORKERS=()
          while IFS= read -r cfg; do
            dir=$(dirname "$cfg")
            WORKERS+=("$dir")
          done < <(find services -name "wrangler.jsonc" -not -path "*/node_modules/*" | sort)

          # Filter out excluded workers
          DEPLOYABLE=()
          for dir in "${WORKERS[@]}"; do
            skip=false
            for excluded in "${EXCLUDED[@]}"; do
              if [[ "$dir" == "$excluded" ]]; then
                skip=true
                break
              fi
            done
            if [[ "$skip" == false ]]; then
              DEPLOYABLE+=("$dir")
            fi
          done

          CHANGED=()
          for dir in "${DEPLOYABLE[@]}"; do
            if [ "$TARGET_ENVIRONMENT" != "production" ] && ! has_named_environment "$dir/wrangler.jsonc"; then
              echo "Skipping $dir: wrangler.jsonc does not define env.$TARGET_ENVIRONMENT"
            elif [ "$dir" = services/cloud-agent-next ]; then
              changed=$(node scripts/cloud-agent-runtime-changes.mjs "$BASE_SHA" HEAD)
              if [ "$changed" = true ]; then
                CHANGED+=("$dir")
              fi
            elif ! git diff --quiet "$BASE_SHA" HEAD -- "$dir/" packages pnpm-lock.yaml pnpm-workspace.yaml patches; then
              CHANGED+=("$dir")
            fi
          done

          if [ ${#CHANGED[@]} -eq 0 ]; then
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
          else
            MATRIX=$(printf '%s\n' "${CHANGED[@]}" | jq -R . | jq -sc .)
            echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          fi

  deploy-changed:
    needs: [detect-changes, prepare-cloud-agent-runtime, admit-cloud-agent-source]
    if: >-
      !cancelled() && needs.detect-changes.outputs.matrix != '[]' && needs.detect-changes.outputs.matrix != '' &&
      contains(fromJSON('["success","skipped"]'), needs.admit-cloud-agent-source.result) &&
      contains(fromJSON('["success","skipped"]'), needs.prepare-cloud-agent-runtime.result)
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 25
    environment: ${{ inputs.target_environment }}
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    name: Deploy ${{ matrix.worker }}
    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        working-directory: ${{ matrix.worker }}
        run: pnpm install --frozen-lockfile

      - name: Download Cloud Agent release evidence
        if: matrix.worker == 'services/cloud-agent-next'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: ${{ inputs.cloud_agent_runtime_artifact || needs.prepare-cloud-agent-runtime.outputs.artifact_name }}
          path: services/cloud-agent-next/.wrangler/runtime-release

      - name: Verify Cloud Agent release and deployment order
        if: matrix.worker == 'services/cloud-agent-next'
        working-directory: services/cloud-agent-next
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUD_AGENT_RUNTIME_R2_ACCESS_KEY_ID: ${{ secrets.CLOUD_AGENT_RUNTIME_R2_ACCESS_KEY_ID }}
          CLOUD_AGENT_RUNTIME_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUD_AGENT_RUNTIME_R2_SECRET_ACCESS_KEY }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: pnpm run runtime:release verify --source-sha "$SOURCE_SHA" --environment "$TARGET_ENVIRONMENT"

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: ${{ matrix.worker }}
          # Workers that define a `predeploy` script (e.g. D1 migrations) run it
          # right before deploy; all other workers are unaffected.
          preCommands: |
            if [ "$(jq -r '.scripts.predeploy // empty' package.json)" != "" ]; then pnpm run predeploy; fi
          command: ${{ format('{0}{1}', inputs.target_environment == 'production' && 'deploy' || format('deploy --env {0}', inputs.target_environment), matrix.worker == 'services/cloud-agent-next' && format(' --config wrangler.runtime-release.json --tag runtime-ci-{0}', inputs.source_sha || github.sha) || '') }}
