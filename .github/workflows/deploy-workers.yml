    needs: deploy-session-ingest-sts
    # GitHub skips a dependent job when a needed job fails: cloud-agent-next never
    # deploys after an unsuccessful session-ingest deployment.
    if: >-
      github.repository == 'Kilo-Org/cloud' &&
      inputs.deploy_cloud_agent_after_session_ingest == 'true' &&
      needs.deploy-session-ingest-sts.result == 'success' &&
      vars.DEPLOY_TOKEN_SOURCE == 'sts'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 75
    environment: ${{ inputs.target_environment }}
    permissions:
      contents: read
      actions: read
      id-token: write
    name: Deploy cloud-agent-next after session-ingest
    steps:
      # Exactly `sts`: job conditions compare without case, so `STS` passes them and stops here.
      - name: Check DEPLOY_TOKEN_SOURCE
        env:
          DEPLOY_TOKEN_SOURCE: ${{ vars.DEPLOY_TOKEN_SOURCE }}
        run: |
          if [[ $DEPLOY_TOKEN_SOURCE != sts ]]; then
            echo "::error::DEPLOY_TOKEN_SOURCE must be unset, secret or sts"
            exit 1
          fi

      - name: Checkout code
        uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Install cloud-agent-next dependencies
        working-directory: services/cloud-agent-next
        # The service's closure plus the wrapper package that its predeploy
        # builds; a recursive workspace install would link every unrelated
        # package too.
        run: |
          filters=(--filter '{.}...' --filter kilocode-monorepo)
          if [ -f wrapper/package.json ]; then
            filters+=(--filter '@kilocode/cloud-agent-wrapper...')
          fi
          # A registry download that fails on the runner leaves a lifecycle script
          # (such as the workerd postinstall) failed; a plain rerun repeats it.
          for attempt in 1 2 3; do
            pnpm install --frozen-lockfile "${filters[@]}" && exit 0
            echo "::warning::pnpm install failed (attempt $attempt of 3)"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 20))
          done
          exit 1

