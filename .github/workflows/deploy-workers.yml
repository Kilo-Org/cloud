name: Deploy Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      worker:
        description: 'Worker folder to deploy (e.g. services/session-ingest)'
        required: true
        type: string
      target_environment:
        description: 'Worker environment to deploy to'
        required: false
        default: production
        type: choice
        options:
          - production
          - staging
  workflow_call:
    inputs:
      worker:
        description: 'Worker folder to deploy for single-worker calls'
        required: false
        default: ''
        type: string
      base_sha:
        description: 'Base SHA to diff against when detecting changed workers'
        required: false
        default: ''
        type: string
      source_sha:
        description: 'Exact tested commit to deploy (defaults to the caller SHA)'
        required: false
        default: ''
        type: string
      target_environment:
        description: 'Worker environment to deploy to'
        required: false
        default: production
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-workers-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  deploy-manual:
    if: inputs.worker != ''
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.worker == 'services/cloud-agent-next' && 75 || inputs.worker == 'services/auto-routing-benchmark' && inputs.target_environment == 'production' && 60 || 25 }}
    name: Deploy ${{ inputs.worker }}
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Setup Bun
        if: inputs.worker == 'services/cloud-agent-next'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        working-directory: ${{ inputs.worker }}
        run: pnpm install --frozen-lockfile

      - name: Prepare downloaded Cloud Agent runtime
        if: inputs.worker == 'services/cloud-agent-next'
        id: runtime
        working-directory: services/cloud-agent-next
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          RUNTIME_R2_ACCOUNT_ID: ${{ vars.CLOUD_AGENT_RUNTIME_ACCOUNT_ID }}
          RUNTIME_R2_BUCKET: ${{ vars.CLOUD_AGENT_RUNTIME_BUCKET }}
          RUNTIME_R2_ACCESS_KEY_ID: ${{ secrets.CLOUD_AGENT_RUNTIME_R2_ACCESS_KEY_ID }}
          RUNTIME_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUD_AGENT_RUNTIME_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUD_AGENT_RUNTIME_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Read-only: lets preparation stop waiting once the SHA's publication has failed.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -f scripts/prepare-runtime-deploy.ts ] || [ -f runtime-targets.json ]; then
            pnpm exec tsx scripts/prepare-runtime-deploy.ts "$TARGET_ENVIRONMENT" "$SOURCE_SHA"
          fi

      - name: Drain and deploy benchmark
        if: inputs.worker == 'services/auto-routing-benchmark' && inputs.target_environment == 'production'
        working-directory: ${{ inputs.worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm run deploy

      - name: Check selected usage queues
        id: usage_queues
        if: inputs.worker == 'services/usage-ingest' && (inputs.target_environment == 'staging' || inputs.target_environment == 'production')
        working-directory: services/usage-ingest
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          node --input-type=commonjs <<'NODE'
          const { appendFileSync, existsSync } = require('node:fs');
          const { unstable_readConfig } = require('wrangler');
          const environment = process.env.TARGET_ENVIRONMENT;
          const config = unstable_readConfig({ config: 'wrangler.jsonc', env: environment === 'staging' ? 'staging' : undefined });
          if (config.services.some(service => service.binding === 'USAGE_WRITER_RELAY')) {
            throw new Error('Selected usage source requires the retired usage writer relay; use a direct-writer revision or its historical deployment workflow');
          }
          const queuesRequired = config.queues.producers.some(p => p.queue?.endsWith('-eu'));
          appendFileSync(process.env.GITHUB_OUTPUT, `queues_required=${queuesRequired}\n`);
          const helper = 'scripts/provision-queues.mjs';
          const supported = existsSync(helper) && (environment === 'staging' || require(`./${helper}`).supportedEnvironments?.includes('production') === true);
          appendFileSync(process.env.GITHUB_OUTPUT, `prepare_required=${queuesRequired || supported}\n`);
          NODE

      - name: Prepare usage queues
        if: steps.usage_queues.outputs.prepare_required == 'true'
        working-directory: services/usage-ingest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: node scripts/provision-queues.mjs "$TARGET_ENVIRONMENT"

      - name: Deploy to Cloudflare Workers
        id: deploy
        if: inputs.worker != 'services/auto-routing-benchmark' || inputs.target_environment != 'production'
        # One bounded retry for Cloudflare's flaky upload validation; the matrix
        # job below carries the evidence. A real failure fails both attempts.
        continue-on-error: true
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: ${{ inputs.worker }}
          # Workers that define a `predeploy` script (e.g. D1 migrations) run it
          # right before deploy; all other workers are unaffected.
          preCommands: |
            if [ "$(jq -r '.scripts.predeploy // empty' package.json)" != "" ]; then pnpm run predeploy; fi
          command: ${{ steps.runtime.outputs.command || (inputs.target_environment == 'production' && 'deploy' || format('deploy --env {0}', inputs.target_environment)) }} ${{ steps.usage_queues.outputs.queues_required == 'true' && '--experimental-provision=false' || '' }}

      - name: Deploy to Cloudflare Workers (retry)
        if: steps.deploy.outcome == 'failure'
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: ${{ inputs.worker }}
          preCommands: |
            if [ "$(jq -r '.scripts.predeploy // empty' package.json)" != "" ]; then pnpm run predeploy; fi
          command: ${{ steps.runtime.outputs.command || (inputs.target_environment == 'production' && 'deploy' || format('deploy --env {0}', inputs.target_environment)) }} ${{ steps.usage_queues.outputs.queues_required == 'true' && '--experimental-provision=false' || '' }}

  detect-changes:
    if: inputs.worker == '' && inputs.base_sha != ''
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      deploy-cloud-agent-after-session-ingest: ${{ steps.set-matrix.outputs.deploy-cloud-agent-after-session-ingest }}
    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      # scripts/changed-dependencies.mjs parses pnpm-lock.yaml with js-yaml,
      # so detection needs the root dependencies.
      - name: Mount pnpm store
        uses: ./.github/actions/pnpm-store

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      - name: Install root dependencies
        run: pnpm --filter kilocode-monorepo install --frozen-lockfile --ignore-scripts

      # Discover the deployable Workers and select the ones this release changes.
      # scripts/deploy-changed-workers.sh owns the rules, including which Markdown
      # a Worker reads at runtime; its test drives the same script on Git fixtures.
      - name: Find changed workers
        id: set-matrix
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: bash scripts/deploy-changed-workers.sh

  deploy-changed:
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix != '[]' && needs.detect-changes.outputs.matrix != ''
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: ${{ matrix.worker == 'services/cloud-agent-next' && 75 || matrix.worker == 'services/auto-routing-benchmark' && inputs.target_environment == 'production' && 60 || 25 }}
    environment: ${{ inputs.target_environment }}
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    name: Deploy ${{ matrix.worker }}
    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Setup Bun
        if: matrix.worker == 'services/cloud-agent-next'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        working-directory: ${{ matrix.worker }}
        run: pnpm install --frozen-lockfile

      - name: Prepare downloaded Cloud Agent runtime
        if: matrix.worker == 'services/cloud-agent-next'
        id: runtime
        working-directory: services/cloud-agent-next
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          RUNTIME_R2_ACCOUNT_ID: ${{ vars.CLOUD_AGENT_RUNTIME_ACCOUNT_ID }}
          RUNTIME_R2_BUCKET: ${{ vars.CLOUD_AGENT_RUNTIME_BUCKET }}
          RUNTIME_R2_ACCESS_KEY_ID: ${{ secrets.CLOUD_AGENT_RUNTIME_R2_ACCESS_KEY_ID }}
          RUNTIME_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUD_AGENT_RUNTIME_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUD_AGENT_RUNTIME_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Read-only: lets preparation stop waiting once the SHA's publication has failed.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -f scripts/prepare-runtime-deploy.ts ] || [ -f runtime-targets.json ]; then
            pnpm exec tsx scripts/prepare-runtime-deploy.ts "$TARGET_ENVIRONMENT" "$SOURCE_SHA"
          fi

      - name: Drain and deploy benchmark
        if: matrix.worker == 'services/auto-routing-benchmark' && inputs.target_environment == 'production'
        working-directory: ${{ matrix.worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm run deploy

      - name: Check selected usage queues
        id: usage_queues
        if: matrix.worker == 'services/usage-ingest' && (inputs.target_environment == 'staging' || inputs.target_environment == 'production')
        working-directory: services/usage-ingest
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          node --input-type=commonjs <<'NODE'
          const { appendFileSync, existsSync } = require('node:fs');
          const { unstable_readConfig } = require('wrangler');
          const environment = process.env.TARGET_ENVIRONMENT;
          const config = unstable_readConfig({ config: 'wrangler.jsonc', env: environment === 'staging' ? 'staging' : undefined });
          if (config.services.some(service => service.binding === 'USAGE_WRITER_RELAY')) {
            throw new Error('Selected usage source requires the retired usage writer relay; use a direct-writer revision or its historical deployment workflow');
          }
          const queuesRequired = config.queues.producers.some(p => p.queue?.endsWith('-eu'));
          appendFileSync(process.env.GITHUB_OUTPUT, `queues_required=${queuesRequired}\n`);
          const helper = 'scripts/provision-queues.mjs';
          const supported = existsSync(helper) && (environment === 'staging' || require(`./${helper}`).supportedEnvironments?.includes('production') === true);
          appendFileSync(process.env.GITHUB_OUTPUT, `prepare_required=${queuesRequired || supported}\n`);
          NODE

      - name: Prepare usage queues
        if: steps.usage_queues.outputs.prepare_required == 'true'
        working-directory: services/usage-ingest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: node scripts/provision-queues.mjs "$TARGET_ENVIRONMENT"

      - name: Deploy to Cloudflare Workers
        id: deploy
        if: matrix.worker != 'services/auto-routing-benchmark' || inputs.target_environment != 'production'
        # Cloudflare's upload validation is flaky for a script that sits close to
        # its startup budget: a byte-identical cloud-agent-next bundle reported
        # widely different startup times, and a rejection with "Script startup
        # exceeded CPU time limit" or "Pipeline binding error" cleared on the next
        # attempt. The retry below absorbs that noise. A real failure fails both
        # attempts, so the job still fails.
        continue-on-error: true
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: ${{ matrix.worker }}
          # Workers that define a `predeploy` script (e.g. D1 migrations) run it
          # right before deploy; all other workers are unaffected.
          preCommands: |
            if [ "$(jq -r '.scripts.predeploy // empty' package.json)" != "" ]; then pnpm run predeploy; fi
          command: ${{ steps.runtime.outputs.command || (inputs.target_environment == 'production' && 'deploy' || format('deploy --env {0}', inputs.target_environment)) }} ${{ steps.usage_queues.outputs.queues_required == 'true' && '--experimental-provision=false' || '' }}

      - name: Deploy to Cloudflare Workers (retry)
        if: steps.deploy.outcome == 'failure'
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: ${{ matrix.worker }}
          preCommands: |
            if [ "$(jq -r '.scripts.predeploy // empty' package.json)" != "" ]; then pnpm run predeploy; fi
          command: ${{ steps.runtime.outputs.command || (inputs.target_environment == 'production' && 'deploy' || format('deploy --env {0}', inputs.target_environment)) }} ${{ steps.usage_queues.outputs.queues_required == 'true' && '--experimental-provision=false' || '' }}

  deploy-cloud-agent-after-session-ingest:
    needs: detect-changes
    if: needs.detect-changes.outputs.deploy-cloud-agent-after-session-ingest == 'true'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 100
    environment: ${{ inputs.target_environment }}
    name: Deploy cloud-agent-next after session-ingest
    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Wait for session-ingest deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 360); do
            conclusion=$(gh api \
              "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
              --jq '.jobs[] | select(.name == "Deploy services/session-ingest" or (.name | endswith(" / Deploy services/session-ingest"))) | (.conclusion // .status)' \
              | head -n 1)
            if [ "$conclusion" = success ]; then exit 0; fi
            if [ -n "$conclusion" ] \
              && [ "$conclusion" != queued ] \
              && [ "$conclusion" != in_progress ]; then
              exit 1
            fi
            sleep 5
          done
          exit 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Install cloud-agent-next dependencies
        working-directory: services/cloud-agent-next
        run: pnpm install --frozen-lockfile

      - name: Prepare downloaded Cloud Agent runtime
        id: runtime
        working-directory: services/cloud-agent-next
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          RUNTIME_R2_ACCOUNT_ID: ${{ vars.CLOUD_AGENT_RUNTIME_ACCOUNT_ID }}
          RUNTIME_R2_BUCKET: ${{ vars.CLOUD_AGENT_RUNTIME_BUCKET }}
          RUNTIME_R2_ACCESS_KEY_ID: ${{ secrets.CLOUD_AGENT_RUNTIME_R2_ACCESS_KEY_ID }}
          RUNTIME_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUD_AGENT_RUNTIME_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUD_AGENT_RUNTIME_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Read-only: lets preparation stop waiting once the SHA's publication has failed.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -f scripts/prepare-runtime-deploy.ts ] || [ -f runtime-targets.json ]; then
            pnpm exec tsx scripts/prepare-runtime-deploy.ts "$TARGET_ENVIRONMENT" "$SOURCE_SHA"
          fi

      - name: Deploy cloud-agent-next
        id: deploy-cloud-agent
        continue-on-error: true
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: services/cloud-agent-next
          preCommands: pnpm run predeploy
          command: ${{ steps.runtime.outputs.command || (inputs.target_environment == 'production' && 'deploy' || format('deploy --env {0}', inputs.target_environment)) }}

      - name: Deploy cloud-agent-next (retry)
        if: steps.deploy-cloud-agent.outcome == 'failure'
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: services/cloud-agent-next
          preCommands: pnpm run predeploy
          command: ${{ steps.runtime.outputs.command || (inputs.target_environment == 'production' && 'deploy' || format('deploy --env {0}', inputs.target_environment)) }}
