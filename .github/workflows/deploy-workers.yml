      # its own, revoked right after it; the deploy token below is minted after the wait. Masks
      # each token and hands it on only as a step output; a refusal fails the job and never falls
      # back to the secret (rolling back means DEPLOY_TOKEN_SOURCE `secret`).
      - name: Get a runtime token from STS
        id: sts_runtime
        env:
          STS_ENVIRONMENT: ${{ inputs.target_environment }}
        run: bash scripts/ci/sts-deploy-token.sh mint

      # Temporary read-only R2 credentials for the runtime bucket, from the runtime token: this job
      # never reads the stored CLOUD_AGENT_RUNTIME_R2_* keys.
      - name: Get temporary R2 credentials
        id: r2
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.sts_runtime.outputs.token }}
          RUNTIME_R2_ACCOUNT_ID: ${{ vars.CLOUD_AGENT_RUNTIME_ACCOUNT_ID }}
          RUNTIME_R2_BUCKET: ${{ vars.CLOUD_AGENT_RUNTIME_BUCKET }}
          RUNTIME_R2_PARENT_ACCESS_KEY_ID: ${{ vars.CLOUD_AGENT_RUNTIME_R2_PARENT_ACCESS_KEY_ID }}
          RUNTIME_R2_PERMISSION: object-read-only
        run: bash scripts/ci/r2-temp-credentials.sh

      - name: Prepare downloaded Cloud Agent runtime
        id: runtime
        working-directory: services/cloud-agent-next
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          RUNTIME_R2_ACCOUNT_ID: ${{ vars.CLOUD_AGENT_RUNTIME_ACCOUNT_ID }}
          RUNTIME_R2_BUCKET: ${{ vars.CLOUD_AGENT_RUNTIME_BUCKET }}
          RUNTIME_R2_ACCESS_KEY_ID: ${{ steps.r2.outputs.access_key_id }}
          RUNTIME_R2_SECRET_ACCESS_KEY: ${{ steps.r2.outputs.secret_access_key }}
          RUNTIME_R2_SESSION_TOKEN: ${{ steps.r2.outputs.session_token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUD_AGENT_RUNTIME_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ steps.sts_runtime.outputs.token }}
          # Read-only: lets preparation stop waiting once the SHA's publication has failed.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -f scripts/prepare-runtime-deploy.ts ] || [ -f runtime-targets.json ]; then
            pnpm exec tsx scripts/prepare-runtime-deploy.ts "$TARGET_ENVIRONMENT" "$SOURCE_SHA"
          fi

      - name: Revoke the runtime token
        if: always() && steps.sts_runtime.outputs.token_id != ''
        env:
          STS_ENVIRONMENT: ${{ inputs.target_environment }}
          TOKEN_ID: ${{ steps.sts_runtime.outputs.token_id }}
        run: bash scripts/ci/sts-deploy-token.sh revoke "$TOKEN_ID"

