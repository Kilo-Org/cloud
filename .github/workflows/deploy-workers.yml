      # an inherited binding, after a check that the Worker's latest version carries it unchanged.
      - name: Inherit Secrets Store bindings
        working-directory: services/cloud-agent-next
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.sts.outputs.token }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          config=wrangler.jsonc
          if [ -f wrangler.runtime-generated.json ]; then config=wrangler.runtime-generated.json; fi
          node "$GITHUB_WORKSPACE/scripts/ci/inherit-secret-bindings.mjs" "$config" "$TARGET_ENVIRONMENT"

