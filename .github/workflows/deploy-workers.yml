name: Deploy Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      worker:
        description: 'Worker folder to deploy (e.g. services/session-ingest)'
        required: true
        type: string
      target_environment:
        description: 'Worker environment to deploy to'
        required: false
        default: production
        type: choice
        options:
          - production
          - staging
  # A call does one of two things, decided by its inputs:
  #
  # * detection: `base_sha` is set and `worker_matrix` is empty, so only
  #   `detect-changes` runs and the call publishes the matrix as an output.
  #   A caller can start it as soon as it holds the baseline, beside other work.
  # * deploy: `worker_matrix` holds the matrix a detection call produced, so only
  #   the deploy jobs run, behind the caller's gate, with the same SHAs.
  #
  # Manual dispatch stays the single-Worker path (`worker`).
  workflow_call:
    inputs:
      worker:
        description: 'Worker folder to deploy for single-worker calls'
        required: false
        default: ''
        type: string
      base_sha:
        description: 'Base SHA to diff against when detecting changed workers'
        required: false
        default: ''
        type: string
      worker_matrix:
        description: 'JSON array of Worker folders to deploy; a call without it only detects changes'
        required: false
        default: ''
        type: string
      deploy_cloud_agent_after_session_ingest:
        description: 'Deploy session-ingest and then cloud-agent-next ahead of the parallel matrix'
        required: false
        default: 'false'
        type: string
      deploy_uts_feed_after_uts:
        description: 'Deploy uts and then uts-feed ahead of the parallel matrix'
        required: false
        default: 'false'
        type: string
      source_sha:
        description: 'Exact tested commit to deploy (defaults to the caller SHA)'
        required: false
        default: ''
        type: string
      target_environment:
        description: 'Worker environment to deploy to'
        required: false
        default: production
        type: string
    outputs:
      matrix:
        value: ${{ jobs.detect-changes.outputs.matrix }}
      deploy-cloud-agent-after-session-ingest:
        value: ${{ jobs.detect-changes.outputs.deploy-cloud-agent-after-session-ingest }}
      deploy-uts-feed-after-uts:
        value: ${{ jobs.detect-changes.outputs.deploy-uts-feed-after-uts }}

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-workers-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  # The repository variable DEPLOY_TOKEN_SOURCE picks one of two twins of each deploy job
  # (services/sts/README.md, "Cloudflare deploy tokens"): unset or `secret` runs the job below with
  # the stored CLOUDFLARE_API_TOKEN and CLOUD_AGENT_RUNTIME_R2_* secrets; `sts` runs its `-sts`
  # twin at the end of this file, which reads neither and deploys with a token STS mints for the
  # job over GitHub OIDC. scripts/deployment-workflows.test.mjs holds each twin to its job.
  deploy-manual:
    # Guard: this workflow_dispatch is reachable from a fork, and it deploys
    # Cloudflare Workers using repo secrets. Only the canonical repo may run
    # it. (Also called as a reusable workflow from deploy-staging.yml, whose
    # caller job is itself guarded.)
    if: inputs.worker != '' && github.repository == 'Kilo-Org/cloud' && vars.DEPLOY_TOKEN_SOURCE != 'sts'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.worker == 'services/cloud-agent-next' && 75 || inputs.worker == 'services/auto-routing-benchmark' && inputs.target_environment == 'production' && 60 || 25 }}
    name: Deploy ${{ inputs.worker }}
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Require the named Worker environment
        # Runs before any dependency hook, runtime publication, provisioning or
        # Wrangler call. Without its own `env.<target>` object Wrangler warns and
        # deploys the top-level (production) configuration, so a nonproduction
        # deploy stops here. This does not prove the environment's bindings are
        # isolated from production.
        if: inputs.target_environment != 'production'
        env:
          WORKER: ${{ inputs.worker }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          if ! node scripts/has-named-environment.mjs "$WORKER/wrangler.jsonc" "$TARGET_ENVIRONMENT"; then
            echo "::error::$WORKER/wrangler.jsonc does not define env.$TARGET_ENVIRONMENT; refusing to deploy" >&2
            exit 1
          fi

      - name: Setup Bun
        if: inputs.worker == 'services/cloud-agent-next'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        working-directory: ${{ inputs.worker }}
        # Only the Worker's own dependency closure plus the root project: a
        # recursive workspace install links every unrelated package and runs its
        # lifecycle scripts in each deploy job. A Worker whose predeploy builds a
        # nested workspace package (the cloud-agent wrapper) needs that package's
        # closure as well.
        run: |
          filters=(--filter '{.}...' --filter kilocode-monorepo)
          if [ -f wrapper/package.json ]; then
            filters+=(--filter '@kilocode/cloud-agent-wrapper...')
          fi
          # A registry download that fails on the runner leaves a lifecycle script
          # (such as the workerd postinstall) failed; a plain rerun repeats it.
          for attempt in 1 2 3; do
            pnpm install --frozen-lockfile "${filters[@]}" && exit 0
            echo "::warning::pnpm install failed (attempt $attempt of 3)"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 20))
          done
          exit 1

      - name: Prepare downloaded Cloud Agent runtime
        if: inputs.worker == 'services/cloud-agent-next'
        id: runtime
        working-directory: services/cloud-agent-next
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          RUNTIME_R2_ACCOUNT_ID: ${{ vars.CLOUD_AGENT_RUNTIME_ACCOUNT_ID }}
          RUNTIME_R2_BUCKET: ${{ vars.CLOUD_AGENT_RUNTIME_BUCKET }}
          RUNTIME_R2_ACCESS_KEY_ID: ${{ secrets.CLOUD_AGENT_RUNTIME_R2_ACCESS_KEY_ID }}
          RUNTIME_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUD_AGENT_RUNTIME_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUD_AGENT_RUNTIME_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Read-only: lets preparation stop waiting once the SHA's publication has failed.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -f scripts/prepare-runtime-deploy.ts ] || [ -f runtime-targets.json ]; then
            pnpm exec tsx scripts/prepare-runtime-deploy.ts "$TARGET_ENVIRONMENT" "$SOURCE_SHA"
          fi

      - name: Drain and deploy benchmark
        if: inputs.worker == 'services/auto-routing-benchmark' && inputs.target_environment == 'production'
        working-directory: ${{ inputs.worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm run deploy

      - name: Check selected usage queues
        id: usage_queues
        if: inputs.worker == 'services/usage-ingest' && (inputs.target_environment == 'staging' || inputs.target_environment == 'production')
        working-directory: services/usage-ingest
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          node --input-type=commonjs <<'NODE'
          const { appendFileSync, existsSync } = require('node:fs');
          const { unstable_readConfig } = require('wrangler');
          const environment = process.env.TARGET_ENVIRONMENT;
          const config = unstable_readConfig({ config: 'wrangler.jsonc', env: environment === 'staging' ? 'staging' : undefined });
          if (config.services.some(service => service.binding === 'USAGE_WRITER_RELAY')) {
            throw new Error('Selected usage source requires the retired usage writer relay; use a direct-writer revision or its historical deployment workflow');
          }
          const queuesRequired = config.queues.producers.some(p => p.queue?.endsWith('-eu'));
          appendFileSync(process.env.GITHUB_OUTPUT, `queues_required=${queuesRequired}\n`);
          const helper = 'scripts/provision-queues.mjs';
          const supported = existsSync(helper) && (environment === 'staging' || require(`./${helper}`).supportedEnvironments?.includes('production') === true);
          appendFileSync(process.env.GITHUB_OUTPUT, `prepare_required=${queuesRequired || supported}\n`);
          NODE

      - name: Prepare usage queues
        if: steps.usage_queues.outputs.prepare_required == 'true'
        working-directory: services/usage-ingest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: node scripts/provision-queues.mjs "$TARGET_ENVIRONMENT"

      - name: Deploy to Cloudflare Workers
        id: deploy
        if: inputs.worker != 'services/auto-routing-benchmark' || inputs.target_environment != 'production'
        # One bounded retry for Cloudflare's flaky upload validation; the matrix
        # job below carries the evidence. A real failure fails both attempts.
        continue-on-error: true
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        env:
          CLOUD_AGENT_DEPLOY_ENVIRONMENT: ${{ inputs.target_environment }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: ${{ inputs.worker }}
          # Workers that define a `predeploy` script (e.g. D1 migrations) run it
          # right before deploy; all other workers are unaffected.
          preCommands: |
            if [ "$(jq -r '.scripts.predeploy // empty' package.json)" != "" ]; then pnpm run predeploy; fi
          command: ${{ inputs.worker == 'services/cloud-agent-next' && format('{0} dist/worker/index.js --no-bundle --upload-source-maps', steps.runtime.outputs.command || (inputs.target_environment == 'production' && 'deploy' || format('deploy --env {0}', inputs.target_environment))) || (steps.runtime.outputs.command || (inputs.target_environment == 'production' && 'deploy' || format('deploy --env {0}', inputs.target_environment))) }} ${{ steps.usage_queues.outputs.queues_required == 'true' && '--experimental-provision=false' || '' }}

      - name: Deploy to Cloudflare Workers (retry)
        if: steps.deploy.outcome == 'failure'
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        env:
          CLOUD_AGENT_DEPLOY_ENVIRONMENT: ${{ inputs.target_environment }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: ${{ inputs.worker }}
          preCommands: |
            if [ "$(jq -r '.scripts.predeploy // empty' package.json)" != "" ]; then pnpm run predeploy; fi
          command: ${{ inputs.worker == 'services/cloud-agent-next' && format('{0} dist/worker/index.js --no-bundle --upload-source-maps', steps.runtime.outputs.command || (inputs.target_environment == 'production' && 'deploy' || format('deploy --env {0}', inputs.target_environment))) || (steps.runtime.outputs.command || (inputs.target_environment == 'production' && 'deploy' || format('deploy --env {0}', inputs.target_environment))) }} ${{ steps.usage_queues.outputs.queues_required == 'true' && '--experimental-provision=false' || '' }}

      # Validated and handed over here; the upload-cloud-agent-sentry job uploads
      # them with the Sentry token from STS, which this job never holds.
      - name: Stage Cloud Agent Sentry source maps
        id: sentry-stage
        if: inputs.worker == 'services/cloud-agent-next'
        continue-on-error: true
        working-directory: ${{ inputs.worker }}
        # handoff.json binds the maps to this run attempt and the deployed commit.
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          pnpm run sentry:stage "$RUNNER_TEMP/cloud-agent-sentry"
          jq -n --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" --arg source_sha "$SOURCE_SHA" \
            '{run_id: $run_id, run_attempt: $run_attempt, source_sha: $source_sha, worker: "services/cloud-agent-next"}' \
            > "$RUNNER_TEMP/cloud-agent-sentry/handoff.json"
          tar -czf "$RUNNER_TEMP/cloud-agent-sentry.tgz" -C "$RUNNER_TEMP/cloud-agent-sentry" .

      - name: Hand over Cloud Agent Sentry source maps
        if: steps.sentry-stage.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloud-agent-sentry-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cloud-agent-sentry.tgz
          retention-days: 1
          compression-level: 0

  # The detection-only call: a deploy call passes `worker_matrix`, so this job
  # skips there and no caller runs the diff twice.
  detect-changes:
    # Manual dispatch has no `base_sha` (it is a `workflow_call` input only), so
    # change detection is reachable only through `workflow_call`.
    # Guard: privileged workflow. Only the canonical repo may run it.
    if: >-
      inputs.worker == '' &&
      inputs.base_sha != '' &&
      inputs.worker_matrix == '' &&
      github.repository == 'Kilo-Org/cloud'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    # 10 not 5: the Blacksmith checkout's mirror refresh took ~400 s (3 x 120 s
    # fetch attempts plus waits) in a slowdown, and that post step had no room in
    # a 5 minute budget, so it cancelled this gate and every deploy behind it.
    # The actions/checkout below drops the mirror refresh.
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      deploy-cloud-agent-after-session-ingest: ${{ steps.set-matrix.outputs.deploy-cloud-agent-after-session-ingest }}
      deploy-uts-feed-after-uts: ${{ steps.set-matrix.outputs.deploy-uts-feed-after-uts }}
    steps:
      # Full history so the diff from the last complete deployment resolves, and
      # no blobs up front: the diffs are tree-only, while the base commit's
      # objects `scripts/affected-workspaces.mjs` reads come from the public
      # repository on demand.
      # actions/checkout has no Blacksmith mirror to refresh.
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          filter: blob:none
          ref: ${{ inputs.source_sha || github.sha }}
          # Nothing here pushes, and the repository is public: the lazy blob
          # fetches below need no token.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      # scripts/changed-dependencies.mjs parses a dependency input
      # (pnpm-lock.yaml, pnpm-workspace.yaml or a patch file) with js-yaml, so
      # detection needs the root dependencies.
      - name: Mount pnpm store
        uses: ./.github/actions/pnpm-store

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      - name: Install root dependencies
        run: pnpm --filter kilocode-monorepo install --frozen-lockfile --ignore-scripts

      - name: Find changed workers
        id: set-matrix
        run: |
          # Auto-discover all deployable workers (folders containing wrangler.jsonc)
          # and exclude workers outside the automatic deployment pipeline.
          #
          # Diff from the last complete deployment so failed runs do not lose
          # Worker changes. Staging requires an explicitly configured environment.
          BASE_SHA="${{ inputs.base_sha }}"
          TARGET_ENVIRONMENT="${{ inputs.target_environment }}"

          has_named_environment() {
            node scripts/has-named-environment.mjs "$1" "$TARGET_ENVIRONMENT"
          }

          # Workers excluded from automatic deployment:
          EXCLUDED=(
            services/kiloclaw  # No CI deploy: its image-and-worker workflow was removed
            services/user-data-export # Automatic deploy suspended
            # Deployed manually per environment until the production setup (slice E-prod) is done
            services/migration-proxy
          )

          # Discover all workers with a wrangler.jsonc
          WORKERS=()
          while IFS= read -r cfg; do
            dir=$(dirname "$cfg")
            WORKERS+=("$dir")
          done < <(find services -name "wrangler.jsonc" -not -path "*/node_modules/*" -not -path "*/test/fixtures/*" | sort)

          # Filter out excluded workers
          DEPLOYABLE=()
          for dir in "${WORKERS[@]}"; do
            skip=false
            for excluded in "${EXCLUDED[@]}"; do
              if [[ "$dir" == "$excluded" ]]; then
                skip=true
                break
              fi
            done
            if [[ "$skip" == false ]]; then
              DEPLOYABLE+=("$dir")
            fi
          done

          # A worker redeploys when its own files change, or when a workspace
          # it depends on changes (scripts/affected-workspaces.mjs). A change to
          # an unrelated shared package must not restart the worker: a rollout
          # kills in-flight containers. If detection fails, selects everything,
          # or the worker is not a workspace, use the broad rule.
          AFFECTED_DIRS=""
          NARROW=false
          if affected=$(node scripts/affected-workspaces.mjs "$BASE_SHA") \
            && [ "$(jq -r '.full' <<< "$affected")" = false ] \
            && AFFECTED_DIRS=$(jq -r '.dirs[]' <<< "$affected") \
            && WORKSPACE_DIRS=$(set -o pipefail; pnpm ls -r --depth -1 --json | jq -r --arg root "$(pwd -P)/" '.[].path | ltrimstr($root)'); then
            NARROW=true
          else
            echo "Workspace detection unavailable or selected everything; using the broad rule"
          fi

          CHANGED=()
          for dir in "${DEPLOYABLE[@]}"; do
            if [ "$TARGET_ENVIRONMENT" != "production" ] && ! has_named_environment "$dir/wrangler.jsonc"; then
              echo "Skipping $dir: wrangler.jsonc does not define env.$TARGET_ENVIRONMENT"
            elif ! git diff --quiet "$BASE_SHA" HEAD -- "$dir/"; then
              CHANGED+=("$dir")
            elif [ "$dir" = services/pages-output ] \
              && ! git diff --quiet "$BASE_SHA" HEAD -- services/pages/source.json; then
              # The output shell builds from the Pages pin, so a pin move
              # deploys it beside services/pages, under either rule below.
              CHANGED+=("$dir")
            elif [ "$NARROW" = true ] && grep -Fxq "$dir" <<< "$WORKSPACE_DIRS"; then
              if grep -Fxq "$dir" <<< "$AFFECTED_DIRS"; then
                CHANGED+=("$dir")
              fi
            elif ! git diff --quiet "$BASE_SHA" HEAD -- packages pnpm-lock.yaml pnpm-workspace.yaml patches; then
              CHANGED+=("$dir")
            fi
          done

          DEPLOY_CLOUD_AGENT_AFTER_SESSION_INGEST=false
          if [ "$TARGET_ENVIRONMENT" = production ] && [ "$NARROW" = true ] \
            && grep -Fxq services/session-ingest <<< "$AFFECTED_DIRS" \
            && grep -Fxq services/cloud-agent-next <<< "$AFFECTED_DIRS"; then
            DEPLOY_CLOUD_AGENT_AFTER_SESSION_INGEST=true
          fi
          echo "deploy-cloud-agent-after-session-ingest=$DEPLOY_CLOUD_AGENT_AFTER_SESSION_INGEST" >> "$GITHUB_OUTPUT"

          # The UTS feed Worker binds the UTS mint Worker, so when both change (always on the
          # first deploy of an environment), uts deploys first and uts-feed only after it succeeds.
          DEPLOY_UTS_FEED_AFTER_UTS=false
          if [[ " ${CHANGED[*]} " == *" services/uts "* && " ${CHANGED[*]} " == *" services/uts-feed "* ]]; then
            DEPLOY_UTS_FEED_AFTER_UTS=true
          fi
          echo "deploy-uts-feed-after-uts=$DEPLOY_UTS_FEED_AFTER_UTS" >> "$GITHUB_OUTPUT"

          # Each ordered deployment path owns both of its workers: the first runs as its own
          # job and the second needs that job, so neither may also sit in the parallel matrix.
          FILTERED=()
          for dir in "${CHANGED[@]}"; do
            if [ "$DEPLOY_CLOUD_AGENT_AFTER_SESSION_INGEST" = true ] \
              && { [ "$dir" = services/session-ingest ] || [ "$dir" = services/cloud-agent-next ]; }; then
              continue
            fi
            if [ "$DEPLOY_UTS_FEED_AFTER_UTS" = true ] \
              && { [ "$dir" = services/uts ] || [ "$dir" = services/uts-feed ]; }; then
              continue
            fi
            FILTERED+=("$dir")
          done
          CHANGED=("${FILTERED[@]}")

          if [ ${#CHANGED[@]} -eq 0 ]; then
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
          else
            MATRIX=$(printf '%s\n' "${CHANGED[@]}" | jq -R . | jq -sc .)
            echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          fi

  # A call must select its work: one Worker, a baseline to detect changes from,
  # or a detected matrix to deploy. A call that names none of them would deploy
  # nothing and still report success, so it fails here. The job reserves no
  # runner on a healthy call.
  missing-selection:
    if: inputs.worker == '' && inputs.worker_matrix == '' && inputs.base_sha == ''
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Reject a call without a Worker selection
        run: |
          echo "::error::Pass \`worker\` for a single deploy, or \`base_sha\` to detect changes, or \`worker_matrix\` to deploy a detected matrix; a call with none of them is a wiring error." >&2
          exit 1

  deploy-changed:
    if: inputs.worker_matrix != '[]' && inputs.worker_matrix != '' && github.repository == 'Kilo-Org/cloud' && vars.DEPLOY_TOKEN_SOURCE != 'sts'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: ${{ matrix.worker == 'services/cloud-agent-next' && 75 || matrix.worker == 'services/auto-routing-benchmark' && inputs.target_environment == 'production' && 60 || 25 }}
    environment: ${{ inputs.target_environment }}
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJson(inputs.worker_matrix) }}
    name: Deploy ${{ matrix.worker }}
    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Setup Bun
        if: matrix.worker == 'services/cloud-agent-next'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        working-directory: ${{ matrix.worker }}
        # Only the Worker's own dependency closure plus the root project: a
        # recursive workspace install links every unrelated package and runs its
        # lifecycle scripts in each matrix job. A Worker whose predeploy builds a
        # nested workspace package (the cloud-agent wrapper) needs that package's
        # closure as well.
        run: |
          filters=(--filter '{.}...' --filter kilocode-monorepo)
          if [ -f wrapper/package.json ]; then
            filters+=(--filter '@kilocode/cloud-agent-wrapper...')
          fi
          # A registry download that fails on the runner leaves a lifecycle script
          # (such as the workerd postinstall) failed; a plain rerun repeats it.
          for attempt in 1 2 3; do
            pnpm install --frozen-lockfile "${filters[@]}" && exit 0
            echo "::warning::pnpm install failed (attempt $attempt of 3)"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 20))
          done
          exit 1

      - name: Prepare downloaded Cloud Agent runtime
        if: matrix.worker == 'services/cloud-agent-next'
        id: runtime
        working-directory: services/cloud-agent-next
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          RUNTIME_R2_ACCOUNT_ID: ${{ vars.CLOUD_AGENT_RUNTIME_ACCOUNT_ID }}
          RUNTIME_R2_BUCKET: ${{ vars.CLOUD_AGENT_RUNTIME_BUCKET }}
          RUNTIME_R2_ACCESS_KEY_ID: ${{ secrets.CLOUD_AGENT_RUNTIME_R2_ACCESS_KEY_ID }}
          RUNTIME_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUD_AGENT_RUNTIME_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUD_AGENT_RUNTIME_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Read-only: lets preparation stop waiting once the SHA's publication has failed.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -f scripts/prepare-runtime-deploy.ts ] || [ -f runtime-targets.json ]; then
            pnpm exec tsx scripts/prepare-runtime-deploy.ts "$TARGET_ENVIRONMENT" "$SOURCE_SHA"
          fi

      - name: Drain and deploy benchmark
        if: matrix.worker == 'services/auto-routing-benchmark' && inputs.target_environment == 'production'
        working-directory: ${{ matrix.worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm run deploy

      - name: Check selected usage queues
        id: usage_queues
        if: matrix.worker == 'services/usage-ingest' && (inputs.target_environment == 'staging' || inputs.target_environment == 'production')
        working-directory: services/usage-ingest
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          node --input-type=commonjs <<'NODE'
          const { appendFileSync, existsSync } = require('node:fs');
          const { unstable_readConfig } = require('wrangler');
          const environment = process.env.TARGET_ENVIRONMENT;
          const config = unstable_readConfig({ config: 'wrangler.jsonc', env: environment === 'staging' ? 'staging' : undefined });
          if (config.services.some(service => service.binding === 'USAGE_WRITER_RELAY')) {
            throw new Error('Selected usage source requires the retired usage writer relay; use a direct-writer revision or its historical deployment workflow');
          }
          const queuesRequired = config.queues.producers.some(p => p.queue?.endsWith('-eu'));
          appendFileSync(process.env.GITHUB_OUTPUT, `queues_required=${queuesRequired}\n`);
          const helper = 'scripts/provision-queues.mjs';
          const supported = existsSync(helper) && (environment === 'staging' || require(`./${helper}`).supportedEnvironments?.includes('production') === true);
          appendFileSync(process.env.GITHUB_OUTPUT, `prepare_required=${queuesRequired || supported}\n`);
