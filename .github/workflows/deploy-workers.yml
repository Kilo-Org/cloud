            if [ "$(jq -r '.scripts.predeploy // empty' package.json)" != "" ]; then pnpm run predeploy; fi
          command: ${{ matrix.worker == 'services/cloud-agent-next' && format('{0} dist/worker/index.js --no-bundle --upload-source-maps', steps.runtime.outputs.command || (inputs.target_environment == 'production' && 'deploy' || format('deploy --env {0}', inputs.target_environment))) || (steps.runtime.outputs.command || (inputs.target_environment == 'production' && 'deploy' || format('deploy --env {0}', inputs.target_environment))) }} ${{ steps.usage_queues.outputs.queues_required == 'true' && '--experimental-provision=false' || '' }}

      - name: Deploy to Cloudflare Workers (retry)
        if: steps.deploy.outcome == 'failure'
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        env:
          CLOUD_AGENT_DEPLOY_ENVIRONMENT: ${{ inputs.target_environment }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: ${{ matrix.worker }}
          preCommands: |
            if [ "$(jq -r '.scripts.predeploy // empty' package.json)" != "" ]; then pnpm run predeploy; fi
          command: ${{ matrix.worker == 'services/cloud-agent-next' && format('{0} dist/worker/index.js --no-bundle --upload-source-maps', steps.runtime.outputs.command || (inputs.target_environment == 'production' && 'deploy' || format('deploy --env {0}', inputs.target_environment))) || (steps.runtime.outputs.command || (inputs.target_environment == 'production' && 'deploy' || format('deploy --env {0}', inputs.target_environment))) }} ${{ steps.usage_queues.outputs.queues_required == 'true' && '--experimental-provision=false' || '' }}

      # Validated and handed over here; the upload-cloud-agent-sentry job uploads
      # them with the Sentry token from STS, which this job never holds.
      - name: Stage Cloud Agent Sentry source maps
        id: sentry-stage
        if: matrix.worker == 'services/cloud-agent-next'
        continue-on-error: true
        working-directory: ${{ matrix.worker }}
        # handoff.json binds the maps to this run attempt and the deployed commit.
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          pnpm run sentry:stage "$RUNNER_TEMP/cloud-agent-sentry"
          jq -n --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" --arg source_sha "$SOURCE_SHA" \
            '{run_id: $run_id, run_attempt: $run_attempt, source_sha: $source_sha, worker: "services/cloud-agent-next"}' \
            > "$RUNNER_TEMP/cloud-agent-sentry/handoff.json"
          tar -czf "$RUNNER_TEMP/cloud-agent-sentry.tgz" -C "$RUNNER_TEMP/cloud-agent-sentry" .

      - name: Hand over Cloud Agent Sentry source maps
        if: steps.sentry-stage.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloud-agent-sentry-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cloud-agent-sentry.tgz
          retention-days: 1
          compression-level: 0

  deploy-session-ingest:
    # Guard: this reusable workflow can be invoked from a fork, and the job
    # deploys to the target environment with inherited repo secrets. Only the
    # canonical repo may run it. The ordered path comes from the detection call,
    # because a deploy call does not run detection.
    if: github.repository == 'Kilo-Org/cloud' && inputs.deploy_cloud_agent_after_session_ingest == 'true' && vars.DEPLOY_TOKEN_SOURCE != 'sts'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 25
    environment: ${{ inputs.target_environment }}
    name: Deploy session-ingest before cloud-agent-next
    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        working-directory: services/session-ingest
        # Only the Worker's dependency closure plus the root project; a recursive
        # workspace install links every unrelated package as well.
        run: |
          filters=(--filter '{.}...' --filter kilocode-monorepo)
          if [ -f wrapper/package.json ]; then
            filters+=(--filter '@kilocode/cloud-agent-wrapper...')
          fi
          # A registry download that fails on the runner leaves a lifecycle script
          # (such as the workerd postinstall) failed; a plain rerun repeats it.
          for attempt in 1 2 3; do
            pnpm install --frozen-lockfile "${filters[@]}" && exit 0
            echo "::warning::pnpm install failed (attempt $attempt of 3)"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 20))
          done
          exit 1

      - name: Deploy to Cloudflare Workers
        id: deploy
        continue-on-error: true
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: services/session-ingest
          preCommands: |
            if [ "$(jq -r '.scripts.predeploy // empty' package.json)" != "" ]; then pnpm run predeploy; fi
          command: ${{ inputs.target_environment == 'production' && 'deploy' || format('deploy --env {0}', inputs.target_environment) }}

      - name: Deploy to Cloudflare Workers (retry)
        if: steps.deploy.outcome == 'failure'
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: services/session-ingest
          preCommands: |
            if [ "$(jq -r '.scripts.predeploy // empty' package.json)" != "" ]; then pnpm run predeploy; fi
          command: ${{ inputs.target_environment == 'production' && 'deploy' || format('deploy --env {0}', inputs.target_environment) }}

  deploy-cloud-agent-after-session-ingest:
    needs: deploy-session-ingest
    # GitHub skips a dependent job when a needed job fails: cloud-agent-next never
    # deploys after an unsuccessful session-ingest deployment.
    if: >-
      github.repository == 'Kilo-Org/cloud' &&
      inputs.deploy_cloud_agent_after_session_ingest == 'true' &&
      needs.deploy-session-ingest.result == 'success' &&
      vars.DEPLOY_TOKEN_SOURCE != 'sts'
