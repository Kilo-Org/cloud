  # The STS twins of the deploy jobs above (DEPLOY_TOKEN_SOURCE `sts`). Each mints its own deploy
  # token from STS over GitHub OIDC (policy ci-deploy-cloud or ci-deploy-cloud-staging, which count
  # their limits per run), deploys Secrets Store bindings as inherited ones, takes temporary R2
  # credentials from the token for the Cloud Agent runtime, and revokes the token at the end.
  deploy-manual-sts:
    # Guard: this workflow_dispatch is reachable from a fork, and it deploys
    # Cloudflare Workers with an STS deploy token. Only the canonical repo may run
