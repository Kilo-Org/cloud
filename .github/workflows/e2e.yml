name: E2E (playwright-utils)

# UI tests in e2e/, built on the private @anaconda/playwright-utils package.
# Not a required check: a failure is reported on the PR but never blocks a merge.

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # Fork PRs get no secrets, so the private package can't be installed; skip instead of failing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
      POSTGRES_CONNECT_TIMEOUT: 30000
      POSTGRES_MAX_QUERY_TIME: 30000

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Nothing here pushes; don't leave the job's GITHUB_TOKEN in .git/config for later steps.
          persist-credentials: false

      # next.config.mjs refuses to start unless this Git LFS video is real, not a pointer file.
      # Fetch only that 29 KB file instead of every LFS asset (~53 MB).
      - name: Fetch the LFS file next.config.mjs checks
        run: git lfs pull --include="apps/web/public/kilo-anim.mp4"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          # Caches the app's pnpm store only; the e2e install below uses its own uncached store.
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Install e2e dependencies
        working-directory: e2e
        # The token is scoped to this step only. The private package goes to a separate store that is
        # never cached: Actions caches on main can be restored by fork PRs.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ANACONDA_PACKAGES_READ_TOKEN }}
        run: pnpm install --frozen-lockfile --ignore-workspace --ignore-scripts --store-dir "$RUNNER_TEMP/e2e-pnpm-store"

      - name: Run database migrations
        run: pnpm drizzle migrate

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/pnpm-lock.yaml') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: e2e
        run: pnpm exec playwright install-deps chromium

      - name: Start web app
        run: nohup node e2e/ci/start-web.mjs > web-server.log 2>&1 &

      - name: Warm up routes
        run: node e2e/ci/warm-up.mjs

      - name: Run tests
        working-directory: e2e
        run: pnpm test

      - name: Show web server log
        if: failure()
        run: tail -n 100 web-server.log

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            web-server.log
          retention-days: 7
