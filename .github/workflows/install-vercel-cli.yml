name: Install Vercel CLI

# Installs the pinned Vercel CLI once per run attempt, in a job without
# id-token, and hands it over as an artifact with its SHA-256.
# stage-vercel-deployment.yml and promote-vercel-deployment.yml read their STS
# bundle first, then download this artifact, check the digest before they unpack
# it, and run the CLI by its path; neither installs anything
# (.github/actions/sts-bundle/README.md, rules for a calling job).
on:
  workflow_call:
    outputs:
      artifact:
        description: 'Name of the artifact that holds the packed Vercel CLI'
        value: ${{ jobs.install.outputs.artifact }}
      sha256:
        description: 'SHA-256 of vercel-cli.tgz in that artifact'
        value: ${{ jobs.install.outputs.sha256 }}

permissions: {}

jobs:
  install:
    # Guard: only the canonical repo may run this workflow.
    if: github.repository == 'Kilo-Org/cloud'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions: {}
    env:
      VERCEL_VERSION: '59.5.0'
    outputs:
      artifact: vercel-cli-${{ github.run_attempt }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      # From the registry on every run, without the Actions cache: a restored
      # tree could be checked by its version only, not by its content, while npm
      # checks each tarball it fetches against the registry's integrity. The
      # install runs once per deploy run, after the gate, so its time adds to
      # each deploy.
      - name: Install Vercel CLI
        env:
          VERCEL_CLI_PREFIX: ${{ runner.temp }}/vercel-cli
        run: |
          manifest="$VERCEL_CLI_PREFIX/lib/node_modules/vercel/package.json"
          npm install --global --prefix "$VERCEL_CLI_PREFIX" "vercel@$VERCEL_VERSION" --no-audit --no-fund
          installed=$(node -p "require('$manifest').version")
          if [ "$installed" != "$VERCEL_VERSION" ]; then
            echo "::error::Resolved vercel@$installed but the pinned version is $VERCEL_VERSION"
            exit 1
          fi
          "$VERCEL_CLI_PREFIX/bin/vercel" --version

      # Symlinks and file modes survive only inside an archive. Its digest goes
      # to the readers as a job output, so an artifact another job of the run
      # uploads under this name is refused.
      - name: Pack Vercel CLI
        id: pack
        run: |
          tar -czf "$RUNNER_TEMP/vercel-cli.tgz" -C "$RUNNER_TEMP/vercel-cli" .
          echo "sha256=$(sha256sum "$RUNNER_TEMP/vercel-cli.tgz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # One artifact per run attempt; the name never repeats, so nothing overwrites it.
      # A re-run of a failed stage or promote job reuses this job's artifact, so it
      # lives as long as such a re-run is likely.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vercel-cli-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vercel-cli.tgz
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
