name: kilo-app CI

# The mobile suite jobs are required checks on main, so this workflow runs on
# every PR and every main push (no path filters) and the `mobile-changes` job
# gates the suite work. An unrelated PR or push still reports the suite checks
# as skipped (a skipped job satisfies a required check) instead of leaving them
# "Expected". A push that starts a release is inside the detection below, so its
# run always executes the suite, and that release consumes this run's conclusion
# for the commit. The hourly schedule and a manual run of main stand on the tip
# of main and reuse that commit's push run as well, but only a run that passed
# and whose shard job proves the suite executed. The release calls the suite
# through `workflow_call` for any reuse it cannot prove: no run for the commit, a
# run that ended without a pass (including one the cancel-in-progress group above
# cancels when a later push lands on main), a run still in flight, and a run for
# a commit that touched no app path and so skipped the suite.
#
# The app's formatting is gated by the repo-wide `format-check` job in ci.yml:
# `oxfmt --list-different .` covers apps/mobile on every PR, merge-queue entry
# and main push, so this workflow needs no formatter job of its own.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Always runs: the required suite checks must report on every PR and every
  # main push. The detection step diffs against the PR's base sha or, on a main
  # push, `github.event.before`; when neither is available (a release's
  # schedule or manual call), the suite runs (a release must validate).
  mobile-changes:
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      mobile: ${{ steps.detect.outputs.mobile }}
    steps:
      # Full history so the change-detection step can diff against the PR's
      # base sha or the pushed commit's parent.
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      # The suite jobs always report (required checks); only the suite's own
      # paths justify the heavy work. The patterns are pinned by
      # scripts/stacked-ci.test.mjs, which ci.yml's `ci-wiring` job runs.
      # A lockfile change matches the patterns first, so the detector below
      # never parses the lockfile and needs no installed dependencies.
      - name: Detect mobile-relevant changes
        id: detect
        run: |
          set -euo pipefail
          # On a PR, diff against the base sha; on a main push (or a
          # workflow_call riding a push event), diff against
          # `github.event.before`. If neither object is available, run the
          # suite rather than skip it: a false "no changes" would break the
          # required checks' promise, while a redundant run is harmless.
          # A merge queue entry diffs against the group's base: the PRs in the
          # group passed the suite on their own branches.
          base="${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}"
          if ! git rev-parse --verify "${base}^{commit}" > /dev/null 2>&1; then
            base="${{ github.event.before }}"
          fi
          if ! git rev-parse --verify "${base}^{commit}" > /dev/null 2>&1; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" HEAD \
            | grep -Eq '^apps/mobile/|^packages/trpc/|^apps/web/src/routers/|^packages/web-shared/src/routers/|^packages/app-shared/|^packages/kilo-chat/|^packages/kilo-chat-hooks/|^packages/event-service/|^packages/notifications/|^packages/cloud-agent-sdk/|^pnpm-lock\.yaml$|^\.github/workflows/kilo-app-ci\.yml$|^\.github/workflows/ci\.yml$|^scripts/stacked-ci\.test\.mjs$'; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
          # The app also reads every workspace it depends on, directly or
          # through a relative import, and its tests may read other
          # workspaces' files as data. A detection error runs the suite.
          elif ! affected=$(node scripts/affected-workspaces.mjs "$(git rev-parse "${base}^{commit}")") \
            || ! selected=$(jq -r '.full or (.packages + .test_only_packages | index("kilo-app") != null)' <<< "$affected") \
            || [ "$selected" != false ]; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
          else
            echo "mobile=false" >> "$GITHUB_OUTPUT"
          fi

  # One harness SDK build per run. The four suites below read
  # packages/harness-sdk/dist: the shard jobs import it at run time, and the
  # type-aware checks resolve its declarations. Building it inside each job made
  # a cache miss pay the typia compile once per job, because the shards start
  # together and actions/cache saves at the end of a job, so no job can hit
  # another's save. The action still runs here, so its cache serves a later run
  # with the same inputs, and the required `test` job needs this one, so a
  # failed build fails the gate instead of leaving the suites skipped.
  #
  # One tRPC declaration build per run, for the same reason: typecheck and lint
  # both need packages/trpc/dist, they start together, and both used to run the
  # action, so on a cache miss they compiled the same declaration program twice
  # and raced to save the one key (the loser logged "Unable to reserve cache").
  # Here the build happens once and both checks download the tree.
  #
  # The two producers are separate jobs, not two steps of one job, because
  # neither build reads the other's output: one job made every consumer wait for
  # both in sequence, so a declaration miss delayed the shards that never open
  # packages/trpc/dist. `typecheck` and `lint` read both trees and wait for both
  # producers; `check-unused` and the eight `mobile-test` shards import only the
  # harness SDK build, so they wait for `prepare-harness-sdk` alone.
  prepare-harness-sdk:
    needs: mobile-changes
    if: needs.mobile-changes.outputs.mobile == 'true'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Mount pnpm store
        uses: ./.github/actions/pnpm-store

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore or build the harness SDK
        uses: ./.github/actions/harness-sdk-build

      # A directory path makes the directory the artifact root, so a consumer
      # that unpacks into packages/harness-sdk/dist gets the tree the build
      # wrote, with no extra path segment.
      - name: Upload the harness SDK build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harness-sdk-dist
          path: packages/harness-sdk/dist
          retention-days: 1
          if-no-files-found: error

  prepare-trpc:
    needs: mobile-changes
    if: needs.mobile-changes.outputs.mobile == 'true'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Mount pnpm store
        uses: ./.github/actions/pnpm-store

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      # Only the two dependency closures this job reads and the root project are
      # installed. The composite action below builds `@kilocode/trpc` alone, but
      # that declaration program also reads web-shared and apps/web sources
      # through their path aliases. Widen the filter when a step here imports a
      # workspace outside these closures.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter '@kilocode/trpc...' --filter 'web...' --filter kilocode-monorepo

      - name: Restore or build tRPC declarations
        uses: ./.github/actions/trpc-declarations

      # Same directory-root rule as the harness SDK artifact in the job above.
      - name: Upload the tRPC declarations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trpc-declarations
          path: packages/trpc/dist
          retention-days: 1
          # A cache hit that restored nothing must fail here, not in a consumer.
          if-no-files-found: error

  typecheck:
    needs: [mobile-changes, prepare-harness-sdk, prepare-trpc]
    if: needs.mobile-changes.outputs.mobile == 'true'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Mount pnpm store
        uses: ./.github/actions/pnpm-store

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the tRPC declarations
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: trpc-declarations
          path: packages/trpc/dist

      - name: Download the harness SDK build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: harness-sdk-dist
          path: packages/harness-sdk/dist

      - name: Typecheck
        run: pnpm --filter kilo-app run typecheck

      # The release preflight is the only other job that evaluates app.config.ts,
      # and it runs nightly. Read the config here so a broken import fails the PR.
      - name: Read Expo config
        run: pnpm --filter kilo-app exec expo config --type public > /dev/null

  lint:
    needs: [mobile-changes, prepare-harness-sdk, prepare-trpc]
    if: needs.mobile-changes.outputs.mobile == 'true'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Mount pnpm store
        uses: ./.github/actions/pnpm-store

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the tRPC declarations
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: trpc-declarations
          path: packages/trpc/dist

      - name: Download the harness SDK build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: harness-sdk-dist
          path: packages/harness-sdk/dist

      - name: Lint
        run: pnpm --filter kilo-app run lint

  i18n-leftover:
    needs: mobile-changes
    if: needs.mobile-changes.outputs.mobile == 'true'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Mount pnpm store
        uses: ./.github/actions/pnpm-store

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      # No step here reads types or built output, so only the workspaces the
      # tools come from are installed: the root one carries oxlint, and the
      # app one carries react-native-css, whose compiler the class checker
      # probes. The i18n oxlint config is not type-aware.
      - name: Install dependencies
        run: pnpm --filter kilocode-monorepo --filter kilo-app install --frozen-lockfile --ignore-scripts

      - name: Check i18n catalogs and leftover copy
        run: pnpm --filter kilo-app run check:i18n
      - name: Check for silently-dropped NativeWind classes
        run: pnpm --filter kilo-app run check:classes
      - name: Test the NativeWind class checker
        run: node --test tools/nativewind/check-classes.test.mjs
      - name: Test the i18n catalog checker
        run: node --test tools/i18n/check-catalogs.test.mjs

  # The unused-export check reads the harness SDK build only, so it starts when
  # that producer finishes instead of waiting for the declaration build.
  check-unused:
    needs: [mobile-changes, prepare-harness-sdk]
    if: needs.mobile-changes.outputs.mobile == 'true'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Mount pnpm store
        uses: ./.github/actions/pnpm-store

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the harness SDK build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: harness-sdk-dist
          path: packages/harness-sdk/dist

      - name: Check unused exports
        run: pnpm --filter kilo-app run check:unused

  # Eight shards run the mobile Vitest suite in parallel; the `test` job below
  # reports the combined result under the required check name.
  #
  # The shard's `Test` step is CPU-bound and the jobs start together, so the
  # runner size sets the wall clock of the whole row: measured on a work VM the
  # step drops from 84 s to 36 s per shard (2 vCPU -> 4 vCPU), against a ~15 s
  # fixed setup that does not change. Four vCPU pays for itself: the mobile row
  # gets shorter while its vCPU-seconds rise by about 2%.
  #
  # The label is `vars.RUNNER_MEDIUM_LABEL` (blacksmith-4vcpu-ubuntu-2404, 4 vCPU
  # and 16 GB; a shard peaks at 0.6 GB). Repo variables are not exposed to fork
  # pull requests, so the job falls back to `ubuntu-latest` there.
  mobile-test:
    needs: [mobile-changes, prepare-harness-sdk]
    if: needs.mobile-changes.outputs.mobile == 'true'
    name: mobile-test (${{ matrix.shard }}/8)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ${{ vars.RUNNER_MEDIUM_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Mount pnpm store
        uses: ./.github/actions/pnpm-store

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The tests import the harness SDK build at run time. The tRPC build
      # holds only type declarations, which Vitest does not read.
      - name: Download the harness SDK build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: harness-sdk-dist
          path: packages/harness-sdk/dist

      - name: Test
        run: pnpm --filter kilo-app run test --shard=${{ matrix.shard }}/8

  # Required check. Skipped shards (no mobile change) pass; a failed or
  # cancelled shard fails this job. It needs both producers for the same reason:
  # a failed producer only skips the jobs that consume it, and a skipped check
  # passes, so this job carries that failure to the gate.
  test:
    needs: [mobile-changes, prepare-harness-sdk, prepare-trpc, mobile-test]
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Check test results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if jq -e 'any(.[]; . == "failure" or . == "cancelled")' <<< "$RESULTS" > /dev/null; then
            exit 1
          fi
