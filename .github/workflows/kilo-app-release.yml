name: kilo-app Release

on:
  push:
    branches: [main]
    # kilo-app and its direct workspace:* inputs. No pnpm-lock.yaml: an
    # unrelated bump elsewhere in the monorepo must not submit a build. A bump
    # of an app dependency also edits apps/mobile/package.json, which is here.
    paths:
      - 'apps/mobile/**'
      - 'packages/trpc/**'
      - 'packages/app-shared/**'
      - 'packages/kilo-chat/**'
      - 'packages/kilo-chat-hooks/**'
      - 'packages/event-service/**'
      - 'packages/notifications/**'
      - 'packages/cloud-agent-sdk/**'
  workflow_dispatch:
  # A held release must run later even when main goes quiet: no push means no
  # run, and the held submission would wait for ever. A held or no-change run
  # costs only the check-changes job.
  schedule:
    - cron: '41 * * * *'

# cancel-in-progress: false lets a running release finish. GitHub keeps one run
# pending per group and cancels the previously pending run, so a burst of merges
# releases the newest commit, not every one of them.
concurrency:
  group: kilo-app-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-changes:
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read # read the release tags
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      allowed: ${{ steps.cap.outputs.allowed }}
      version: ${{ steps.check.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          fetch-depth: 0

      - name: Check for changes since last release
        id: check
        run: |
          # Find the latest kilo-app release tag. Read before the manual override:
          # the changelog step needs the range even for a dispatch.
          LAST_TAG=$(git tag --list 'kilo-app-release/*' --sort=-creatordate | head -n 1)
          echo "LAST_TAG=$LAST_TAG" >> "$GITHUB_ENV"

          # The version this run submits: the changelog heading and the store
          # identity assertion both read it.
          VERSION=$(sed -n "s/^  version: '\([0-9][0-9.]*\)',$/\1/p" apps/mobile/app.config.ts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # A manual run is the override: build and submit whatever main holds.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual run — building regardless of changes"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$LAST_TAG" ]; then
            echo "No previous release tag found — first build"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Last release tag: $LAST_TAG"

          # Check for changes in kilo-app or its direct workspace:* inputs since that tag.
          # CHANGELOG.md is excluded: the changelog commit this workflow pushes onto
          # the version-bump branch re-triggers this workflow, and the tag marks the
          # pre-changelog commit, so without the exclusion every release starts the
          # next one. The same exclusion retires the bump-PR merge from the range.
          CHANGES=$(git diff --name-only "$LAST_TAG"..HEAD -- apps/mobile/ packages/trpc/ packages/app-shared/ packages/kilo-chat/ packages/kilo-chat-hooks/ packages/event-service/ packages/notifications/ packages/cloud-agent-sdk/ pnpm-lock.yaml ':(exclude)apps/mobile/CHANGELOG.md')

          # The bump-version job edits the version line after every submission. Its
          # merged PR must not release the same code again, or every release starts
          # the next one.
          if [ "$CHANGES" = "apps/mobile/app.config.ts" ]; then
            OTHER=$(git diff -U0 "$LAST_TAG"..HEAD -- apps/mobile/app.config.ts | grep '^[+-][^+-]' | grep -cv "^[+-]  version: '" || true)
            if [ "$OTHER" = "0" ]; then
              echo "Only the version line changed since $LAST_TAG — skipping build"
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [ -z "$CHANGES" ]; then
            echo "No changes since $LAST_TAG — skipping build"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected since $LAST_TAG:"
            echo "$CHANGES"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Notes for the changelog
        id: notes
        if: steps.check.outputs.should_build == 'true'
        run: |
          if [ -n "$LAST_TAG" ]; then
            NOTES=$(node scripts/kilo-app-release-notes.mjs body --from "$LAST_TAG" --to HEAD)
          else
            NOTES=$(node scripts/kilo-app-release-notes.mjs body)
          fi
          printf '%s\n' "$NOTES"
          {
            echo 'notes<<NOTES_EOF'
            printf '%s\n' "$NOTES"
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      # The cost gate: the last thing before any build. Apple refuses a
      # submission over its rolling upload limit, and the failure is the whole
      # point of the gate — never build an artifact the throttle will refuse.
      # The count is the App Store Connect uploads themselves (the
      # kilo-app-upload/ markers Submit iOS pushes), never the release tags: a
      # run that uploads the IPA and then fails at Submit Android writes no
      # release tag, and with the hourly schedule it would re-upload iOS for
      # ever while the tag count still read low.
      # A hold is not a failure: the run stays green and the next push or the
      # hourly run resumes the same unreleased change.
      - name: Gate on the App Store Connect upload limit
        id: cap
        if: steps.check.outputs.should_build == 'true'
        run: |
          CAP_OUT=$(node scripts/kilo-app-release-upload-cap.mjs --cap 10 --prefix kilo-app-upload/)
          printf '%s\n' "$CAP_OUT"
          ALLOWED=$(printf '%s\n' "$CAP_OUT" | sed -n 's/^allowed=//p')
          echo "allowed=$ALLOWED" >> "$GITHUB_OUTPUT"
          if [ "$ALLOWED" != "true" ]; then
            echo "::notice::App Store Connect upload limit reached — no artifact is built; the next push or the hourly run picks this release up."
          fi

  validate:
    needs: [check-changes]
    if: needs.check-changes.outputs.should_build == 'true' && needs.check-changes.outputs.allowed == 'true'
    uses: ./.github/workflows/kilo-app-ci.yml

  preflight:
    needs: [check-changes]
    if: needs.check-changes.outputs.should_build == 'true' && github.ref == 'refs/heads/main' && needs.check-changes.outputs.allowed == 'true'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN secret is required for the release preflight"
            exit 1
          fi
          echo "EXPO_TOKEN is present"

      - name: Verify EAS production environment
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if ! ENV_OUTPUT=$(pnpx eas-cli@21.8.0 env:list --environment production --format long 2>&1); then
            echo "$ENV_OUTPUT"
            echo "::error::eas env:list failed"
            exit 1
          fi
          MISSING=""
          for NAME in API_BASE_URL WEB_BASE_URL CLOUD_AGENT_WS_URL SESSION_INGEST_WS_URL APPSFLYER_DEV_KEY APPSFLYER_APP_ID KILO_CHAT_URL EVENT_SERVICE_URL NOTIFICATIONS_URL POSTHOG_API_KEY SENTRY_AUTH_TOKEN EXPO_PUBLIC_SENTRY_ENVIRONMENT; do
            if ! printf '%s\n' "$ENV_OUTPUT" | grep -qE "^Name[[:space:]]+${NAME}[[:space:]]*$"; then
              MISSING="$MISSING $NAME"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing EAS production environment variables:$MISSING"
            exit 1
          fi
          echo "All required EAS production environment variables are present"

      - name: Assert production config contract
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        # EAS_BUILD_PROFILE belongs inside the quoted command: eas-cli evaluates
        # app.config.ts itself to resolve the project, and the production profile
        # makes that evaluation throw on env the CLI never injects. SENTRY_AUTH_TOKEN
        # is a SECRET variable that only EAS builders can read, so the assertion run
        # gets a placeholder. The step above proves the real secret exists.
        run: pnpx eas-cli@21.8.0 env:exec production --non-interactive 'EAS_BUILD_PROFILE=production SENTRY_AUTH_TOKEN=preflight-placeholder pnpm assert:config'

  build-and-submit:
    needs: [check-changes, validate, preflight]
    if: needs.check-changes.outputs.should_build == 'true' && github.ref == 'refs/heads/main' && needs.check-changes.outputs.allowed == 'true'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 60
    outputs:
      ios_build: ${{ steps.identity.outputs.ios_build }}
      android_build: ${{ steps.identity.outputs.android_build }}
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build iOS and Android
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          mkdir -p artifacts
          pnpx eas-cli@21.8.0 build --profile production --platform all --non-interactive --json --wait > build.json
          node ../../scripts/inspect-mobile-artifacts.mjs --select build.json > urls.txt
          echo "IOS_URL=$(sed -n '1p' urls.txt)" >> "$GITHUB_ENV"
          echo "ANDROID_URL=$(sed -n '2p' urls.txt)" >> "$GITHUB_ENV"

      - name: Download artifacts
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          download() {
            url="$1"
            out="$2"
            label="$3"
            if curl -fL -H "Authorization: Bearer $EXPO_TOKEN" -o "$out" "$url"; then
              echo "$label: downloaded with Authorization header"
            elif curl -fL -o "$out" "$url"; then
              echo "$label: downloaded without Authorization header (pre-signed URL rejected the header)"
            else
              echo "::error::$label download failed"
              return 1
            fi
          }
          download "$IOS_URL" artifacts/app.ipa "iOS"
          download "$ANDROID_URL" artifacts/app.aab "Android"

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Inspect artifacts
        working-directory: apps/mobile
        run: node ../../scripts/inspect-mobile-artifacts.mjs artifacts/app.ipa artifacts/app.aab build.json

      # Read the identity the stores will receive from the built artifact. This
      # fails the run before the upload when the IPA does not carry the version
      # in app.config.ts, so a mismatched artifact never reaches the stores.
      - name: Read the store build identity
        id: identity
        working-directory: apps/mobile
        run: |
          IDENTITY=$(node ../../scripts/kilo-app-release-notes.mjs identity --config app.config.ts --ipa artifacts/app.ipa --build-json build.json)
          printf '%s\n' "$IDENTITY"
          printf '%s\n' "$IDENTITY" | sed -n 's/^\(ios_build\|android_build\)=/\1=/p' >> "$GITHUB_OUTPUT"

      - name: Submit iOS
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: pnpx eas-cli@21.8.0 submit --profile production --platform ios --non-interactive --path artifacts/app.ipa

      # An iOS submission is a real App Store Connect upload even when the
      # Android submit after it fails, so record it the moment it succeeds: the
      # upload cap counts this marker prefix, and the release tag below stays
      # release detection only. The marker is annotated, so its creatordate is
      # the upload moment — a release held and resumed hours later still counts
      # at the upload time, not the commit's. The run id and attempt keep the
      # name unique, so an hourly retry of the same commit pushes a second,
      # distinct marker instead of failing on a name that already exists.
      # An annotated tag needs a tagger identity; the runner has none.
      - name: Mark the iOS upload
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MARKER="kilo-app-upload/$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git tag -a "$MARKER" -m "$MARKER"
          git push origin "$MARKER"

      - name: Submit Android
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: pnpx eas-cli@21.8.0 submit --profile production --platform android --non-interactive --path artifacts/app.aab

      # Release detection only: the next run reads this to find the last release.
      # The upload cap never counts it (a partial run writes no release tag).
      - name: Tag release
        run: |
          TAG="kilo-app-release/$(date -u +%Y-%m-%d)-$(git rev-parse --short=7 HEAD)"
          git tag "$TAG"
          git push origin "$TAG"

  # A store release needs a version string that was not released before, so the
  # marketing version is patch-bumped for the next one. This runs beside
  # build-and-submit, not after it: the submission is never blocked on the bump.
  # The build number is not bumped here; EAS auto-increments it remotely.
  # The bump branch is pushed here, but its PR is opened by the changelog job,
  # only once the changelog section is on the branch. A PR opened during the
  # 60-minute build window can be merged (and its branch auto-deleted) before
  # the section lands, which loses the build's changelog line for ever.
  bump-version:
    needs: [check-changes]
    if: needs.check-changes.outputs.should_build == 'true' && github.ref == 'refs/heads/main' && needs.check-changes.outputs.allowed == 'true'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: write # push the bump branch
      pull-requests: read # look for an open bump PR to reuse its branch
    outputs:
      branch: ${{ steps.pending.outputs.branch || steps.bump.outputs.branch }}
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1

      # An open bump PR already carries the next version. A second one would
      # bump to the same number and conflict with it.
      - name: Look for an open bump PR
        id: pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCHES=$(gh pr list --state open --limit 100 --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("kilo-app-version-bump-"))] | .[].headRefName')
          OPEN=$(printf '%s\n' "$BRANCHES" | grep -c . || true)
          if [ "$OPEN" != "0" ]; then
            echo "A kilo-app version bump PR is already open — nothing to open."
          fi
          # A PR head ref is a name a stranger can choose. It is consumed by the
          # changelog job's shell, so accept only the exact name this pipeline
          # creates and fail loudly on anything else.
          BRANCH=$(printf '%s\n' "$BRANCHES" | head -n 1)
          if [ -n "$BRANCH" ] && ! printf '%s' "$BRANCH" | grep -qE '^kilo-app-version-bump-[0-9.]+$'; then
            echo "::error::Refusing a version-bump branch this pipeline did not create: $BRANCH"
            exit 1
          fi
          echo "open=$OPEN" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Bump patch version
        id: bump
        if: steps.pending.outputs.open == '0'
        working-directory: apps/mobile
        run: |
          OLD=$(sed -n "s/^  version: '\([0-9][0-9.]*\)',$/\1/p" app.config.ts)
          if [ -z "$OLD" ]; then
            echo "::error::Could not read the version line from apps/mobile/app.config.ts"
            exit 1
          fi
          NEW=$(echo "$OLD" | awk -F. '{print $1"."$2"."$3+1}')
          sed -i "s/^  version: '$OLD',$/  version: '$NEW',/" app.config.ts
          echo "Bumped $OLD -> $NEW"
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "branch=kilo-app-version-bump-$NEW" >> "$GITHUB_OUTPUT"

      - name: Push bump branch
        if: steps.pending.outputs.open == '0'
        run: |
          NEW="${{ steps.bump.outputs.new }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "kilo-app-version-bump-$NEW"
          git add apps/mobile/app.config.ts
          git commit -m "chore(kilo-app): bump version to $NEW"
          # Force: a re-run rewrites the same single line onto the same branch.
          git push -fu origin "kilo-app-version-bump-$NEW"

  # The changelog section rides the version-bump branch, not main. Main is
  # protected by the `main-reviews` ruleset (pull_request, 1 approval,
  # non_fast_forward, `bypass_actors: null`, ruleset 12440134) and the
  # `main-tests` ruleset (8 required status checks, 12440145), so a GITHUB_TOKEN
  # push to main is refused (`git log origin/main --author=github-actions` shows
  # every bot commit on main arrived through a PR). The version-bump PR is the
  # pipeline's own path to main, a human merges it exactly as today, and no human
  # writes or edits a changelog line. It needs build-and-submit so a section is
  # written only for a build that reached the stores.
  #
  # The section lands on the branch first and the PR is opened or refreshed
  # after, so the version line and the section are on the branch together before
  # any human can merge them. A land whose branch is already gone is not a
  # failed build: the section is carried to the pending branch and the next
  # build writes it above its own section.
  changelog:
    needs: [check-changes, bump-version, build-and-submit]
    if: needs.check-changes.outputs.should_build == 'true' && needs.check-changes.outputs.allowed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: write # push the section onto the version-bump branch
      pull-requests: write # open or refresh the version-bump PR
      issues: write # PR assignees are an Issues API operation; pull-requests: write alone does not cover --assignee
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1

      - name: Land the changelog section on the version-bump branch
        id: land
        env:
          NOTES: ${{ needs.check-changes.outputs.notes }}
          BRANCH: ${{ needs.bump-version.outputs.branch }}
          PENDING: kilo-app-changelog-pending
        run: |
          # The branch is a PR head ref, so a stranger can name it. It reaches
          # this shell as an environment value, never as an interpolated ${{ }},
          # and only the exact name this pipeline creates is accepted.
          if ! printf '%s' "$BRANCH" | grep -qE '^kilo-app-version-bump-[0-9.]+$'; then
            echo "::error::Refusing to land the changelog on an unexpected branch: $BRANCH"
            exit 1
          fi
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/kilo-app-notes.md"
          OUT=$(node scripts/kilo-app-release-notes.mjs write \
            --version "${{ needs.check-changes.outputs.version }}" \
            --ios-build "${{ needs.build-and-submit.outputs.ios_build }}" \
            --android-build "${{ needs.build-and-submit.outputs.android_build }}" \
            --body-file "$RUNNER_TEMP/kilo-app-notes.md" \
            --land "origin:$BRANCH" \
            --pending "$PENDING")
          printf '%s\n' "$OUT"
          if printf '%s\n' "$OUT" | grep -q '^changelog: landed '; then
            echo "landed=true" >> "$GITHUB_OUTPUT"
          else
            echo "landed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The version-bump branch was already merged — this build's changelog section waits on $PENDING for the next build's section. The submission itself succeeded."
          fi

      # Only a branch that now carries the section gets a PR: a human who merges
      # it takes the version line and the changelog line to main in one merge.
      - name: Open or refresh the version-bump PR
        if: steps.land.outputs.landed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ needs.bump-version.outputs.branch }}
          OLD: ${{ needs.check-changes.outputs.version }}
        run: |
          NEW="${BRANCH#kilo-app-version-bump-}"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat > "$RUNNER_TEMP/kilo-app-bump-pr.md" <<EOF
          ## What

          Bumps apps/mobile (kilo-app) version $OLD -> $NEW, and carries this
          build's changelog section.

          ## Why

          The kilo-app Release workflow submitted version $OLD to the App Store and
          to Google Play (run: $RUN_URL). A store release needs a version string
          that was not released before, so main moves to the next one, and the
          build's changelog section reaches main in the same merge.

          ## What to do

          1. Required checks show as pending: PRs opened with the default GITHUB_TOKEN
             do not trigger workflow runs. Close and reopen this PR (or push an empty
             commit) to start CI.
          2. Review and merge. Only the version line and the changelog section
             changed; no product code.
          EOF
          PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --body-file "$RUNNER_TEMP/kilo-app-bump-pr.md"
            echo "Refreshed the version-bump PR #$PR for $BRANCH"
          else
            gh pr create --base main \
              --title "chore(kilo-app): bump version to $NEW" \
              --body-file "$RUNNER_TEMP/kilo-app-bump-pr.md" \
              --assignee iscekic \
              --reviewer iscekic
          fi
