name: Kilo MCP catalog

# Keeps services/kilo-mcp/catalog.json and the generated
# .kilo/skills/kilo-mcp/SKILL.md in lockstep with the tRPC router graph.
#
# - PR job: applies the trusted summary artifact onto the committed catalog
#   (dump --summaries-file), then regenerates the kilo-mcp skill from that
#   catalog. Same-repo PRs get both artifacts
#   committed back to the PR branch (requirement 5); fork PRs cannot be pushed
#   to, so the diff ships as a `catalog.patch` artifact, a one-line PR comment
#   points at it, and the job fails (requirement 6). A fork PR also gets no
#   catalog credential (GitHub withholds secrets from fork events), so when the
#   dump itself cannot run, a dedicated step posts the credential-free recovery
#   — hand-written summaries in catalog.json, which the keep-edit rule preserves
#   — and fails the job, so requirement 6 holds on that path too. The PR job
#   never touches Vectorize or the embed script (requirement 10) and never
#   generates summaries at runtime — only the trusted summaries job does, and it
#   preserves author-edited summaries (requirement 2, s1 keep-edit rule).
#   `catalog (PR)` is a REQUIRED check on main, so this workflow runs on every
#   PR (no pull_request path filter). The job is always reported; the
#   change-detection step gates the heavy work on the catalog's source paths so
#   an unrelated PR still gets a fast, green check instead of "Expected".
#   The summary generation itself runs in two upstream jobs: catalog-prepare
#   enumerates the pull request's router graph and writes the prompt artifact,
#   and catalog-summaries runs the pinned completion per prompt batch with the
#   short-lived token in the completing step's own env.
# - Merge job: gated to main pushes only, so PRs structurally cannot reach it
#   (requirement 10). The workflow triggers on every main push — the merge job
#   is required on main and must always report — and its own change-detection
#   step diff against `github.event.before` gates the dump, the skill
#   regeneration, and the Vectorize upsert, so an unrelated main push still
#   gets a fast, green check. Re-runs the dump to fill any summaries that
#   slipped through (requirement 8), regenerates the skill from it, and fails
#   when either catalog.json or SKILL.md is stale (requirement 22) before
#   upserting the Vectorize index (requirement 9). Production deploys from
#   main, so the committed bundled catalog and the upserted index stay in
#   lockstep.
#
# The dump's `kilo run` never uses a maintainer's personal credential: both jobs
# mint a short-lived benchmarking-service-account token from apps/web
# (POST /api/internal/mcp-catalog/token) using MCP_CATALOG_TOKEN_SECRET, a
# shared secret whose only purpose is that mint.
#
# The CI wiring of this file is asserted by scripts/kilo-mcp-catalog.test.mjs
# (same pattern as scripts/stacked-ci.test.mjs in .github/workflows/ci.yml).

on:
  # No paths filter: `catalog (PR)` is a required status check, and a
  # path-filtered workflow leaves that check "Expected" (blocking) on every PR
  # it skips. The jobs gate their own work instead. Same for push: the merge
  # job is required on main, so every main push triggers the workflow and the
  # job gates its own work against the pushed diff.
  pull_request:
  merge_group:
  push:
    branches: [main]

# New commits to the same PR supersede in-progress runs; a main push must not
# be cancelled mid-Vectorize-upsert.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  catalog-prepare:
    name: catalog prepare (PR)
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      # Whether the pull request touches catalog-relevant paths; gates the
      # downstream jobs and the required check's own steps.
      catalog: ${{ steps.catalog_changes.outputs.catalog }}
    steps:
      # Full history so the change-detection step below can diff against the
      # PR's base sha.
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          fetch-depth: 0

      # The job always reports; only the catalog's own paths justify the
      # expensive enumeration. Keep the patterns in sync with the merge job's
      # detection step and with scripts/kilo-mcp-catalog.test.mjs.
      - name: Detect catalog-relevant changes
        id: catalog_changes
        run: |
          set -euo pipefail
          # If the base object is unavailable, run the catalog work rather than
          # skip it: a false "no changes" would break the required check's
          # promise, while a redundant enumeration is harmless.
          base="${{ github.event.pull_request.base.sha }}"
          if ! git rev-parse --verify "${base}^{commit}" > /dev/null 2>&1; then
            echo "catalog=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" HEAD \
            | grep -Eq '^apps/web/src/|^packages/web-shared/src/|^services/kilo-mcp/|^\.kilo/skills/|^\.github/workflows/kilo-mcp-catalog\.yml$|^scripts/kilo-mcp-catalog\.test\.mjs$'; then
            echo "catalog=true" >> "$GITHUB_OUTPUT"
          else
            echo "catalog=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.catalog_changes.outputs.catalog == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        if: steps.catalog_changes.outputs.catalog == 'true'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install root dependencies
        if: steps.catalog_changes.outputs.catalog == 'true'
        run: pnpm --filter kilocode-monorepo install --frozen-lockfile --ignore-scripts

      - name: Check catalog workflow wiring
        if: steps.catalog_changes.outputs.catalog == 'true'
        run: node --test scripts/kilo-mcp-catalog.test.mjs

      - name: Install web dependencies
        if: steps.catalog_changes.outputs.catalog == 'true'
        run: pnpm install --frozen-lockfile --filter web...

      # Same dummies the jest suite already tolerates (ci.yml does the same for
      # the production build). The prompt script layers apps/web/.env.test
      # itself, and dotenv never overrides exported values.
      - name: Setup dummy env
        if: steps.catalog_changes.outputs.catalog == 'true'
        working-directory: apps/web
        run: cp .env.test .env

      # Enumerate this checkout's router graph and write the prompt batches
      # the trusted job will complete: prompt text and the pinned model and
      # variant per batch.
      - name: Write summary prompt artifact
        if: steps.catalog_changes.outputs.catalog == 'true'
        run: |
          mkdir -p /tmp/catalog-prompts
          pnpm --filter web script src/scripts/mcp-catalog/prompts.ts -- /tmp/catalog-prompts/summary-prompts.json

      - name: Upload summary prompt artifact
        if: steps.catalog_changes.outputs.catalog == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: catalog-summary-prompts
          path: /tmp/catalog-prompts/summary-prompts.json

  # Trusted job: only the inlined runner below and the downloaded artifact
  # touch this job.
  catalog-summaries:
    name: catalog summaries (trusted)
    if: >-
      ${{ needs.catalog-prepare.result == 'success' &&
      needs.catalog-prepare.outputs.catalog == 'true' }}
    needs: catalog-prepare
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Download summary prompt artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: catalog-summary-prompts
          path: /tmp/catalog-prompts

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      # The completion shells out to `kilo run` to generate the summaries.
      - name: Install Kilo CLI
        run: npm install -g @kilocode/cli

      # Mint a short-lived token for the benchmarking service account so the
      # completion never uses a maintainer's personal credential.
      - name: Mint catalog token
        id: mint
        continue-on-error: true
        env:
          MCP_CATALOG_TOKEN_SECRET: ${{ secrets.MCP_CATALOG_TOKEN_SECRET }}
          WEB_API_BASE_URL: https://app.kilo.ai
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/catalog-mint.json -w '%{http_code}' \
            -X POST "$WEB_API_BASE_URL/api/internal/mcp-catalog/token" \
            -H "Authorization: Bearer $MCP_CATALOG_TOKEN_SECRET" \
            -H 'content-type: application/json' \
            -d '{}')"
          if [ "$status" != "200" ]; then
            echo "::error::The catalog token mint returned HTTP $status: $(cat /tmp/catalog-mint.json)"
            exit 1
          fi
          response="$(cat /tmp/catalog-mint.json)"
          token="$(printf '%s' "$response" | jq -r '.token')"
          org="$(printf '%s' "$response" | jq -r '.organizationId')"
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "::error::The catalog token mint returned no token"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "organization=$org" >> "$GITHUB_OUTPUT"

      # Dependency-free completion runner: one `kilo run` per prompt batch,
      # pinned model/variant taken from the artifact (apps/web catalog
      # constants). Mirrors runKiloCompletion + parseSummaries from
      # apps/web/src/scripts/mcp-catalog/catalog.ts: prompt on stdin, NDJSON
      # event stream reduced to completed text, every requested path must
      # come back with a usable summary. Inlined here rather than committed
      # as a script because a checkout of the base branch would not carry
      # this workflow's own runner script on this pull request's first run.
      - name: Write completion runner
        run: |
          mkdir -p /tmp/catalog-summaries
          cat > /tmp/catalog-complete.cjs <<'RUNNER'
          'use strict';
          const { spawnSync } = require('node:child_process');
          const { readFileSync, writeFileSync } = require('node:fs');

          const [promptsPath, outputPath] = process.argv.slice(2);
          if (!promptsPath || !outputPath) {
            console.error('usage: catalog-complete.cjs <prompts.json> <output.json>');
            process.exit(1);
          }
          const artifact = JSON.parse(readFileSync(promptsPath, 'utf8'));
          const batches = artifact.batches ?? [];
          const missingCount = artifact.missingCount ?? 0;
          if (missingCount > 0 && batches.length === 0) {
            console.error(
              'Prompt artifact declares ' + missingCount + ' missing summaries but carries no batches'
            );
            process.exit(1);
          }

          // Reduce the `kilo run --format json` NDJSON stream to the
          // concatenated completed assistant text parts (mirrors
          // parseKiloCompletion in apps/web/src/scripts/mcp-catalog/catalog.ts).
          const parseCompletion = lines => {
            const texts = [];
            for (const line of lines) {
              let event;
              try {
                event = JSON.parse(line);
              } catch {
                continue;
              }
              if (event === null || typeof event !== 'object') continue;
              if (event.type !== 'text') continue;
              const end = (event.part && event.part.time && event.part.time.end) ?? (event.time && event.time.end);
              if (end === undefined || end === null) continue;
              const text =
                event.part && typeof event.part.text === 'string'
                  ? event.part.text
                  : typeof event.text === 'string'
                    ? event.text
                    : undefined;
              if (typeof text === 'string') texts.push(text);
            }
            return texts.join('\n');
          };

          const summaries = {};
          let failed = false;
          for (const batch of batches) {
            console.log(`  batch: ${batch.label}`);
            const result = spawnSync(
              process.env.KILO_BIN ?? 'kilo',
              [
                'run',
                '--model',
                artifact.model,
                '--variant',
                artifact.variant,
                '--format',
                'json',
              ],
              {
                input: batch.prompt,
                encoding: 'utf8',
                cwd: require('node:os').tmpdir(),
                timeout: 10 * 60 * 1000,
                maxBuffer: 16 * 1024 * 1024,
              }
            );
            const stderr = (result.stderr ?? '').trim();
            const detail = stderr.slice(-300);
            if (result.error) {
              console.error(`Kilo CLI failed for ${batch.label}: ${result.error.message}`);
              failed = true;
              break;
            }
            if (result.status !== 0) {
              console.error(
                `Kilo CLI exited with ${result.status ?? 'no status'} for ${batch.label}${detail ? ` — ${detail}` : ''}`
              );
              failed = true;
              break;
            }
            const content = parseCompletion((result.stdout ?? '').split('\n'));
            if (content.trim() === '') {
              console.error(
                `Kilo CLI returned no summary completion for ${batch.label}${detail ? ` — ${detail}` : ''}`
              );
              failed = true;
              break;
            }
            // Mirror parseSummaries from catalog.ts: strip markdown fences
            // and slice between the first { and last } before parsing.
            const unfenced = content
              .trim()
              .replace(/^```(?:json)?\s*/i, '')
              .replace(/```\s*$/i, '')
              .trim();
            const braceStart = unfenced.indexOf('{');
            const braceEnd = unfenced.lastIndexOf('}');
            const candidate =
              braceStart !== -1 && braceEnd > braceStart
                ? unfenced.slice(braceStart, braceEnd + 1)
                : unfenced;
            let parsed;
            try {
              parsed = JSON.parse(candidate);
            } catch {
              parsed = undefined;
            }
            // Keep only the paths the batch requested, mirroring
            // parseSummaries: anything else the model added is ignored.
            const requested = batch.prompt
              .split('\n')
              .filter(line => line.startsWith('- '))
              .map(line => line.slice(2).trim());
            if (
              parsed === undefined ||
              parsed === null ||
              typeof parsed !== 'object' ||
              Array.isArray(parsed)
            ) {
              console.error(`LLM response for ${batch.label} is not a JSON object`);
              failed = true;
              break;
            }
            for (const [path, summary] of Object.entries(parsed)) {
              if (requested.includes(path) && typeof summary === 'string' && summary.trim() !== '')
                summaries[path] = summary;
            }
          }

          if (failed) {
            // Leave no partial output: the required check must fail on the
            // uncovered paths, not apply a half-generated set.
            try {
              require('node:fs').unlinkSync(outputPath);
            } catch {}
            process.exit(1);
          }
          writeFileSync(outputPath, JSON.stringify(summaries, null, 2));
          console.log(`✅ completed ${Object.keys(summaries).length} summaries`);
          RUNNER

      - name: Complete summary batches
        id: complete
        continue-on-error: ${{ github.event.pull_request.head.repo.fork == true }}
        env:
          KILO_API_KEY: ${{ steps.mint.outputs.token }}
          KILO_ORG_ID: ${{ steps.mint.outputs.organization }}
        run: node /tmp/catalog-complete.cjs /tmp/catalog-prompts/summary-prompts.json /tmp/catalog-summaries/summary-summaries.json

      # Mint failure, a fork completion failure, or an empty prompt artifact
      # all land here: the summaries file exists either way, so the required
      # check's apply step can fail on uncovered paths (or succeed when
      # nothing was missing) instead of choking on a missing artifact.
      # `outcome` (not `conclusion`) so a fork completion failure — tolerated
      # by continue-on-error — still lands in the fallback.
      - name: Write empty summaries fallback
        if: steps.complete.outcome != 'success'
        run: printf '{}\n' > /tmp/catalog-summaries/summary-summaries.json

      - name: Upload summaries artifact
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: catalog-summaries
          path: /tmp/catalog-summaries/summary-summaries.json

  catalog-pr:
    name: catalog (PR)
    if: ${{ github.event_name == 'pull_request' && !cancelled() }}
    needs: [catalog-prepare, catalog-summaries]
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    # contents: write lets the bot commit the refreshed catalog back to a
    # same-repo PR branch; pull-requests: write lets it comment on fork PRs.
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Full history so the change-detection outputs above match what this
      # checkout would compute, and so drift detection can diff the committed
      # artifacts.
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          fetch-depth: 0

      # The required check must never report green after a trusted-pipeline
      # failure: a failed prepare is infrastructure, a failed summaries job is
      # a completion error on a same-repo PR.
      - name: Fail when an upstream catalog job failed
        if: >-
          needs.catalog-prepare.result != 'success' ||
          needs.catalog-summaries.result == 'failure'
        run: |
          echo "::error::The catalog pipeline failed upstream (prepare: ${{ needs.catalog-prepare.result }}, summaries: ${{ needs.catalog-summaries.result }}). Same-repo summary completion failures are fatal; hand-write a summary for each new path in services/kilo-mcp/catalog.json — the dump keeps committed summaries — or retry the run."
          exit 1

      - name: Setup pnpm
        if: needs.catalog-prepare.outputs.catalog == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        if: needs.catalog-prepare.outputs.catalog == 'true'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install root dependencies
        if: needs.catalog-prepare.outputs.catalog == 'true'
        run: pnpm --filter kilocode-monorepo install --frozen-lockfile --ignore-scripts

      - name: Install web dependencies
        if: needs.catalog-prepare.outputs.catalog == 'true'
        run: pnpm install --frozen-lockfile --filter web...

      # Same dummies the jest suite already tolerates (ci.yml does the same
      # for the production build). The dump layers apps/web/.env.test itself.
      - name: Setup dummy env
        if: needs.catalog-prepare.outputs.catalog == 'true'
        working-directory: apps/web
        run: cp .env.test .env

      - name: Download summaries artifact
        if: needs.catalog-prepare.outputs.catalog == 'true'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: catalog-summaries
          path: /tmp/catalog-summaries

      # Apply the trusted job's summaries onto the committed catalog.
      # Fork PRs never receive MCP_CATALOG_TOKEN_SECRET
      # (GitHub withholds secrets from fork pull_request events), so a fork
      # PR that adds a query without committed summaries always fails
      # coverage here. Tolerate that on forks so the guidance step below can
      # still honour requirement 6; a same-repo apply failure stays fatal.
      - name: Apply trusted summaries to catalog.json
        id: dump
        if: needs.catalog-prepare.outputs.catalog == 'true'
        continue-on-error: ${{ github.event.pull_request.head.repo.fork == true }}
        run: pnpm --filter web script src/scripts/mcp-catalog/dump.ts -- --summaries-file /tmp/catalog-summaries/summary-summaries.json

      # Generate the kilo-mcp skill from the catalog.json the dump just
      # wrote, so the skill can never fall behind the catalog. It needs no
      # credentials: it reads the committed (and now refreshed) catalog only.
      - name: Regenerate kilo-mcp skill
        if: needs.catalog-prepare.outputs.catalog == 'true'
        run: pnpm --filter web script src/scripts/mcp-catalog/skill.ts

      # Requirement 6 when the summaries cannot apply: the drift-gated fork
      # steps below never see a diff (the dump exits without writing), so
      # this step posts the recovery that works without CI credentials — the
      # keep-edit rule preserves hand-written summaries in the committed
      # catalog — and fails the job. Must run before drift detection.
      - name: Guide fork PR past an un-runnable catalog dump
        if: >-
          needs.catalog-prepare.outputs.catalog == 'true' &&
          steps.dump.outcome == 'failure' &&
          github.event.pull_request.head.repo.fork == true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_BODY: >-
            The MCP catalog dump failed on this fork PR. Fork PRs never get
            CI's catalog credentials (GitHub withholds secrets from fork
            events), so summaries for new query paths cannot be generated here.
            To recover, hand-write a summary for each new path in
            `services/kilo-mcp/catalog.json` (committed summaries are kept by
            the dump), or run
            `pnpm --filter web script src/scripts/mcp-catalog/dump.ts`
            locally with your own signed-in Kilo CLI (`kilo auth login`) and
            push. If the log shows a different error than missing credentials,
            fix that and push.
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$COMMENT_BODY" || true
          echo "::error::The MCP catalog dump failed on this fork PR (fork PRs get no catalog credentials). Hand-write a summary for each new path in services/kilo-mcp/catalog.json — the dump keeps committed summaries — or run the dump locally with a signed-in Kilo CLI and push."
          exit 1

      # Drift covers both generated artifacts: a hand-edited skill marks the
      # PR stale exactly like a stale catalog.
      - name: Detect catalog and skill drift
        id: drift
        if: needs.catalog-prepare.outputs.catalog == 'true'
        run: |
          if git diff --exit-code -- services/kilo-mcp/catalog.json .kilo/skills/kilo-mcp/SKILL.md > /dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Same-repo PR: commit the catalog and the generated skill to the PR
      # branch under the actions-bot identity (requirement 5). The dump's
      # keep-edit rule means an author-edited summary in the committed file
      # survives the regen, so this push never reverts a human edit.
      - name: Commit catalog and skill to PR branch
        if: >-
          needs.catalog-prepare.outputs.catalog == 'true' &&
          steps.drift.outputs.changed == 'true' &&
          github.event.pull_request.head.repo.fork == false
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          cp services/kilo-mcp/catalog.json /tmp/catalog.json
          cp .kilo/skills/kilo-mcp/SKILL.md /tmp/kilo-mcp-SKILL.md
          # apps/web/.env is tracked and the dummy-env copy dirties it; reset
          # the worktree so the branch switch below cannot be refused.
          git checkout -- services/kilo-mcp/catalog.json .kilo/skills/kilo-mcp/SKILL.md apps/web/.env
          git fetch --no-tags origin "refs/heads/$HEAD_BRANCH"
          git checkout -B "$HEAD_BRANCH" FETCH_HEAD
          cp /tmp/catalog.json services/kilo-mcp/catalog.json
          cp /tmp/kilo-mcp-SKILL.md .kilo/skills/kilo-mcp/SKILL.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/kilo-mcp/catalog.json .kilo/skills/kilo-mcp/SKILL.md
          git diff --cached --quiet || git commit -m "chore(kilo-mcp): refresh catalog.json and SKILL.md from CI"
          git push origin "HEAD:$HEAD_BRANCH"

      # Fork PR: GITHUB_TOKEN cannot push to the fork, so hand the author the
      # patch and fail loudly instead of silently leaving the artifacts stale
      # (requirement 6).
      - name: Export catalog and skill patch (fork PRs)
        if: >-
          needs.catalog-prepare.outputs.catalog == 'true' &&
          steps.drift.outputs.changed == 'true' &&
          github.event.pull_request.head.repo.fork == true
        run: git diff -- services/kilo-mcp/catalog.json .kilo/skills/kilo-mcp/SKILL.md > catalog.patch

      - name: Upload catalog patch artifact
        if: >-
          needs.catalog-prepare.outputs.catalog == 'true' &&
          steps.drift.outputs.changed == 'true' &&
          github.event.pull_request.head.repo.fork == true
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: catalog.patch
          path: catalog.patch

      # Best-effort: GitHub forces GITHUB_TOKEN read-only on fork PR events,
      # so this 403s unless a write-capable token is configured. continue-on-error
      # keeps the job failing with the deliberate ::error annotation below rather
      # than with a raw comment-permission failure.
      - name: Comment on fork PR
        if: >-
          needs.catalog-prepare.outputs.catalog == 'true' &&
          steps.drift.outputs.changed == 'true' &&
          github.event.pull_request.head.repo.fork == true
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_BODY: >-
            The MCP catalog or the kilo-mcp skill is stale and this PR comes
            from a fork, so CI cannot commit
            `services/kilo-mcp/catalog.json` or
            `.kilo/skills/kilo-mcp/SKILL.md`: download the `catalog.patch`
            artifact of
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            and apply it, or run
            `pnpm --filter web script src/scripts/mcp-catalog/dump.ts` and
            `pnpm --filter web script src/scripts/mcp-catalog/skill.ts` locally
            and push.
        run: gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$COMMENT_BODY"

      - name: Fail fork PR with a stale catalog or skill
        if: >-
          needs.catalog-prepare.outputs.catalog == 'true' &&
          steps.drift.outputs.changed == 'true' &&
          github.event.pull_request.head.repo.fork == true
        run: |
          echo "::error::services/kilo-mcp/catalog.json or .kilo/skills/kilo-mcp/SKILL.md is stale and cannot be committed from a fork PR. Apply the catalog.patch artifact attached to this run, or run the dump and the skill generator locally and push."
          exit 1

  catalog-merge:
    name: catalog + Vectorize (main)
    # Main pushes only — a pull_request run can never reach this job, so no PR
    # writes to Vectorize (requirement 10).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Full history so the change-detection step can diff the pushed commit
      # against `github.event.before`.
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          fetch-depth: 0

      # The job always reports (required on main); only the catalog's own paths
      # justify the expensive dump and the Vectorize upsert. Keep the patterns
      # in sync with scripts/kilo-mcp-catalog.test.mjs.
      - name: Detect catalog-relevant changes
        id: merge_changes
        run: |
          set -euo pipefail
          # If the pushed commit's parent is unavailable (first push, forced
          # push, unknown `before`), run the catalog work rather than skip it: a
          # false "no changes" would break the required check's promise, while a
          # redundant dump is harmless.
          before="${{ github.event.before }}"
          if ! git rev-parse --verify "${before}^{commit}" > /dev/null 2>&1; then
            echo "catalog=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$before" HEAD \
            | grep -Eq '^apps/web/src/|^packages/web-shared/src/|^services/kilo-mcp/|^\.kilo/skills/|^\.github/workflows/kilo-mcp-catalog\.yml$|^scripts/kilo-mcp-catalog\.test\.mjs$'; then
            echo "catalog=true" >> "$GITHUB_OUTPUT"
          else
            echo "catalog=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.merge_changes.outputs.catalog == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        if: steps.merge_changes.outputs.catalog == 'true'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      # The completion shells out to `kilo run` to fill any straggler summaries.
      - name: Install Kilo CLI
        if: steps.merge_changes.outputs.catalog == 'true'
        run: npm install -g @kilocode/cli

      - name: Install web dependencies
        if: steps.merge_changes.outputs.catalog == 'true'
        run: pnpm install --frozen-lockfile --filter web...

      - name: Setup dummy env
        if: steps.merge_changes.outputs.catalog == 'true'
        working-directory: apps/web
        run: cp .env.test .env

      - name: Mint catalog token
        if: steps.merge_changes.outputs.catalog == 'true'
        id: mint
        continue-on-error: true
        env:
          MCP_CATALOG_TOKEN_SECRET: ${{ secrets.MCP_CATALOG_TOKEN_SECRET }}
          WEB_API_BASE_URL: https://app.kilo.ai
        run: |
          set -euo pipefail
          # `curl -f` discards the response body on an HTTP error, which turned
          # a diagnosable 404 into a bare "curl: (22)". Capture the status and
          # surface the body so the next failure names its cause.
          status="$(curl -sS -o /tmp/catalog-mint.json -w '%{http_code}' \
            -X POST "$WEB_API_BASE_URL/api/internal/mcp-catalog/token" \
            -H "Authorization: Bearer $MCP_CATALOG_TOKEN_SECRET" \
            -H 'content-type: application/json' \
            -d '{}')"
          if [ "$status" != "200" ]; then
            echo "::error::The catalog token mint returned HTTP $status: $(cat /tmp/catalog-mint.json)"
            exit 1
          fi
          response="$(cat /tmp/catalog-mint.json)"
          token="$(printf '%s' "$response" | jq -r '.token')"
          org="$(printf '%s' "$response" | jq -r '.organizationId')"
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "::error::The catalog token mint returned no token"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "organization=$org" >> "$GITHUB_OUTPUT"

      # Enumerate the trusted main checkout and write the prompt batches.
      - name: Write summary prompts
        if: steps.merge_changes.outputs.catalog == 'true'
        run: |
          mkdir -p /tmp/catalog-prompts /tmp/catalog-summaries
          pnpm --filter web script src/scripts/mcp-catalog/prompts.ts -- /tmp/catalog-prompts/summary-prompts.json

      # The same dependency-free completion runner as the trusted summaries
      # job, inlined for review.
      - name: Write completion runner
        if: steps.merge_changes.outputs.catalog == 'true'
        run: |
          mkdir -p /tmp/catalog-summaries
          cat > /tmp/catalog-complete.cjs <<'RUNNER'
          'use strict';
          const { spawnSync } = require('node:child_process');
          const { readFileSync, writeFileSync, unlinkSync } = require('node:fs');

          const [promptsPath, outputPath] = process.argv.slice(2);
          if (!promptsPath || !outputPath) {
            console.error('usage: catalog-complete.cjs <prompts.json> <output.json>');
            process.exit(1);
          }
          const artifact = JSON.parse(readFileSync(promptsPath, 'utf8'));
          const batches = artifact.batches ?? [];
          const missingCount = artifact.missingCount ?? 0;
          if (missingCount > 0 && batches.length === 0) {
            console.error(
              'Prompt artifact declares ' + missingCount + ' missing summaries but carries no batches'
            );
            process.exit(1);
          }

          // Reduce the `kilo run --format json` NDJSON stream to the
          // concatenated completed assistant text parts (mirrors
          // parseKiloCompletion in apps/web/src/scripts/mcp-catalog/catalog.ts).
          const parseCompletion = lines => {
            const texts = [];
            for (const line of lines) {
              let event;
              try {
                event = JSON.parse(line);
              } catch {
                continue;
              }
              if (event === null || typeof event !== 'object') continue;
              if (event.type !== 'text') continue;
              const end = (event.part && event.part.time && event.part.time.end) ?? (event.time && event.time.end);
              if (end === undefined || end === null) continue;
              const text =
                event.part && typeof event.part.text === 'string'
                  ? event.part.text
                  : typeof event.text === 'string'
                    ? event.text
                    : undefined;
              if (typeof text === 'string') texts.push(text);
            }
            return texts.join('\n');
          };

          const summaries = {};
          let failed = false;
          for (const batch of batches) {
            console.log(`  batch: ${batch.label}`);
            const result = spawnSync(
              process.env.KILO_BIN ?? 'kilo',
              [
                'run',
                '--model',
                artifact.model,
                '--variant',
                artifact.variant,
                '--format',
                'json',
              ],
              {
                input: batch.prompt,
                encoding: 'utf8',
                cwd: require('node:os').tmpdir(),
                timeout: 10 * 60 * 1000,
                maxBuffer: 16 * 1024 * 1024,
              }
            );
            const stderr = (result.stderr ?? '').trim();
            const detail = stderr.slice(-300);
            if (result.error) {
              console.error(`Kilo CLI failed for ${batch.label}: ${result.error.message}`);
              failed = true;
              break;
            }
            if (result.status !== 0) {
              console.error(
                `Kilo CLI exited with ${result.status ?? 'no status'} for ${batch.label}${detail ? ` — ${detail}` : ''}`
              );
              failed = true;
              break;
            }
            const content = parseCompletion((result.stdout ?? '').split('\n'));
            if (content.trim() === '') {
              console.error(
                `Kilo CLI returned no summary completion for ${batch.label}${detail ? ` — ${detail}` : ''}`
              );
              failed = true;
              break;
            }
            // Mirror parseSummaries from catalog.ts: strip markdown fences
            // and slice between the first { and last } before parsing.
            const unfenced = content
              .trim()
              .replace(/^```(?:json)?\s*/i, '')
              .replace(/```\s*$/i, '')
              .trim();
            const braceStart = unfenced.indexOf('{');
            const braceEnd = unfenced.lastIndexOf('}');
            const candidate =
              braceStart !== -1 && braceEnd > braceStart
                ? unfenced.slice(braceStart, braceEnd + 1)
                : unfenced;
            let parsed;
            try {
              parsed = JSON.parse(candidate);
            } catch {
              parsed = undefined;
            }
            // Keep only the paths the batch requested, mirroring
            // parseSummaries: anything else the model added is ignored.
            const requested = batch.prompt
              .split('\n')
              .filter(line => line.startsWith('- '))
              .map(line => line.slice(2).trim());
            if (
              parsed === undefined ||
              parsed === null ||
              typeof parsed !== 'object' ||
              Array.isArray(parsed)
            ) {
              console.error(`LLM response for ${batch.label} is not a JSON object`);
              failed = true;
              break;
            }
            for (const [path, summary] of Object.entries(parsed)) {
              if (requested.includes(path) && typeof summary === 'string' && summary.trim() !== '')
                summaries[path] = summary;
            }
          }

          if (failed) {
            // Leave no partial output: the apply step must fail on the
            // uncovered paths, not write a half-generated catalog.
            try {
              unlinkSync(outputPath);
            } catch {}
            process.exit(1);
          }
          writeFileSync(outputPath, JSON.stringify(summaries, null, 2));
          console.log(`✅ completed ${Object.keys(summaries).length} summaries`);
          RUNNER

      - name: Complete summary batches
        id: complete
        if: steps.merge_changes.outputs.catalog == 'true'
        continue-on-error: true
        env:
          KILO_API_KEY: ${{ steps.mint.outputs.token }}
          KILO_ORG_ID: ${{ steps.mint.outputs.organization }}
        run: node /tmp/catalog-complete.cjs /tmp/catalog-prompts/summary-prompts.json /tmp/catalog-summaries/summary-summaries.json

      - name: Write empty summaries fallback
        if: steps.merge_changes.outputs.catalog == 'true' && steps.complete.outcome != 'success'
        run: printf '{}\n' > /tmp/catalog-summaries/summary-summaries.json

      # Apply the generated summaries; every missing path must be covered or
      # the apply fails loudly instead of writing an incomplete catalog
      # (requirement 8).
      - name: Apply generated summaries to catalog.json
        if: steps.merge_changes.outputs.catalog == 'true'
        run: pnpm --filter web script src/scripts/mcp-catalog/dump.ts -- --summaries-file /tmp/catalog-summaries/summary-summaries.json

      # Regenerate the skill from the catalog the apply just wrote, so the
      # committed skill cannot drift from its source on main either.
      - name: Regenerate kilo-mcp skill
        if: steps.merge_changes.outputs.catalog == 'true'
        run: pnpm --filter web script src/scripts/mcp-catalog/skill.ts

      # The bundled catalog a production deploy serves must match the index this
      # run upserts. If the apply or the skill generator changes the checked-in
      # files, main was stale (the PR job never landed the refresh): fail
      # instead of indexing content the Worker bundle does not carry
      # (requirement 22).
      - name: Fail if the regenerated catalog or skill is not the committed one
        if: steps.merge_changes.outputs.catalog == 'true'
        run: |
          if ! git diff --exit-code -- services/kilo-mcp/catalog.json .kilo/skills/kilo-mcp/SKILL.md > /dev/null; then
            echo "::error::The dump or the skill generator changed services/kilo-mcp/catalog.json or .kilo/skills/kilo-mcp/SKILL.md on main. Commit the regenerated artifacts before the Vectorize upsert; otherwise the deployed Worker bundle and the index diverge."
            exit 1
          fi

      # Vectorize upsert (requirement 9). The index name and account id match
      # the production bindings in services/kilo-mcp/wrangler.jsonc; the
      # account id is not a secret (it is committed there).
      - name: Upsert Vectorize index
        if: steps.merge_changes.outputs.catalog == 'true'
        run: node services/kilo-mcp/scripts/embed-catalog.ts upsert
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e115e769bcdd4c3d66af59d3332cb394
          VECTORIZE_INDEX_NAME: kilo-mcp-catalog
