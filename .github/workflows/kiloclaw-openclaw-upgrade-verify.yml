# OpenClaw upgrade — automated keyless verification.
#
# Runs the upgrade checks that need NO Kilo API key, so it is safe to run
# automatically on a public repo: it builds the candidate production-pin image
# (proving the Dockerfile bundle-patch guards still match), checks the version,
# applied patches, bundled plugins, and runs `openclaw config validate` on
# representative app-written config shapes (the validator runs without starting
# the gateway). No credential is ever loaded into the freshly released,
# untrusted OpenClaw, so there is nothing to exfiltrate — which is exactly why
# the credentialed live smoke is NOT run here.
#
# The live smoke (controller-openclaw-upgrade-smoke-test.sh) loads a real key
# into the container and hits the live gateway; it stays a DEVELOPER step. This
# job posts a PR comment recording what it verified and what the developer must
# still run with credentials.
#
# TRIGGERING: bump PRs are opened by the kilo-code-bot GitHub App, whose
# installation-token events start workflows (unlike the default GITHUB_TOKEN), so
# `pull_request` should fire — verify on the first real bump. If it does not, wire
# a `repository_dispatch` from the bump flow. `workflow_dispatch` is a manual
# fallback that also posts the PR comment.
#
# BEFORE ENABLING: confirm RUNNER_DEFAULT_LABEL points at a runner with Docker +
# buildx. No secrets are required.

name: KiloClaw OpenClaw upgrade verify

on:
  pull_request:
    branches: [main]
    paths:
      - services/kiloclaw/Dockerfile
      - services/kiloclaw/plugins/**
      - services/kiloclaw/scripts/**
  workflow_dispatch: {}

permissions:
  contents: read
  # Upsert a single verification comment onto the bump PR so all automation
  # output (bot analysis + this result) lives in one place.
  pull-requests: write

concurrency:
  group: openclaw-upgrade-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade-verify:
    # Bump PRs only, and only from THIS repo — never a fork. No secret is used, so
    # this is about not spending runner time building untrusted fork code.
    # workflow_dispatch is restricted by GitHub to users with write access.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.pull_request.head.ref, 'feat/bump-openclaw-') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # No standalone docker/setup-buildx-action: the verify script invokes
          # `docker buildx build` directly and the runner's built-in buildx
          # supports its --build-context flag. Matches the rest of the repo, which
          # never sets up buildx separately. persist-credentials off: the build
          # runs untrusted upstream code and we never push from this job.
          persist-credentials: false

      - name: Run keyless OpenClaw upgrade verification
        id: verify
        # Bound the build below the job timeout so a hung build fails the step
        # (and posts a red result) instead of idling.
        timeout-minutes: 25
        run: |
          bash services/kiloclaw/scripts/controller-openclaw-upgrade-verify.sh \
            2>&1 | tee /tmp/openclaw-upgrade-verify.log

      # Upsert a single verification comment on the bump PR. Runs even when the
      # verification failed (always()) so a red result is reported in the PR, not
      # just in the Actions tab. Works for pull_request (PR from the event) and
      # manual workflow_dispatch (PR resolved from the dispatched branch); skips
      # cleanly when there is no PR. The output is keyless and carries no secrets.
      - name: Report verification result on the PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_FROM_EVENT: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail

          # Resolve the PR: directly from a pull_request event, else look it up by
          # the dispatched branch so the manual fallback also posts to the PR.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            PR="${PR_FROM_EVENT:-}"
          else
            PR=$(gh pr list --repo "$REPO" --head "$REF_NAME" --state open \
              --json number --jq '.[0].number // empty')
          fi
          if [ -z "${PR:-}" ]; then
            echo "No open PR for ref '${REF_NAME}'; verification result is in the run logs only."
            exit 0
          fi

          LOG=/tmp/openclaw-upgrade-verify.log
          MARKER='<!-- openclaw-upgrade-verify -->'
          {
            echo "$MARKER"
            echo "## OpenClaw upgrade — automated keyless verification"
            echo
            if [ "$OUTCOME" = "success" ]; then
              echo "✅ **Keyless checks passed.**"
            else
              echo "❌ **Keyless checks failed** — see the output below. Do not merge on this result."
            fi
            echo
            echo "_CI runs only checks that need no Kilo API key, so no credential is ever loaded into the new OpenClaw._"
            echo
            echo "**A developer must still run the credentialed live smoke** (not run in CI — it loads a real key into the container and hits the live gateway):"
            echo
            echo '```bash'
            echo 'export KILOCODE_API_KEY=<dedicated free-model key>'
            echo 'bash services/kiloclaw/scripts/controller-openclaw-upgrade-smoke-test.sh'
            echo '```'
            echo
            echo '<details><summary>CI verification output</summary>'
            echo
            echo '```'
            cat "$LOG" 2>/dev/null || echo '(no output captured)'
            echo '```'
            echo '</details>'
            echo
            echo "[Full run logs]($RUN_URL)"
          } > /tmp/verify-comment.md

          # Upsert: edit the existing marker comment if present, else create one.
          existing=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
            --jq "map(select((.body // \"\") | contains(\"${MARKER}\"))) | .[0].id // empty")
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${existing}" \
              -F body=@/tmp/verify-comment.md >/dev/null
          else
            gh api -X POST "repos/${REPO}/issues/${PR}/comments" \
              -F body=@/tmp/verify-comment.md >/dev/null
          fi
