name: mobile-native-build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [all, ios, android]
        default: all
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'dev/local/mobile-native-build.ts'
      - '.github/workflows/mobile-native-build.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'dev/local/mobile-native-build.ts'
      - '.github/workflows/mobile-native-build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a push build: it is producing an artifact hosts will
  # install. A superseded pull_request build produces nothing anyone
  # keeps, so it must not hold a macOS runner for 90 minutes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ios_hash: ${{ steps.decide.outputs.ios_hash }}
      android_hash: ${{ steps.decide.outputs.android_hash }}
      need_ios: ${{ steps.decide.outputs.need_ios }}
      need_android: ${{ steps.decide.outputs.need_android }}
      prefix: ${{ steps.decide.outputs.prefix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      # The hash steps run tsx over the local dev/local scripts and let
      # @expo/fingerprint read the Expo config from apps/mobile, so they need the
      # root project and the mobile app, not the whole workspace. Everything
      # downstream waits behind this job, so a filtered install here releases it
      # sooner.
      # The hash must stay identical to the one a build job recomputes after its
      # recursive install, or the artifact name matches no build.
      - name: Install root and mobile dependencies
        run: pnpm --filter kilocode-monorepo --filter kilo-app install --frozen-lockfile --ignore-scripts

      - name: Compute hashes and gate the build
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ inputs.platform || 'all' }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          ios_hash=$(pnpm exec tsx dev/local/mobile-native-hash.ts ios)
          android_hash=$(pnpm exec tsx dev/local/mobile-native-hash.ts android)
          echo "ios_hash=$ios_hash" >> "$GITHUB_OUTPUT"
          echo "android_hash=$android_hash" >> "$GITHUB_OUTPUT"
          pnpm exec tsx dev/local/mobile-native-gate.ts "$ios_hash" "$android_hash"

  # One harness SDK build per run. Both platform jobs need
  # packages/harness-sdk/dist and start together after the gate, so running the
  # action in each made a dist cache miss pay the typia compile twice and raced
  # both jobs to save the one key, because actions/cache saves at the end of a
  # job: the loser only logged "Unable to reserve cache". Here the action runs
  # once and both builds download the tree it produced. The dist is a TypeScript
  # emit, so the Linux build serves the macOS job.
  #
  # The job runs only when a platform job will. The gate already clears a
  # platform whose artifact another run published, so a run with both cleared
  # must not pay an install and a build for nobody.
  prepare-harness-sdk:
    needs: gate
    if: needs.gate.outputs.need_ios == 'true' || needs.gate.outputs.need_android == 'true'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      # No lfs: the harness SDK build reads the root install and its own
      # sources, and this matches the job in kilo-app CI and ci.yml that saves
      # the dist cache key this job restores.
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      # The shared store keeps installs warm when a pull request changes the
      # lockfile; a lockfile-keyed setup-node cache misses and downloads every
      # package from the registry.
      - name: Mount pnpm store
        uses: ./.github/actions/pnpm-store

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      # Only the harness SDK's dependency closure and the root project are
      # installed, as in the kilo-app CI producer above. The composite action
      # below builds `@kilocode/harness-sdk` alone, and that package has no
      # workspace dependency. Widen the filter when a step here imports a
      # workspace outside the closure.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter '@kilocode/harness-sdk...' --filter kilocode-monorepo

      - name: Restore or build the harness SDK
        uses: ./.github/actions/harness-sdk-build

      # A directory path makes the directory the artifact root, so a consumer
      # that unpacks into packages/harness-sdk/dist gets the tree the build
      # wrote, with no extra path segment.
      - name: Upload the harness SDK build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harness-sdk-dist
          path: packages/harness-sdk/dist
          retention-days: 1
          if-no-files-found: error

  # One tRPC declaration build per run, for the same reason as the harness SDK
  # above: both platform jobs need packages/trpc/dist and start together after
  # the gate, so running the action in each made a cache miss compile the same
  # declaration program twice and race both jobs to save the one key. The cache
  # stays here, which is also the entry ci.yml's and kilo-app CI's producers
  # write; both platform jobs download this job's artifact instead of building.
  #
  # The filtered install matches those two producers: the action builds
  # `@kilocode/trpc` alone, but its declaration program also reads web-shared
  # and apps/web sources through their path aliases.
  #
  # The job runs only when a platform job will: the gate clears a platform whose
  # artifact another run already published, so a run with both cleared pays no
  # install and no build for nobody.
  prepare-trpc:
    needs: gate
    if: needs.gate.outputs.need_ios == 'true' || needs.gate.outputs.need_android == 'true'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      # No lfs, like the harness SDK producer and the two other declaration
      # producers whose cache key this job restores.
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Mount pnpm store
        uses: ./.github/actions/pnpm-store

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter '@kilocode/trpc...' --filter 'web...' --filter kilocode-monorepo

      - name: Restore or build tRPC declarations
        uses: ./.github/actions/trpc-declarations

      # A directory path makes the directory the artifact root, so a consumer
      # that unpacks into packages/trpc/dist gets the tree the build wrote. A
      # hit that restored nothing must fail here, not in a consumer.
      - name: Upload the tRPC declarations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trpc-declarations
          path: packages/trpc/dist
          retention-days: 1
          if-no-files-found: error

  ios:
    needs: [gate, prepare-harness-sdk, prepare-trpc]
    if: needs.gate.outputs.need_ios == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    # A pull_request run takes one slot per ref, so pull requests with the same
    # native inputs never cancel each other's pending build; the artifact
    # re-check below still turns a duplicate that arrives after a build
    # published into a no-op. A push or workflow_dispatch run keeps one slot per
    # nativeHash, keyed on the event so a push build is never the pending job a
    # later pull_request job cancels: main would then keep no durable artifact
    # for that hash.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name }}-ios-${{ github.event_name == 'pull_request' && github.ref || needs.gate.outputs.ios_hash }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      # The probe runs tsx over the local dev/local scripts, so it needs only
      # the root project's dependencies. A duplicate that reaches this job
      # after another run published pays this filtered install instead of the
      # recursive workspace one, and the guarded install below then never runs.
      - name: Install root dependencies
        run: pnpm --filter kilocode-monorepo install --frozen-lockfile --ignore-scripts

      - name: Check whether another run published this artifact
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ needs.gate.outputs.prefix }}mobile-native-ios-${{ needs.gate.outputs.ios_hash }}
        run: pnpm exec tsx dev/local/mobile-native-gate.ts --published "$ARTIFACT"

      - name: Install dependencies
        if: steps.published.outputs.published != 'true'
        run: pnpm install --frozen-lockfile

      - name: Download the tRPC declarations
        if: steps.published.outputs.published != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: trpc-declarations
          path: packages/trpc/dist

      - name: Download the harness SDK build
        if: steps.published.outputs.published != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: harness-sdk-dist
          path: packages/harness-sdk/dist

      # A consumer computes the hash on macOS; the gate computed it on
      # Linux. A mismatch would publish an artifact nobody can ever find,
      # so fail loudly instead. Android is checked here too: it builds on
      # Linux but is consumed on macOS, and nothing else compares the two.
      - name: Verify the hashes are platform-independent
        if: steps.published.outputs.published != 'true'
        run: |
          set -euo pipefail
          check() {
            mac_hash=$(pnpm exec tsx dev/local/mobile-native-hash.ts "$1")
            if [ "$mac_hash" != "$2" ]; then
              echo "::error::$1 nativeHash differs between Linux ($2) and macOS ($mac_hash)"
              exit 1
            fi
          }
          check ios "${{ needs.gate.outputs.ios_hash }}"
          check android "${{ needs.gate.outputs.android_hash }}"

      - name: Expo prebuild
        if: steps.published.outputs.published != 'true'
        run: CI=1 pnpm --filter kilo-app exec expo prebuild --platform ios

      - name: Build
        if: steps.published.outputs.published != 'true'
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace apps/mobile/ios/Kilo.xcworkspace \
            -scheme Kilo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            build

      # A tarball keeps the executable bit that upload-artifact's zip drops.
      # The artifact name keys only on nativeHash. Record the Xcode and
      # simulator SDK so a consumer refuses a binary its target simulator
      # runtime cannot launch (see dev/local/mobile-remote-native.ts).
      - name: Package
        if: steps.published.outputs.published != 'true'
        run: |
          set -euo pipefail
          products="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator"
          xcode=$(xcodebuild -version | sed -n 's/^Build version \(.*\)$/\1/p')
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          printf '{"xcodeBuildVersion":"%s","simulatorSdkVersion":"%s"}\n' "$xcode" "$sdk" \
            > "$products/toolchain.json"
          tar -C "$products" \
            -czf "ios-${{ needs.gate.outputs.ios_hash }}.tar.gz" Kilo.app toolchain.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.published.outputs.published != 'true'
        with:
          name: ${{ needs.gate.outputs.prefix }}mobile-native-ios-${{ needs.gate.outputs.ios_hash }}
          path: ios-${{ needs.gate.outputs.ios_hash }}.tar.gz
          compression-level: 0
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 90 }}
          if-no-files-found: error

  android:
    needs: [gate, prepare-harness-sdk, prepare-trpc]
    if: needs.gate.outputs.need_android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Same slot rule as the ios job: one per ref for a pull_request run, one
    # per nativeHash for a push or workflow_dispatch run.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name }}-android-${{ github.event_name == 'pull_request' && github.ref || needs.gate.outputs.android_hash }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      # Same split as the ios job: the filtered install is enough for the
      # probe, and a duplicate never reaches the workspace install.
      - name: Install root dependencies
        run: pnpm --filter kilocode-monorepo install --frozen-lockfile --ignore-scripts

      - name: Check whether another run published this artifact
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ needs.gate.outputs.prefix }}mobile-native-android-${{ needs.gate.outputs.android_hash }}
        run: pnpm exec tsx dev/local/mobile-native-gate.ts --published "$ARTIFACT"

      - name: Install dependencies
        if: steps.published.outputs.published != 'true'
        run: pnpm install --frozen-lockfile

      - name: Download the tRPC declarations
        if: steps.published.outputs.published != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: trpc-declarations
          path: packages/trpc/dist

      - name: Download the harness SDK build
        if: steps.published.outputs.published != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: harness-sdk-dist
          path: packages/harness-sdk/dist

      - name: Expo prebuild
        if: steps.published.outputs.published != 'true'
        run: CI=1 pnpm --filter kilo-app exec expo prebuild --platform android

      # The prebuild rewrites apps/mobile/android inside this run, so the key
      # hashes the inputs that pin the generated Gradle toolchain — the app
      # manifest and the lockfile, which also records the patch hashes —
      # instead of a generated wrapper file that does not exist yet. A warm
      # user home is reused without a daemon. Any dependency change rotates the
      # key, so a miss restores the newest earlier user home from the prefix
      # and Gradle fetches only the modules that changed; the Build step stays
      # the gate.
      - name: Cache the Gradle user home
        if: steps.published.outputs.published != 'true'
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-${{ runner.arch }}-gradle-${{ hashFiles('apps/mobile/package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-gradle-

      - name: Build
        if: steps.published.outputs.published != 'true'
        run: |
          set -euo pipefail
          cd apps/mobile/android
          ./gradlew --no-daemon app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/Kilo.apk"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.published.outputs.published != 'true'
        with:
          name: ${{ needs.gate.outputs.prefix }}mobile-native-android-${{ needs.gate.outputs.android_hash }}
          path: ${{ runner.temp }}/Kilo.apk
          compression-level: 0
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 90 }}
          if-no-files-found: error
