name: mobile-native-build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [all, ios, android]
        default: all
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'dev/local/mobile-native-build.ts'
      - '.github/workflows/mobile-native-build.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'dev/local/mobile-native-build.ts'
      - '.github/workflows/mobile-native-build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a push build: it is producing an artifact hosts will
  # install. A superseded pull_request build produces nothing anyone
  # keeps, so it must not hold a macOS runner for 90 minutes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ios_hash: ${{ steps.decide.outputs.ios_hash }}
      android_hash: ${{ steps.decide.outputs.android_hash }}
      need_ios: ${{ steps.decide.outputs.need_ios }}
      need_android: ${{ steps.decide.outputs.need_android }}
      promote_ios: ${{ steps.decide.outputs.promote_ios }}
      promote_android: ${{ steps.decide.outputs.promote_android }}
      promote_ios_artifact_id: ${{ steps.decide.outputs.promote_ios_artifact_id }}
      promote_android_artifact_id: ${{ steps.decide.outputs.promote_android_artifact_id }}
      promote_ios_name: ${{ steps.decide.outputs.promote_ios_name }}
      promote_android_name: ${{ steps.decide.outputs.promote_android_name }}
      prefix: ${{ steps.decide.outputs.prefix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute hashes and gate the build
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ inputs.platform || 'all' }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          ios_hash=$(pnpm exec tsx dev/local/mobile-native-hash.ts ios)
          android_hash=$(pnpm exec tsx dev/local/mobile-native-hash.ts android)
          echo "ios_hash=$ios_hash" >> "$GITHUB_OUTPUT"
          echo "android_hash=$android_hash" >> "$GITHUB_OUTPUT"
          pnpm exec tsx dev/local/mobile-native-gate.ts "$ios_hash" "$android_hash"

  # Promotion requires the same verified source metadata as installation.
  #
  # No job-level concurrency here on purpose. A cancelled promote reports
  # `result == 'cancelled'`, which the build jobs read as "not success" and
  # answer with a full build — the cost this job exists to remove. A duplicate
  # promote is a one-minute re-upload of the same bytes.
  promote_ios:
    needs: gate
    if: needs.gate.outputs.promote_ios == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the short-lived artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.gate.outputs.promote_ios_artifact_id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > "$RUNNER_TEMP/artifact.zip"
          mkdir -p "$RUNNER_TEMP/unpacked"
          unzip -q "$RUNNER_TEMP/artifact.zip" -d "$RUNNER_TEMP/unpacked"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.gate.outputs.promote_ios_name }}
          path: ${{ runner.temp }}/unpacked
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  promote_android:
    needs: gate
    if: needs.gate.outputs.promote_android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the short-lived artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.gate.outputs.promote_android_artifact_id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > "$RUNNER_TEMP/artifact.zip"
          mkdir -p "$RUNNER_TEMP/unpacked"
          unzip -q "$RUNNER_TEMP/artifact.zip" -d "$RUNNER_TEMP/unpacked"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.gate.outputs.promote_android_name }}
          path: ${{ runner.temp }}/unpacked
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  ios:
    needs: [gate, promote_ios]
    # Build when nothing is published, or when the promote of the short-lived
    # artifact failed: a failed promote must not leave the hash without a
    # durable build. `always()` keeps this job alive when the promote job was
    # skipped, which is the normal case.
    if: |
      always() && !cancelled() &&
      needs.gate.result == 'success' &&
      (needs.gate.outputs.need_ios == 'true' ||
       (needs.gate.outputs.promote_ios == 'true' && needs.promote_ios.result != 'success'))
    runs-on: macos-26
    timeout-minutes: 90
    # A pull_request run takes one slot per ref, so pull requests with the same
    # native inputs never cancel each other's pending build; the artifact
    # re-check below still turns a duplicate that arrives after a build
    # published into a no-op. A push or workflow_dispatch run keeps one slot per
    # nativeHash, keyed on the event so a push build is never the pending job a
    # later pull_request job cancels: main would then keep no durable artifact
    # for that hash.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name }}-ios-${{ github.event_name == 'pull_request' && github.ref || needs.gate.outputs.ios_hash }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check whether another run published this artifact
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ needs.gate.outputs.prefix }}mobile-native-ios-${{ needs.gate.outputs.ios_hash }}
        run: pnpm exec tsx dev/local/mobile-native-gate.ts --published "$ARTIFACT"

      - name: Build trpc types
        if: steps.published.outputs.published != 'true'
        run: pnpm --filter @kilocode/trpc run build

      - name: Build harness SDK
        if: steps.published.outputs.published != 'true'
        run: pnpm --filter @kilocode/harness-sdk run build

      # A consumer computes the hash on macOS; the gate computed it on
      # Linux. A mismatch would publish an artifact nobody can ever find,
      # so fail loudly instead. Android is checked here too: it builds on
      # Linux but is consumed on macOS, and nothing else compares the two.
      - name: Verify the hashes are platform-independent
        if: steps.published.outputs.published != 'true'
        run: |
          set -euo pipefail
          check() {
            mac_hash=$(pnpm exec tsx dev/local/mobile-native-hash.ts "$1")
            if [ "$mac_hash" != "$2" ]; then
              echo "::error::$1 nativeHash differs between Linux ($2) and macOS ($mac_hash)"
              exit 1
            fi
          }
          check ios "${{ needs.gate.outputs.ios_hash }}"
          check android "${{ needs.gate.outputs.android_hash }}"

      - name: Expo prebuild
        if: steps.published.outputs.published != 'true'
        run: CI=1 pnpm --filter kilo-app exec expo prebuild --platform ios

      - name: Build
        if: steps.published.outputs.published != 'true'
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace apps/mobile/ios/Kilo.xcworkspace \
            -scheme Kilo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            build

      # A tarball keeps the executable bit that upload-artifact's zip drops.
      # The artifact name keys only on nativeHash. Record the Xcode and
      # simulator SDK so a consumer refuses a binary its target simulator
      # runtime cannot launch (see dev/local/mobile-remote-native.ts).
      - name: Package
        if: steps.published.outputs.published != 'true'
        run: |
          set -euo pipefail
          products="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator"
          xcode=$(xcodebuild -version | sed -n 's/^Build version \(.*\)$/\1/p')
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          printf '{"xcodeBuildVersion":"%s","simulatorSdkVersion":"%s"}\n' "$xcode" "$sdk" \
            > "$products/toolchain.json"
          tar -C "$products" \
            -czf "ios-${{ needs.gate.outputs.ios_hash }}.tar.gz" Kilo.app toolchain.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.published.outputs.published != 'true'
        with:
          name: ${{ needs.gate.outputs.prefix }}mobile-native-ios-${{ needs.gate.outputs.ios_hash }}
          path: ios-${{ needs.gate.outputs.ios_hash }}.tar.gz
          compression-level: 0
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 90 }}
          if-no-files-found: error

  android:
    needs: [gate, promote_android]
    if: |
      always() && !cancelled() &&
      needs.gate.result == 'success' &&
      (needs.gate.outputs.need_android == 'true' ||
       (needs.gate.outputs.promote_android == 'true' && needs.promote_android.result != 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Same slot rule as the ios job: one per ref for a pull_request run, one
    # per nativeHash for a push or workflow_dispatch run.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name }}-android-${{ github.event_name == 'pull_request' && github.ref || needs.gate.outputs.android_hash }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The slot above only serializes some of the duplicates: a push or
      # workflow_dispatch run is serialized per hash, a pull_request run per
      # ref, so a sibling pull request may have published this hash while this
      # job queued. A duplicate that arrives after a build published exits here
      # instead of spending a second runner.
      - name: Check whether another run published this artifact
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ needs.gate.outputs.prefix }}mobile-native-android-${{ needs.gate.outputs.android_hash }}
        run: pnpm exec tsx dev/local/mobile-native-gate.ts --published "$ARTIFACT"

      - name: Build trpc types
        if: steps.published.outputs.published != 'true'
        run: pnpm --filter @kilocode/trpc run build

      - name: Build harness SDK
        if: steps.published.outputs.published != 'true'
        run: pnpm --filter @kilocode/harness-sdk run build

      - name: Expo prebuild
        if: steps.published.outputs.published != 'true'
        run: CI=1 pnpm --filter kilo-app exec expo prebuild --platform android

      - name: Build
        if: steps.published.outputs.published != 'true'
        run: |
          set -euo pipefail
          cd apps/mobile/android
          ./gradlew --no-daemon app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/Kilo.apk"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.published.outputs.published != 'true'
        with:
          name: ${{ needs.gate.outputs.prefix }}mobile-native-android-${{ needs.gate.outputs.android_hash }}
          path: ${{ runner.temp }}/Kilo.apk
          compression-level: 0
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 90 }}
          if-no-files-found: error
