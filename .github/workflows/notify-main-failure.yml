name: Notify Main Workflow Failure

on:
  workflow_run:
    # E2E retains its existing notification with per-scenario failure details.
    workflows:
      - Auto-docs intake
      - Chromatic
      - CI
      - extension CI
      - kilo-app CI
      - kilo-app Release
      - Kilo MCP catalog
      - mobile-native-build
      - SBOM
      - Secret Scanning
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  notify:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Build Slack payload
        id: payload
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${run.head_sha}`;
            const payload = {
              text: `${run.name} failed on main: ${run.html_url}`,
              blocks: [
                {
                  type: 'header',
                  text: { type: 'plain_text', text: 'Workflow failed on main' },
                },
                {
                  type: 'section',
                  text: { type: 'plain_text', text: run.name },
                },
                {
                  type: 'section',
                  fields: [
                    { type: 'mrkdwn', text: `*Commit:*\n<${commitUrl}|${run.head_sha.slice(0, 7)}>` },
                    { type: 'plain_text', text: `Triggered by: ${run.actor.login}` },
                    { type: 'plain_text', text: `Attempt: ${run.run_attempt}` },
                  ],
                },
                {
                  type: 'section',
                  text: { type: 'mrkdwn', text: `<${run.html_url}|View failed workflow run>` },
                },
              ],
            };
            core.setOutput('payload', JSON.stringify(payload));

      - name: Notify Slack
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          webhook: ${{ secrets.DEPLOY_NOTIFY_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: ${{ steps.payload.outputs.payload }}
