name: Promote Vercel Deployment

on:
  workflow_call:
    inputs:
      deployment_url:
        description: 'Vercel deployment URL to promote'
        required: true
        type: string
      axiom_annotation_dataset:
        description: 'Optional Axiom dataset used to scope deployment annotations'
        required: false
        type: string
        default: ''
      axiom_expected_project:
        description: 'Vercel project name the promoted deployment must match before annotating'
        required: false
        type: string
        default: 'kilocode-app'
      vercel_cli_artifact:
        description: 'Artifact of this run that holds the packed Vercel CLI (install-vercel-cli.yml)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Reads the Vercel and Axiom tokens from STS, then promotes and annotates with
  # the CLI the caller's install-vercel-cli.yml job installed. The Vercel token's
  # consumer is the CLI itself, so its runtime code runs with the tokens; the job
  # installs nothing and runs no package manager. Policy: ci-vercel-promote,
  # D53/M112.
  promote:
    # Guard: this reusable workflow promotes a Vercel deployment to production
    # with a production credential. This is defense-in-depth: callers must guard
    # their own jobs, because a job-level `if:` turns an unguarded call on a fork
    # into a silently skipped promotion rather than an obvious failure.
    if: github.repository == 'Kilo-Org/cloud'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    # The STS policy names this environment; its branch policy keeps it to main.
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      # Only for the local sts-bundle action; nothing else is read from the tree.
      - name: Checkout the STS action
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/sts-bundle

      # Both reads come before the CLI reaches the runner: every step ahead of a
      # read is trusted.
      - name: Read the Vercel token from STS
        id: sts
        uses: ./.github/actions/sts-bundle
        with:
          workload: ci-vercel-promote
          secrets: VERCEL_TOKEN

      # Annotation is best-effort, so a failed read only skips it.
      - name: Read the Axiom annotation token from STS
        id: sts-axiom
        if: inputs.axiom_annotation_dataset != ''
        continue-on-error: true
        uses: ./.github/actions/sts-bundle
        with:
          workload: ci-vercel-promote
          secrets: AXIOM_ANNOTATION_TOKEN

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.vercel_cli_artifact }}
          path: ${{ runner.temp }}

      # The CLI stays off PATH, so no later step resolves another command from it.
      - name: Unpack Vercel CLI
        run: |
          mkdir "$RUNNER_TEMP/vercel-cli"
          tar -xzf "$RUNNER_TEMP/vercel-cli.tgz" -C "$RUNNER_TEMP/vercel-cli"
          "$RUNNER_TEMP/vercel-cli/bin/vercel" --version

      - name: Promote Vercel deployment
        # The stage workflow checks the form of this URL before it publishes it
        # as an output; this step passes it to the CLI as one argument.
        env:
          DEPLOYMENT_URL: ${{ inputs.deployment_url }}
          VERCEL_TOKEN: ${{ steps.sts.outputs.VERCEL_TOKEN }}
        run: |
          "$RUNNER_TEMP/vercel-cli/bin/vercel" promote "$DEPLOYMENT_URL" --scope=kilocode --token="$VERCEL_TOKEN"

      - name: Annotate production deployment in Axiom
        if: inputs.axiom_annotation_dataset != ''
        # Annotation is best-effort observability, not a deploy gate: never fail
        # a successful promotion because Axiom/Vercel is flaky or slow to update.
        continue-on-error: true
        env:
          AXIOM_ANNOTATION_TOKEN: ${{ steps.sts-axiom.outputs.AXIOM_ANNOTATION_TOKEN }}
          AXIOM_DATASET: ${{ inputs.axiom_annotation_dataset }}
          AXIOM_ORG_ID: kilo-code-nvjh
          DEPLOYMENT_URL: ${{ inputs.deployment_url }}
          EXPECTED_PROJECT: ${{ inputs.axiom_expected_project }}
          VERCEL_TOKEN: ${{ steps.sts.outputs.VERCEL_TOKEN }}
        run: |
          if [ -z "$AXIOM_ANNOTATION_TOKEN" ]; then
            echo "::warning::Skipping deployment annotation because AXIOM_ANNOTATION_TOKEN could not be read from STS"
            exit 0
          fi

          # Vercel's API can briefly lag behind a promotion, so retry until the
          # deployment reports READY instead of failing on the first check.
          deployment=""
          for attempt in 1 2 3 4 5; do
            inspection_error=$(mktemp)
            if ! inspection=$("$RUNNER_TEMP/vercel-cli/bin/vercel" inspect "$DEPLOYMENT_URL" --json --scope=kilocode --token="$VERCEL_TOKEN" 2>"$inspection_error"); then
              echo "::warning::vercel inspect failed (attempt $attempt): $(<"$inspection_error")"
              rm "$inspection_error"
              if [ "$attempt" != "5" ]; then
                sleep 5
              fi
              continue
            fi
            rm "$inspection_error"

            deployment_id=$(jq -r '.id // empty' <<<"$inspection" 2>/dev/null || true)
            if [ -z "$deployment_id" ]; then
              echo "::warning::vercel inspect did not return a deployment id (attempt $attempt): $inspection"
              if [ "$attempt" != "5" ]; then
                sleep 5
              fi
              continue
            fi

            deployment=$("$RUNNER_TEMP/vercel-cli/bin/vercel" api "/v13/deployments/$deployment_id" --raw --scope=kilocode --token="$VERCEL_TOKEN" 2>&1)
            ready_state=$(jq -r '.readyState // empty' <<<"$deployment" 2>/dev/null)
            if [ "$ready_state" = "READY" ]; then
              break
            fi

            echo "::warning::Deployment not READY yet (attempt $attempt, state=$ready_state)"
            if [ "$attempt" != "5" ]; then
              sleep 5
            fi
          done

          project=$(jq -r '.name // empty' <<<"$deployment" 2>/dev/null)
          target=$(jq -r '.target // empty' <<<"$deployment" 2>/dev/null)
          ready_state=$(jq -r '.readyState // empty' <<<"$deployment" 2>/dev/null)

          if [ "$project" != "$EXPECTED_PROJECT" ] || [ "$target" != "production" ] || [ "$ready_state" != "READY" ]; then
            echo "::warning::Skipping annotation for unexpected deployment: project=$project target=$target state=$ready_state"
            exit 0
          fi

          deployment_time=$(jq -r '((.ready // .createdAt) / 1000) | todateiso8601' <<<"$deployment")
          commit_sha=$(jq -r '.meta.githubCommitSha // "unknown"' <<<"$deployment")
          short_sha=${commit_sha:0:8}
          commit_message=$(jq -r '(.meta.githubCommitMessage // "Commit message unavailable" | split("\n")[0])[0:360]' <<<"$deployment")
          commit_ref=$(jq -r '.meta.githubCommitRef // "unknown"' <<<"$deployment")
          commit_author=$(jq -r '.meta.githubCommitAuthorName // .creator.username // "unknown"' <<<"$deployment")
          deployment_link="https://vercel.com/kilocode/$project/${deployment_id#dpl_}"

          payload=$(jq -n \
            --arg dataset "$AXIOM_DATASET" \
            --arg time "$deployment_time" \
            --arg title "$project · $short_sha" \
            --arg description "$commit_message · $commit_ref · $commit_author" \
            --arg url "$deployment_link" \
            --arg type "$project-production-deployment" \
            '{datasets:[$dataset], type:$type, time:$time, title:$title, description:$description, url:$url}')

          for attempt in 1 2 3; do
            if axiom_response=$(curl --fail-with-body --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --request POST \
              --header "Authorization: Bearer $AXIOM_ANNOTATION_TOKEN" \
              --header "X-Axiom-Org-Id: $AXIOM_ORG_ID" \
              --header "Content-Type: application/json" \
              --data "$payload" \
              https://api.axiom.co/v2/annotations 2>&1); then
              echo "Created Axiom annotation for Vercel deployment $deployment_id"
              exit 0
            else
              curl_exit=$?
            fi

            axiom_error=${axiom_response//$'\n'/ }
            echo "Axiom annotation attempt $attempt/3 failed (curl exit $curl_exit): ${axiom_error:0:1000}"
            if [ "$attempt" != "3" ]; then
              sleep 2
            fi
          done

          echo "::warning::Failed to create Axiom annotation after 3 attempts (last curl exit $curl_exit)"
          exit "$curl_exit"
