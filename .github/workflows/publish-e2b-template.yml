name: Publish E2B Cloud Agent template

on:
  workflow_dispatch:
    inputs:
      confirm_publication:
        description: Publish the Kilo-owned public template using approved E2B resources
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: e2b-template-publication
  cancel-in-progress: false

jobs:
  publish:
    if: inputs.confirm_publication && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: e2b-template-publication
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b
        with:
          lfs: true
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build wrapper artifacts
        run: pnpm --filter cloud-agent-next build:wrapper
      - name: Test E2B template and transport contracts
        run: |
          pnpm --filter cloud-agent-next test scripts/e2b-template.test.ts src/sandbox-control/e2b-provider.test.ts src/sandbox-control/e2b-envd.test.ts
          pnpm --filter cloud-agent-next test:integration e2b-sdk.test.ts e2b-provider.test.ts
      - name: Publish approved template
        working-directory: services/cloud-agent-next
        env:
          E2B_TEMPLATE_PUBLISH_APPROVED: 'true'
          E2B_TEMPLATE_PUBLISH_KEY: ${{ secrets.E2B_TEMPLATE_PUBLISH_KEY }}
          E2B_TEMPLATE_NAMESPACE: ${{ vars.E2B_TEMPLATE_NAMESPACE }}
        run: pnpm exec tsx scripts/e2b-template.ts publish
      - name: Retain exact release identity
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2b-template-release
          path: services/cloud-agent-next/.e2b-build/*manifest.json
          if-no-files-found: ignore
