name: Redeploy Web to Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify-main:
    # Guard: this workflow_dispatch is reachable from a fork, and it deploys
    # the web app to production using repo secrets. Only the canonical repo
    # may run it. (verify-main already enforces GITHUB_REF == refs/heads/main,
    # so the guard is defense-in-depth for the dispatch path.)
    if: github.repository == 'Kilo-Org/cloud'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5

    steps:
      - name: Verify main branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::This workflow must be run from main. Got: $GITHUB_REF"
            exit 1
          fi

  stage-app:
    needs: verify-main
    if: github.repository == 'Kilo-Org/cloud'
    uses: ./.github/workflows/stage-vercel-deployment.yml
    with:
      target_environment: production
      vercel_project_id_var: VERCEL_PROJECT_ID_APP
    secrets:
      VERCEL_PROJECT_TOKEN: ${{ secrets.VERCEL_TOKEN_APP }}

  stage-global-app:
    needs: verify-main
    if: github.repository == 'Kilo-Org/cloud'
    uses: ./.github/workflows/stage-vercel-deployment.yml
    with:
      target_environment: production
      vercel_project_id_var: VERCEL_PROJECT_ID_GLOBAL_APP
    secrets:
      VERCEL_PROJECT_TOKEN: ${{ secrets.VERCEL_TOKEN_GLOBAL_APP }}

  promote-app:
    needs: stage-app
    if: github.repository == 'Kilo-Org/cloud'
    uses: ./.github/workflows/promote-vercel-deployment.yml
    with:
      deployment_url: ${{ needs.stage-app.outputs.deployment_url }}
      axiom_annotation_dataset: kilocode-app
    secrets:
      AXIOM_ANNOTATION_TOKEN: ${{ secrets.AXIOM_ANNOTATION_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  promote-global-app:
    needs: stage-global-app
    if: github.repository == 'Kilo-Org/cloud'
    uses: ./.github/workflows/promote-vercel-deployment.yml
    with:
      deployment_url: ${{ needs.stage-global-app.outputs.deployment_url }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
