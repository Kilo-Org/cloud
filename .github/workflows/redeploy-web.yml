name: Redeploy Web to Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify-main:
    # This job holds no secrets, so it can report the reason a dispatch is
    # rejected instead of being silently skipped. The jobs that use repo
    # secrets carry the canonical-repo guard.
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5

    steps:
      - name: Verify main branch
        run: |
          if [ "$GITHUB_REPOSITORY" != "Kilo-Org/cloud" ]; then
            echo "::error::This workflow must be run from the canonical Kilo-Org/cloud repository. Got: $GITHUB_REPOSITORY"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::This workflow must be run from main. Got: $GITHUB_REF"
            exit 1
          fi

  stage-app:
    needs: verify-main
    if: github.repository == 'Kilo-Org/cloud'
    uses: ./.github/workflows/stage-vercel-deployment.yml
    with:
      target_environment: production
      vercel_project_id_var: VERCEL_PROJECT_ID_APP
    secrets:
      VERCEL_PROJECT_TOKEN: ${{ secrets.VERCEL_TOKEN_APP }}

  promote-app:
    needs: stage-app
    if: github.repository == 'Kilo-Org/cloud'
    uses: ./.github/workflows/promote-vercel-deployment.yml
    with:
      deployment_url: ${{ needs.stage-app.outputs.deployment_url }}
      axiom_annotation_dataset: kilocode-app
    secrets:
      AXIOM_ANNOTATION_TOKEN: ${{ secrets.AXIOM_ANNOTATION_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
