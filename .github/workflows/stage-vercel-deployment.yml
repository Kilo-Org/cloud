name: Stage Vercel Deployment

on:
  workflow_call:
    inputs:
      target_environment:
        description: 'GitHub and Vercel environment to deploy to'
        required: true
        type: string
      vercel_project_id_var:
        description: 'Name of the GitHub variable containing the Vercel project ID to deploy'
        required: true
        type: string
      vercel_token_key:
        description: 'Bundle key of the Vercel token scoped to the project being deployed (VERCEL_TOKEN_APP, VERCEL_TOKEN_AI_GATEWAY or VERCEL_TOKEN_AI_GATEWAY_SECURE_PROXY)'
        required: true
        type: string
      vercel_cli_artifact:
        description: 'Artifact of this run that holds the packed Vercel CLI (install-vercel-cli.yml)'
        required: true
        type: string
      vercel_cli_sha256:
        description: 'SHA-256 of vercel-cli.tgz in that artifact, from the same install job'
        required: true
        type: string
      source_sha:
        description: 'Exact tested commit to deploy (defaults to the caller SHA)'
        required: false
        default: ''
        type: string
    outputs:
      deployment_url:
        description: 'Staged Vercel deployment URL'
        value: ${{ jobs.stage.outputs.deployment_url }}

permissions:
  contents: read

jobs:
  # Reads the project token from STS and stages the deployment with the CLI the
  # caller's install-vercel-cli.yml job installed. The token's consumer is the
  # Vercel CLI itself, so its runtime code runs with the token; the job installs
  # nothing and runs no package manager. Policies: ci-vercel-stage (production)
  # and ci-vercel-stage-staging (staging), D53/M112.
  stage:
    # Guard: this reusable workflow stages a Vercel deployment with a production
    # credential. It is only ever called by guarded caller jobs, but the guard is
    # also applied here so the workflow cannot run outside the canonical repo
    # even if a caller skips its own guard.
    if: github.repository == 'Kilo-Org/cloud'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    # The STS policy names this environment; its branch policy keeps it to main.
    environment: ${{ inputs.target_environment }}
    permissions:
      contents: read
      id-token: write

    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}

    env:
      TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars[inputs.vercel_project_id_var] }}

    steps:
      # The sts-bundle action comes from the run's own commit, not from the
      # commit being deployed, and is read before anything else reaches the runner.
      - name: Checkout the STS action
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: sts-action
          persist-credentials: false
          sparse-checkout: .github/actions/sts-bundle

      - name: Read the Vercel project token from STS
        id: sts
        uses: ./sts-action/.github/actions/sts-bundle
        with:
          workload: ${{ inputs.target_environment == 'production' && 'ci-vercel-stage' || format('ci-vercel-stage-{0}', inputs.target_environment) }}
          secrets: ${{ inputs.vercel_token_key }}

      - name: Checkout code
        uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          lfs: true
          ref: ${{ inputs.source_sha || github.sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.vercel_cli_artifact }}
          path: ${{ runner.temp }}

      # The CLI stays off PATH, so no later step resolves another command from
      # it. The side checkout leaves the tree the CLI uploads.
      - name: Unpack Vercel CLI
        env:
          VERCEL_CLI_SHA256: ${{ inputs.vercel_cli_sha256 }}
        run: |
          rm -rf sts-action
          echo "$VERCEL_CLI_SHA256  $RUNNER_TEMP/vercel-cli.tgz" | sha256sum --check --strict --quiet ||
            { echo "::error::The Vercel CLI artifact does not match the digest of its install job"; exit 1; }
          mkdir "$RUNNER_TEMP/vercel-cli"
          tar -xzf "$RUNNER_TEMP/vercel-cli.tgz" -C "$RUNNER_TEMP/vercel-cli"
          "$RUNNER_TEMP/vercel-cli/bin/vercel" --version

      # Each Vercel project builds its Root Directory from this repository root,
      # so the CLI uploads the whole tree. That tree passed Vercel's 15,000-file
      # per-deployment limit, and Vercel documents --archive=tgz as the remedy
      # for deployments that include thousands of files.
      - name: Stage Vercel deployment
        id: deploy
        env:
          VERCEL_PROJECT_TOKEN: ${{ steps.sts.outputs[inputs.vercel_token_key] }}
        run: |
          if [ "$TARGET_ENVIRONMENT" = "production" ]; then
            deployment_output=$("$RUNNER_TEMP/vercel-cli/bin/vercel" deploy --prod --skip-domain --archive=tgz --token="$VERCEL_PROJECT_TOKEN")
          else
            deployment_output=$("$RUNNER_TEMP/vercel-cli/bin/vercel" deploy --target="$TARGET_ENVIRONMENT" --archive=tgz --token="$VERCEL_PROJECT_TOKEN")
          fi

          deployment_url=$(printf '%s\n' "$deployment_output" | tail -n 1)
          if [[ ! "$deployment_url" =~ ^https://[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?/?$ ]]; then
            echo "Vercel deploy did not print a deployment URL" >&2
            exit 1
          fi
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
