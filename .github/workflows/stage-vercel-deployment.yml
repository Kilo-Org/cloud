name: Stage Vercel Deployment

on:
  workflow_call:
    inputs:
      target_environment:
        description: 'GitHub and Vercel environment to deploy to'
        required: true
        type: string
      vercel_project_id_var:
        description: 'Name of the GitHub variable containing the Vercel project ID to deploy'
        required: true
        type: string
      source_sha:
        description: 'Exact tested commit to deploy (defaults to the caller SHA)'
        required: false
        default: ''
        type: string
    outputs:
      deployment_url:
        description: 'Staged Vercel deployment URL'
        value: ${{ jobs.stage.outputs.deployment_url }}
    secrets:
      VERCEL_PROJECT_TOKEN:
        description: 'Vercel token scoped to the project being deployed'
        required: true

permissions:
  contents: read

jobs:
  stage:
    # Guard: this reusable workflow stages a Vercel deployment using repo
    # secrets. It is only ever called by guarded caller jobs, but the guard is
    # also applied here so the workflow cannot run outside the canonical repo
    # even if a caller skips its own guard.
    if: github.repository == 'Kilo-Org/cloud'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    environment: ${{ inputs.target_environment }}

    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}

    env:
      TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
      VERCEL_VERSION: '59.5.0'
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars[inputs.vercel_project_id_var] }}

    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          lfs: true
          ref: ${{ inputs.source_sha || github.sha }}

      # The installed tree is ~265 MB (~77 MB compressed), so the cache only pays
      # off when the prefix holds a runnable copy of the pinned version. A miss, or
      # a cache failure, costs the registry install and never blocks a deploy. An
      # entry that fails the check below is not replaced under an unchanged key, so
      # it costs that install in every job until the key changes.
      - name: Restore Vercel CLI
        id: vercel-cli-cache
        continue-on-error: true
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ runner.temp }}/vercel-cli
          # vercel@59.5.0 installs one @vercel/vc-native-<os>-<arch> optional
          # dependency, so an entry from another architecture cannot be reused.
          key: ${{ runner.os }}-${{ runner.arch }}-vercel-cli-${{ env.VERCEL_VERSION }}

      - name: Install Vercel CLI
        env:
          VERCEL_CLI_PREFIX: ${{ runner.temp }}/vercel-cli
          CACHE_HIT: ${{ steps.vercel-cli-cache.outputs.cache-hit }}
        run: |
          echo "$VERCEL_CLI_PREFIX/bin" >> "$GITHUB_PATH"

          manifest="$VERCEL_CLI_PREFIX/lib/node_modules/vercel/package.json"
          installed=$(node -p "require('$manifest').version" 2>/dev/null || true)

          # A miss, a different version, or a tree the CLI cannot start from takes
          # the registry path.
          if [ "$CACHE_HIT" = "true" ] && [ "$installed" = "$VERCEL_VERSION" ] \
            && "$VERCEL_CLI_PREFIX/bin/vercel" --version >/dev/null 2>&1; then
            echo "Restored vercel@$installed from the cache"
          else
            echo "Installing vercel@$VERCEL_VERSION"
            rm -rf "$VERCEL_CLI_PREFIX"
            npm install --global --prefix "$VERCEL_CLI_PREFIX" "vercel@$VERCEL_VERSION" --no-audit --no-fund
            installed=$(node -p "require('$manifest').version")
            if [ "$installed" != "$VERCEL_VERSION" ]; then
              echo "::error::Resolved vercel@$installed but the pinned version is $VERCEL_VERSION"
              exit 1
            fi
          fi
          "$VERCEL_CLI_PREFIX/bin/vercel" --version

      - name: Stage Vercel deployment
        id: deploy
        run: |
          if [ "$TARGET_ENVIRONMENT" = "production" ]; then
            deployment_output=$(vercel deploy --prod --skip-domain --token=${{ secrets.VERCEL_PROJECT_TOKEN }})
          else
            deployment_output=$(vercel deploy --target="$TARGET_ENVIRONMENT" --token=${{ secrets.VERCEL_PROJECT_TOKEN }})
          fi

          deployment_url=$(printf '%s\n' "$deployment_output" | tail -n 1)
          if [[ ! "$deployment_url" =~ ^https:// ]]; then
            echo "Vercel deploy did not print a deployment URL" >&2
            exit 1
          fi
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
