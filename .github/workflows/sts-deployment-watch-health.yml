name: STS deployment watch health

# Posts to Slack when the STS deployment watch (sts-deployment-watch.yml) has had no successful
# scheduled run on main for 45 minutes. It uses only the job's GitHub token, so it keeps working
# when the watch's Cloudflare token is revoked or rolled, its schedule stops, or its workflow breaks.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  health:
    if: github.repository == 'Kilo-Org/cloud' && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.RUNNER_DEFAULT_LABEL || 'ubuntu-latest' }}
    # 10 not 5: the Blacksmith checkout's mirror refresh took ~400 s (3 x 120 s
    # fetch attempts plus waits) in a slowdown, and that post step had no room in
    # a 5 minute budget, which cancelled the health check and its Slack alert.
    # The actions/checkout below drops the mirror refresh.
    timeout-minutes: 10
    steps:
      # The check reads this commit's script only.
      # actions/checkout has no Blacksmith mirror to refresh.
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Nothing here pushes, and the repository is public.
          persist-credentials: false

      - name: Check the last successful watch run
        id: health
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sts-deployment-watch.mjs health

      - name: Notify Slack
        if: steps.health.outputs.stale == 'true' || failure()
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          errors: true
          webhook: ${{ secrets.DEPLOY_NOTIFY_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {"text": "STS deployment watch has had no successful scheduled run on main for 45 minutes (or its health check failed); STS deployments are unchecked: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/sts-deployment-watch.yml"}
