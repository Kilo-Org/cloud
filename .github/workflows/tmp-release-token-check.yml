name: tmp release token check

on:
  push:
    branches: [fix/kilo-app-upload-marker-race]
    paths: ['.github/workflows/tmp-release-token-check.yml']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          token: ${{ secrets.KILO_APP_RELEASE_TOKEN }}
      - name: Push a tag on a commit whose workflows match no branch tip
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "# token check ${GITHUB_RUN_ID}" >> .github/workflows/kilo-app-release.yml
          git commit -qam "token check ${GITHUB_RUN_ID}"
          TAG="tmp-token-check/${GITHUB_RUN_ID}"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          git push origin --delete "$TAG"
      - name: Control - the same push with GITHUB_TOKEN must be refused
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="tmp-token-check/${GITHUB_RUN_ID}-control"
          git tag -a "$TAG" -m "$TAG"
          if git -c http.https://github.com/.extraheader= push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TAG"; then
            git push origin --delete "$TAG"
            echo "::error::GITHUB_TOKEN push was accepted, so this check proves nothing"
            exit 1
          fi
          echo "GITHUB_TOKEN push refused as expected"
