name: tmp release token check

on:
  push:
    branches: [fix/kilo-app-upload-marker-race]
    paths: ['.github/workflows/tmp-release-token-check.yml']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
      - name: Persisted credential is GITHUB_TOKEN, not the PAT
        run: git config --show-origin --get-regexp 'extraheader' | sed -E 's/basic .*/basic <hidden>/'
      - name: Scoped PAT push of a tag on a commit whose workflows match no branch tip
        env:
          RELEASE_TOKEN: ${{ secrets.KILO_APP_RELEASE_TOKEN }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$RELEASE_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0=
          export GIT_CONFIG_KEY_1=http.https://github.com/.extraheader GIT_CONFIG_VALUE_1="AUTHORIZATION: basic $AUTH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "# token check ${GITHUB_RUN_ID}" >> .github/workflows/kilo-app-release.yml
          git commit -qam "token check ${GITHUB_RUN_ID}"
          TAG="tmp-token-check/${GITHUB_RUN_ID}"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          git push origin --delete "$TAG"
