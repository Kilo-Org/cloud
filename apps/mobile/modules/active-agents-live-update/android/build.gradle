apply plugin: 'com.android.library'

group = 'com.kilocode.activeagentsliveupdate'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()
useDefaultAndroidSdkVersions()

android {
  namespace "com.kilocode.activeagentsliveupdate"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // HeadlessJsTaskService and HeadlessJsTaskConfig are React Native classes.
  // expo-modules-core depends on react-android with `implementation`, so its
  // consumers get it at runtime only; the Kotlin compile classpath needs its
  // own declaration, the same one expo-asset's build.gradle carries.
  implementation 'com.facebook.react:react-android'
}
