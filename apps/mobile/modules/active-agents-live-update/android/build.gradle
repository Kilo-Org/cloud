// Android-only by capability: this library owns Android's Live Update
// notification surface and has no iOS counterpart to share. iOS renders the
// same feature as an ActivityKit Live Activity through `expo-widgets`
// (src/glanceable-ios/); both drive the shared pipeline in
// src/lib/glanceable/, whose one answer body is approve-ask.ts.
apply plugin: 'com.android.library'

group = 'com.kilocode.activeagentsliveupdate'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()
useDefaultAndroidSdkVersions()

android {
  namespace "com.kilocode.activeagentsliveupdate"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // The Approve action answers in headless JS, which Android 8+ only allows
  // through WorkManager. concurrent-futures supplies the ListenableFuture
  // adapter the worker completes from the task listener; it is the same 1.1.0
  // the widget library already puts on the runtime classpath.
  implementation 'androidx.work:work-runtime:2.8.1'
  implementation 'androidx.concurrent:concurrent-futures:1.1.0'
  // The headless worker and the headless task service beside it name
  // com.facebook.react.** classes. The app's React Gradle plugin puts
  // react-android on the runtime classpath, so the library only needs it on its
  // own Kotlin compile classpath — the declaration expo-asset's build.gradle
  // carries. Both declarations name the one coordinate, which Gradle resolves to
  // that single copy rather than repackaging it.
  compileOnly 'com.facebook.react:react-android'
  implementation 'com.facebook.react:react-android'
}
