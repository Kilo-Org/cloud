[workspace]
resolver = "3"
members = ["ssh-core", "uniffi-bindgen"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
uniffi = { version = "0.32.2", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
