[package]
name = "ssh-core"
description = "SSH primitives shared by the React Native binding layers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ssh_core"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
age = { version = "0.11.1", default-features = false, features = ["armor"] }
async-trait = "0.1"
getrandom = { version = "0.4", features = ["sys_rng"] }
# ring is the only russh crypto backend that cross-compiles to the Android NDK and
# to iOS without a host CMake/Go toolchain, which aws-lc-rs requires.
# rsa adds RSA host and user key support (PKCS#1 parsing lives in russh's key loader).
russh = { version = "0.65.1", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3.0.1"
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "rt-multi-thread",
  "net",
  "sync",
  "time",
] }
uniffi = { workspace = true }
zeroize = "1.9"

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "test-util",
  "time",
] }
