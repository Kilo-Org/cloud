plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.kilosystemsearch'
version = '1.0.0'

android {
  namespace 'expo.modules.kilosystemsearch'

  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // API 31+ uses the platform AppSearch store; below 31 the Jetpack local store
  // backs the same AppSearchSession contract. Both are pinned to the versions
  // resolved for this module.
  implementation 'androidx.appsearch:appsearch:1.1.0'
  implementation 'androidx.appsearch:appsearch-local-storage:1.1.0'
}
