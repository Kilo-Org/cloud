<!doctype html>
<html lang="en">
  <body style="margin: 0; background: #ffffff">
    <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
      <tr>
        <td align="center" style="padding: 32px 20px">
          <table
            width="520"
            cellpadding="0"
            cellspacing="0"
            role="presentation"
            style="max-width: 520px"
          >
            <tr>
              <td
                style="
                  font-family:
                    -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
                    sans-serif;
                "
              >
                <h1 style="margin: 0 0 16px; color: #1a1a1a; font-size: 24px; line-height: 32px">
                  Your account export is ready
                </h1>
                <p style="margin: 0 0 18px; color: #333; font-size: 15px; line-height: 24px">
                  Your Kilo account export is ready to download. Sign in to access it securely.
                </p>
                <table cellpadding="0" cellspacing="0" role="presentation">
                  <tr>
                    <td style="border-radius: 7px; background: #1a1a1a">
                      <a
                        href="{{ data_exports_url }}"
                        style="
                          display: inline-block;
                          padding: 10px 20px;
                          color: #ffffff;
                          font-family:
                            -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
                            sans-serif;
                          font-size: 13px;
                          font-weight: 600;
                          text-decoration: none;
                        "
                        >View data exports</a
                      >
                    </td>
                  </tr>
                </table>
                <p style="margin: 22px 0 0; color: #555; font-size: 13px; line-height: 20px">
                  This export is available until {{ expiry_date }}.
                </p>
              </td>
            </tr>
          </table>
          <!-- Branding Footer -->
          <table width="520" cellpadding="0" cellspacing="0">
            <tr>
              <td align="center" style="padding: 30px 20px; border-top: 1px solid #eee">
                <p
                  style="
                    margin: 0;
                    font-size: 11px;
                    color: #ccc;
                    font-family:
                      -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
                      sans-serif;
                  "
                >
                  © {{ year }} Kilo Code, Inc<br />455 Market St, Ste 1940 PMB 993504<br />San
                  Francisco, CA 94105, USA
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
