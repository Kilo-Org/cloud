<!doctype html>
<html lang="en">
  <body style="margin: 0; background: #ffffff">
    <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
      <tr>
        <td align="center" style="padding: 32px 20px">
          <table
            width="520"
            cellpadding="0"
            cellspacing="0"
            role="presentation"
            style="max-width: 520px"
          >
            <tr>
              <td
                style="
                  padding: 40px 40px 20px;
                  font-family:
                    -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
                    sans-serif;
                "
              >
                <h1 style="margin: 0; color: #1a1a1a; font-size: 24px; line-height: 32px">
                  Account deletion complete
                </h1>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 0 40px 40px;
                  color: #333;
                  font-family:
                    -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
                    sans-serif;
                  font-size: 15px;
                  line-height: 24px;
                "
              >
                <p style="margin: 0">{{ completion_message }}</p>
              </td>
            </tr>
          </table>
          <!-- Branding Footer -->
          <table width="520" cellpadding="0" cellspacing="0" role="presentation">
            <tr>
              <td
                align="center"
                style="
                  padding: 30px 20px;
                  border-top: 1px solid #eee;
                  color: #ccc;
                  font-family:
                    -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
                    sans-serif;
                  font-size: 11px;
                "
              >
                © {{ year }} Kilo Code, Inc<br />455 Market St, Ste 1940 PMB 993504<br />San
                Francisco, CA 94105, USA
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
