packages:
  - apps/*
  - services/*
  - services/cloud-agent-next/wrapper
  - services/gastown/container
  - services/kiloclaw/controller
  - services/kiloclaw/plugins/*
  - services/deploy-infra/builder
  - services/deploy-infra/dispatcher
  - packages/*

catalog:
  '@cloudflare/vitest-pool-workers': 0.16.13
  # The OAuth 2.1 provider the kilo-mcp worker delegates its hand-rolled
  # authorization/token server to. Pinned exactly; adopted with the KV binding
  # and zod schemas in the same change.
  '@cloudflare/workers-oauth-provider': 0.10.3
  '@cloudflare/workers-types': 4.20260605.1
  # Workers-compatible JSON Schema validator for the kilo-mcp call tool.
  # AJV cannot run on Workerd: it compiles schemas with `new Function`, which
  # the Workers runtime forbids. Pinned exactly.
  '@cfworker/json-schema': 4.1.1
  '@octokit/auth-app': 8.2.0
  # Only for packages that shell out to the `sentry-cli` binary directly (Workers,
  # mobile). Must NOT be added to `overrides`: the Sentry bundler plugins consume
  # @sentry/cli through its Node API, which v3 broke. See the note in `overrides`.
  '@sentry/cli': 3.8.0
  '@tanstack/query-async-storage-persister': 5.103.1
  '@tanstack/react-query': 5.103.1
  '@tanstack/react-query-persist-client': 5.103.1
  '@trpc/client': 11.18.0
  # @trpc/client@11.18.0 declares this exact peer:
  #   @trpc/server: 11.18.0
  '@trpc/server': 11.18.0
  '@trpc/tanstack-react-query': 11.18.0
  '@types/jsonwebtoken': 9.0.10
  '@types/node': 24.12.4
  '@typescript/native-preview': 7.0.0-dev.20260707.2
  '@vitest/coverage-v8': 5.0.1
  '@vitest/ui': 5.0.1
  '@workos-inc/node': 8.13.0
  aws4fetch: 1.0.20
  drizzle-kit: 0.31.10
  drizzle-orm: 0.45.2
  hono: 4.12.34
  jose: 6.2.3
  jsonwebtoken: 9.0.3
  p-limit: 7.3.0
  stripe: 19.3.1
  tsx: 4.21.0
  typescript: 5.9.3
  ulid: 3.0.2
  vitest: 5.0.1
  workers-tagged-logger: 1.0.0
  wrangler: 4.112.0
  zod: 4.6.5
catalogs:
  # Every published @cloudflare/vitest-pool-workers (through 0.22.0) declares a
  # `vitest ^4.1.0` peer and imports internal Vitest APIs that vitest 5 reworked,
  # so the pool's proxy worker fails to boot under vitest 5
  # (`SyntaxError: Unexpected identifier 'file'`). Workspaces whose tests run the
  # workerd pool stay on the pre-move vitest 4.1.6 through this catalog; the
  # default catalog's vitest 5.0.1 covers everything else. @vitest/ui moves with
  # them so its exact `vitest` peer keeps matching. Keep these exact, and keep
  # this comment.
  vitest4:
    '@vitest/ui': 4.1.6
    vitest: 4.1.6

minimumReleaseAge: 6842
minimumReleaseAgeExclude:
  - tsx
  # Expo SDK 57 alignment: the 2026-09-18 patch releases `expo install --check`
  # expects, plus the exact transitive versions that aligned graph resolves to.
  # Each entry exempts exactly the listed package@version required by that
  # alignment; any other or future version of these packages stays age-gated.
  - expo@57.0.24
  - '@expo/ui@57.0.19'
  - expo-router@57.0.22
  - expo-widgets@57.0.20
  - expo-asset@57.0.18
  - expo-build-properties@57.0.21
  - expo-constants@57.0.19
  - expo-image-manipulator@57.0.19
  - expo-image-picker@57.0.19
  - expo-location@57.0.19
  - expo-notifications@57.0.20
  - expo-sharing@57.0.21
  - expo-task-manager@57.0.19
  - babel-preset-expo@57.0.12
  - expo-modules-core@57.0.18
  - expo-modules-jsi@57.1.0
  - '@expo/cli@57.0.26'
  - '@expo/metro-runtime@57.0.16'
  - '@expo/metro-file-map@57.0.3'
  - expo-glass-effect@57.0.3
  - expo-manifests@57.0.2
  - expo-updates-interface@57.0.2
  - '@expo/schema-utils@57.0.2'
  - expo-dev-client
  - expo-dev-launcher
  - expo-dev-menu
  - expo-dev-menu-interface
  - '@typescript/native-preview'
  - '@typescript/native-preview-darwin-arm64'
  - '@typescript/native-preview-darwin-x64'
  - '@typescript/native-preview-linux-arm'
  - '@typescript/native-preview-linux-arm64'
  - '@typescript/native-preview-linux-x64'
  - '@typescript/native-preview-win32-arm64'
  - '@typescript/native-preview-win32-x64'
  # Anthropic adds new parameters regularly and we can't really wait for them to stabilize
  - '@ai-sdk/anthropic'
  - '@anthropic-ai/sdk'
  # Kilo SDK releases are owned internally and adopted with pinned runtime validation.
  - '@kilocode/sdk'
  # KiloClaw pins and live-smoke-validates OpenClaw image upgrades before rollout.
  - openclaw
overrides:
  # Do NOT add an '@sentry/cli' override here to dedupe it against the catalog.
  # @sentry/bundler-plugin-core (used by @sentry/nextjs to upload source maps)
  # requires ^2.58.5 and calls @sentry/cli through its Node API. v3 replaced the
  # CommonJS default class export with a named one, so forcing v3 makes every
  # `new SentryCli()` throw "_sentry_cli.default is not a constructor". The plugin
  # swallows that as a recoverable error, so builds stay green while silently
  # uploading nothing. This previously broke apps/web source maps for months.
  '@babel/plugin-transform-modules-systemjs': 7.29.7
  '@babel/core': 7.29.7
  mdast-util-to-hast: 13.2.1
  storybook: 10.4.6
  next: 16.3.3
  preact: 10.28.4
  adm-zip: 0.6.0
  browserslist: 4.28.7
  decode-uri-component: 0.5.0
  glob: '>=13.0.1'
  google-auth-library: 10.6.2
  esbuild: '>=0.28.1'
  lodash: '>=4.18.1'
  diff: '>=8.0.3'
  fast-xml-parser: '>=5.7.3'
  fflate@^0.4.8: 0.4.9
  fflate@^0.8.2: 0.8.3
  vite: '>=8.0.16 <8.1.0'
  form-data: 4.0.6
  ws@^7: 7.5.11
  ws@^8: 8.21.0
  tmp: 0.2.7
  dompurify: 3.4.13
  handlebars: 4.7.9
  brace-expansion: 5.0.9
  node-forge: 1.4.0
  postcss: '>=8.5.23'
  picomatch@^2: 2.3.2
  picomatch@^4: 4.0.4
  yaml: 2.8.4
  undici@^7: 7.29.0
  path-to-regexp: 8.4.2
  ip-address: 10.3.1
  image-size@^1: npm:image-size-next@1.2.2
  image-size@^2: npm:image-size-next@2.1.1
  drizzle-orm: 0.45.2
  lodash-es: '>=4.18.1'
  '@xmldom/xmldom': 0.8.15
  qs: 6.16.0
  smol-toml: 1.6.1
  uuid@<11.1.1: 11.1.1
  serialize-javascript: '>=7.0.3'
  hono: 4.12.34
  '@modelcontextprotocol/sdk@1.30.0>@hono/node-server': 2.0.10
  # @simplewebauthn/server's ASN.1 parser must come from the same
  # @peculiar/asn1-schema copy its asn1-ecc/asn1-rsa decorators register their
  # schemas into. apps/web pins asn1-schema/-x509 to 2.8.0 for its Apple App
  # Attest code, and pnpm deduped the WebAuthn library's ^2.6.0 range onto that
  # copy while asn1-ecc resolved 2.9.4, so `AsnParser.parse(DER, ECDSASigValue)`
  # threw "Cannot get schema for 'ECDSASigValue' target" and every ES256
  # assertion was refused. Scope the newer copy to this dependency only.
  '@simplewebauthn/server>@peculiar/asn1-schema': 2.9.4
  '@simplewebauthn/server>@peculiar/asn1-x509': 2.9.4
  undici@^6: 6.28.0
  undici@^8: 8.9.0
  # 1.30.2+ regresses var() round-trip through JS visitors, breaking
  # react-native-css's metro transformer. Upstream issue:
  # https://github.com/parcel-bundler/lightningcss/issues/1081
  lightningcss: 1.30.1
  axios: 1.18.0
  fast-uri: 3.1.6
  joi: 17.13.4
  postcss-selector-parser@^7.0.0: 7.1.3
  toml: 4.2.0
  '@opentelemetry/core': 2.8.0
  body-parser: 2.3.0
  js-yaml: 4.3.1
  linkify-it: 5.0.2
  protobufjs: 7.6.5
  sharp: '>=0.35.0'
  tar: 7.5.21
  shell-quote: 1.10.0
  # Keep one @slack/web-api in the tree. @chat-adapter/slack needs ^7.18.0 while
  # @slack/oauth and @slack/socket-mode still ask for ^7.15.0, so without this we
  # end up with two copies of the WebClient. apps/web also depends on it directly
  # and constructs its own WebClient, so the versions must agree. 7.x is the
  # ceiling until @chat-adapter/slack moves to @slack/web-api 8.
  '@slack/web-api': 7.19.0
  # Direct `@expo/ui@57.0.19` (expo-widgets peer) and expo-router's `^57.0.19`
  # otherwise resolve to two native-module copies. Force one version.
  '@expo/ui': 57.0.19
  # Every workspace app pins the same @types/react on purpose; a second copy
  # breaks the root `prepare` type build (apps/web's JSX intrinsic props then
  # resolve against two React type identities). The Expo SDK 57 alignment moves
  # kilo-app to 19.3.0, so hold the whole tree on it.
  '@types/react': 19.3.0
  # kilo-app moved to jotai 3.0.0. The shared cloud-agent-sdk atoms it reads
  # only type-check when both sides resolve the same module identity, so the
  # SDK's jotai moves with it; apps/web and apps/extension keep their own
  # jotai 2.18.1 (jotai-minidb 0.0.8 imports `atomFamily` from
  # `jotai/vanilla/utils`, which jotai 3 no longer exports).
  '@kilocode/cloud-agent-sdk>jotai': 3.0.0
packageExtensions:
  # Undeclared upstream deps that break config evaluation outside the Expo CLI
  # under pnpm's isolated linker (autoInstallPeers is false).
  '@sentry/react-native':
    dependencies:
      '@expo/config-plugins': '*'
      # SDK 57 (RN 0.86): metro is no longer in react-native's own dep tree, so
      # @sentry/react-native/metro's vendored `require('metro/...')` has no
      # resolution path. Pin the exact metro the SDK 57 graph already uses.
      metro: 0.84.4
  expo-share-intent:
    dependencies:
      '@expo/plist': '*'
  react-native-appsflyer:
    dependencies:
      '@expo/config-plugins': '*'
patchedDependencies:
  # query-string 7 requires this dependency as CommonJS. Keep the 0.5.0 security fix.
  decode-uri-component@0.5.0: patches/decode-uri-component@0.5.0.patch
  # Repo-local features the SDK lacks, carried onto each SDK patch release:
  # router — unhandled deep links when getInitialURL resolves later;
  # widgets — Live Activity state query (getInfo), areLiveActivitiesEnabled,
  # includeEnded instance reads, factory-registered push-to-start URL.
  expo-router@57.0.22: patches/expo-router@57.0.22.patch
  expo-server-sdk: patches/expo-server-sdk.patch
  # Null-guard the headless app loader in TaskService.executeTask. Without it a
  # data-only FCM wake during cold start dereferences a null loader and fatally
  # crashes the app (KILO-APP-9V; expo/expo#41663, expo/expo#46449).
  expo-task-manager@57.0.19: patches/expo-task-manager@57.0.19.patch
  expo-widgets@57.0.20: patches/expo-widgets@57.0.20.patch
  react-native-appsflyer@6.18.0: patches/react-native-appsflyer@6.18.0.patch
  # Fabric mounting race: RCTComponentViewFactory registers component views from
  # the JS thread without the class-map mutex, so a mounting transaction can
  # dereference an unregistered handle and crash (EXC_BAD_ACCESS 0x18,
  # KILO-APP-6H; react/react-native#58299). Also synchronizes the
  # LegacyViewManagerInterop cache. iOS needs buildReactNativeFromSource to
  # compile this in — see apps/mobile/app.config.ts.
  # Bounds-guard the unmountChildComponentView assert message. Without it a
  # stale Fabric child index throws NSRangeException while the assert is being
  # formatted, which SIGABRTs release builds that link the assert-enabled
  # prebuilt React core (Kilo-Org/kilocode#14065; react/react-native#57865).
  react-native@0.86.3: patches/react-native@0.86.3.patch
publicHoistPattern:
  - '@types/*'
  - '*import-in-the-middle*'
  - '*require-in-the-middle*'
  - metro
