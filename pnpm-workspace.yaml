  libpq: true
  workerd: true
  '@sentry/cli': false
  bufferutil: false
  core-js: false
  core-js-pure: false
  es5-ext: false
  msgpackr-extract: false
  oxc-resolver: false
  protobufjs: false
  sharp: false
  unrs-resolver: false
  utf-8-validate: false
  '@google/genai': false
  koffi: false
  openclaw: false
  '@openrouter/sdk': false
  spawn-sync: false
  tree-sitter-bash: false
  geckodriver: true
  '@scarf/scarf': false
