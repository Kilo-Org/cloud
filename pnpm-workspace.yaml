packages:
  - apps/*
  - services/*
  - services/cloud-agent-next/wrapper
  - services/gastown/container
  - services/kiloclaw/controller
  - services/kiloclaw/plugins/*
  - services/deploy-infra/builder
  - services/deploy-infra/dispatcher
  - packages/*

catalog:
  '@cloudflare/vitest-pool-workers': 0.16.13
  '@cloudflare/workers-types': 4.20260605.1
  '@octokit/auth-app': 8.2.0
  # Only for packages that shell out to the `sentry-cli` binary directly (Workers,
  # mobile). Must NOT be added to `overrides`: the Sentry bundler plugins consume
  # @sentry/cli through its Node API, which v3 broke. See the note in `overrides`.
  '@sentry/cli': 3.6.2
  '@tanstack/query-async-storage-persister': 5.100.10
  '@tanstack/react-query': 5.100.10
  '@tanstack/react-query-persist-client': 5.100.10
  '@trpc/client': 11.17.0
  '@trpc/server': 11.17.0
  '@trpc/tanstack-react-query': 11.17.0
  '@types/jsonwebtoken': 9.0.10
  '@types/node': 24.12.4
  '@typescript/native-preview': 7.0.0-dev.20260514.1
  '@vitest/coverage-v8': 4.1.6
  '@vitest/ui': 4.1.6
  '@workos-inc/node': 8.13.0
  aws4fetch: 1.0.20
  drizzle-kit: 0.31.10
  drizzle-orm: 0.45.2
  hono: 4.12.27
  jose: 6.2.3
  jsonwebtoken: 9.0.3
  p-limit: 7.3.0
  stripe: 19.3.1
  tsx: 4.21.0
  typescript: 5.9.3
  ulid: 3.0.2
  vitest: 4.1.6
  workers-tagged-logger: 1.0.0
  wrangler: 4.112.0
  zod: 4.4.3

minimumReleaseAge: 6842
minimumReleaseAgeExclude:
  - tsx
  - expo-dev-client
  - expo-dev-launcher
  - expo-dev-menu
  - expo-dev-menu-interface
  - expo-manifests
  - expo-updates-interface
  - '@expo/schema-utils'
  - '@typescript/native-preview'
  - '@typescript/native-preview-darwin-arm64'
  - '@typescript/native-preview-darwin-x64'
  - '@typescript/native-preview-linux-arm'
  - '@typescript/native-preview-linux-arm64'
  - '@typescript/native-preview-linux-x64'
  - '@typescript/native-preview-win32-arm64'
  - '@typescript/native-preview-win32-x64'
  # Anthropic adds new parameters regularly and we can't really wait for them to stabilize
  - '@ai-sdk/anthropic'
  - '@anthropic-ai/sdk'
  # Kilo SDK releases are owned internally and adopted with pinned runtime validation.
  - '@kilocode/sdk'
  # KiloClaw pins and live-smoke-validates OpenClaw image upgrades before rollout.
  - openclaw
overrides:
  # Do NOT add an '@sentry/cli' override here to dedupe it against the catalog.
  # @sentry/bundler-plugin-core (used by @sentry/nextjs to upload source maps)
  # requires ^2.58.5 and calls @sentry/cli through its Node API. v3 replaced the
  # CommonJS default class export with a named one, so forcing v3 makes every
  # `new SentryCli()` throw "_sentry_cli.default is not a constructor". The plugin
  # swallows that as a recoverable error, so builds stay green while silently
  # uploading nothing. This previously broke apps/web source maps for months.
  '@babel/plugin-transform-modules-systemjs': 7.29.7
  '@babel/core': 7.29.7
  mdast-util-to-hast: 13.2.1
  storybook: 10.4.6
  next: 16.2.11
  preact: 10.28.4
  glob: '>=13.0.1'
  esbuild: '>=0.28.1'
  lodash: '>=4.18.1'
  diff: '>=8.0.3'
  fast-xml-parser: '>=5.7.3'
  vite: '>=8.0.16 <8.1.0'
  form-data: 4.0.6
  ws@^7: 7.5.11
  ws@^8: 8.21.0
  tmp: 0.2.7
  dompurify: 3.4.12
  handlebars: 4.7.9
  brace-expansion: 5.0.9
  node-forge: 1.4.0
  postcss: '>=8.5.23'
  picomatch@^2: 2.3.2
  picomatch@^4: 4.0.4
  yaml: 2.8.4
  undici@^7: 7.29.0
  path-to-regexp: 8.4.2
  ip-address: 10.3.1
  drizzle-orm: 0.45.2
  lodash-es: '>=4.18.1'
  '@xmldom/xmldom': 0.8.13
  qs: 6.15.2
  smol-toml: 1.6.1
  uuid@<11.1.1: 11.1.1
  serialize-javascript: '>=7.0.3'
  hono: 4.12.27
  '@modelcontextprotocol/sdk@1.30.0>@hono/node-server': 2.0.10
  undici@^6: 6.28.0
  undici@^8: 8.9.0
  # 1.30.2+ regresses var() round-trip through JS visitors, breaking
  # react-native-css's metro transformer. Upstream issue:
  # https://github.com/parcel-bundler/lightningcss/issues/1081
  lightningcss: 1.30.1
  axios: 1.18.0
  fast-uri: 3.1.4
  '@opentelemetry/core': 2.8.0
  body-parser: 2.3.0
  js-yaml: 4.3.0
  linkify-it: 5.0.2
  protobufjs: 7.6.5
  sharp: '>=0.35.0'
  tar: 7.5.21
  shell-quote: 1.10.0
  # Keep one @slack/web-api in the tree. @chat-adapter/slack needs ^7.18.0 while
  # @slack/oauth and @slack/socket-mode still ask for ^7.15.0, so without this we
  # end up with two copies of the WebClient. apps/web also depends on it directly
  # and constructs its own WebClient, so the versions must agree. 7.x is the
  # ceiling until @chat-adapter/slack moves to @slack/web-api 8.
  '@slack/web-api': 7.19.0
packageExtensions:
  # Undeclared upstream deps that break config evaluation outside the Expo CLI
  # under pnpm's isolated linker (autoInstallPeers is false).
  '@sentry/react-native':
    dependencies:
      '@expo/config-plugins': '*'
      # SDK 57 (RN 0.86): metro is no longer in react-native's own dep tree, so
      # @sentry/react-native/metro's vendored `require('metro/...')` has no
      # resolution path. Pin the exact metro the SDK 57 graph already uses.
      metro: 0.84.4
  expo-share-intent:
    dependencies:
      '@expo/plist': '*'
patchedDependencies:
  expo-server-sdk: patches/expo-server-sdk.patch
  react-native-appsflyer@6.18.0: patches/react-native-appsflyer@6.18.0.patch
publicHoistPattern:
  - '@types/*'
  - '*import-in-the-middle*'
  - '*require-in-the-middle*'
  - metro
autoInstallPeers: false
allowBuilds:
  '@swc/core': true
  '@tailwindcss/oxide': true
  esbuild: true
  libpq: true
  workerd: true
  '@sentry/cli': false
  bufferutil: false
  core-js: false
  core-js-pure: false
  es5-ext: false
  msgpackr-extract: false
  oxc-resolver: false
  protobufjs: false
  sharp: false
  unrs-resolver: false
  utf-8-validate: false
  '@google/genai': false
  koffi: false
  openclaw: false
  '@openrouter/sdk': false
  spawn-sync: false
  tree-sitter-bash: false
  geckodriver: true
  '@scarf/scarf': false
