# The AI gateway (Vercel project kilocode-ai-gateway, apps/ai-gateway). It mints each service token
# with the function's own OIDC token, exchanged for the STS audience. Production STS serves Vercel
# production, staging STS the custom environment staging, development STS previews (design 6.2);
# the Vercel development environment is never accepted. The grants below cover the three
# dual-accept receivers it calls: the LLM and Enkrypt usage publish to usage-ingest, the API-metrics
# write to o11y, and the provider forward to the AI Gateway Secure Proxy. Phase 4 activated the
# gateway for Bouncer: its production grant is below.
workload: ai-gateway
environments:
  - development
  - staging
  - production
identity:
  kind: vercel-oidc
  teamSlug: kilocode
  teamId: team_ItxRShuUkJaEd9GmXMEEgunb
  projectId: prj_cFtsRYRBCm4qa8D35LC2j183FohC
  projectName: kilocode-ai-gateway
  environments:
    - production
    - preview
    - customEnvironmentId: env_t9p3Xr8paMqpucgHbz0gg1Xrd4PV
secrets: []
audiences:
  - usage-ingest
  - o11y
  - ai-gateway-secure-proxy
scopes:
  - usage-ingest:usage.publish
  - o11y:api-metrics.write
  - ai-gateway-secure-proxy:request.forward
# Each grant belongs to one environment. The authenticated UTS HTTPS feed transport reads the
# revocation feed with a uts-feed token, development only until phase 4's activation go. Bouncer
# (repo Kilo-Org/bouncer) runs in production only and accepts only production STS tokens: the
# shared Bouncer client sends a bouncer:decide token with decide and release and a
# bouncer:usage.write token with usage events, beside the legacy key while Bouncer runs
# STS_AUTH=dual. The gateway sends no signup call, so it holds neither signup scope.
# INTERNAL_API_SECRET, staging and production only: the internal API secret read under
# SECRETS_SOURCE=sts (packages/web-shared/src/lib/sts-secret-reader.ts); previews keep `env`.
# The four database URLs, staging and production only (decision D67): POSTGRES_URL, the primary
# (packages/db/src/database-url.ts), and the three read replica URLs of
# packages/web-shared/src/lib/read-replicas.ts, which packages/web-shared/src/lib/drizzle.ts
# connects with, for their read under SECRETS_SOURCE=sts; that reader change is in the
# secrets-cutover PR. A granted name that comes back `missing` is a configuration error for the
# reader to report: a missing EU replica keeps today's behaviour and never routes EU reads to the
# primary. Previews keep `env`.
# The seventeen production names after the database URLs (ruling M142b): web values the gateway
# reuses, read by gateway code under packages/web-shared/src/lib (config.server.ts,
# ai-gateway/byok/kms-client.ts, ai-gateway/openai-chatgpt/upstream.ts,
# ai-gateway/providers/definitions, r2/ and stripe-client.ts) for the read under
# SECRETS_SOURCE=sts in the secrets-cutover PR. Each is copied Create-only into production /shared,
# which is authoritative, and none into /workloads/ai-gateway, so the bundle resolves it from
# /shared. Production only: staging and previews keep `env`.
environmentGrants:
  development:
    audiences:
      - uts-feed
    scopes:
      - uts-feed:revocation.read
  staging:
    secrets:
      - INTERNAL_API_SECRET
      - POSTGRES_URL
      - POSTGRES_REPLICA_US_URL
      - POSTGRES_REPLICA_EU_URL
      - POSTGRES_REPLICA_EU_URL_2
  production:
    audiences:
      - bouncer
    scopes:
      - bouncer:decide
      - bouncer:usage.write
    secrets:
      - INTERNAL_API_SECRET
      - POSTGRES_URL
      - POSTGRES_REPLICA_US_URL
      - POSTGRES_REPLICA_EU_URL
      - POSTGRES_REPLICA_EU_URL_2
      - BYOK_KMS_SERVICE_TOKEN
      - CREDIT_CATEGORIES_ENCRYPTION_KEY
      - CREDIT_CATEGORIES_ENCRYPTION_KEY_V2
      - ENKRYPT_API_KEY
      - MAILGUN_API_KEY
      - MISTRAL_API_KEY
      - O11Y_KILO_GATEWAY_CLIENT_SECRET
      - OPENAI_CHATGPT_API_KEY
      - OPENAI_CLIENT_SECRET
      - OPENROUTER_API_KEY
      - R2_AI_PROVIDER_METADATA_ACCESS_KEY_ID
      - R2_AI_PROVIDER_METADATA_SECRET_ACCESS_KEY
      - R2_API_REQUEST_LOG_ACCESS_KEY_ID
      - R2_API_REQUEST_LOG_SECRET_ACCESS_KEY
      - SLACK_ADMIN_NOTIFICATIONS_WEBHOOK_URL
      - STRIPE_SECRET_KEY
      - VERCEL_AI_GATEWAY_API_KEY
