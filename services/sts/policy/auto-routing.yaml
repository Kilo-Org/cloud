# The auto-routing Worker (services/auto-routing/wrangler.jsonc). Production only. Its classifier
# records its own LLM usage at the web app's /api/internal/usage/record with a
# web:usage.classifier.record token over its `STS` SecretsBroker binding (WEB_INTERNAL_AUTH=sts),
# and it reads the Auto Routing Benchmark's routing tables (src/benchmark-origin.ts) with an
# auto-routing-benchmark:routing-tables.read token over the same binding.
# It reads its runtime secrets over the same binding; SECRETS_SOURCE stays `secrets-store` (the
# Secrets Store bindings) until secrets-cutover flips it. INTERNAL_API_SECRET, NEXTAUTH_SECRET,
# OPENROUTER_API_KEY and O11Y_CF_AE_API_TOKEN resolve from /shared;
# AUTO_ROUTING_DECISION_SECRET from /workloads/auto-routing.
workload: auto-routing
environments:
  - production
identity:
  kind: worker-binding
secrets:
  - AUTO_ROUTING_DECISION_SECRET
  - INTERNAL_API_SECRET
  - NEXTAUTH_SECRET
  - O11Y_CF_AE_API_TOKEN
  - OPENROUTER_API_KEY
audiences:
  - web
  - auto-routing-benchmark
scopes:
  - web:usage.classifier.record
  - auto-routing-benchmark:routing-tables.read
