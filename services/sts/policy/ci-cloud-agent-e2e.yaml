# The Cloud Agent e2e deploy and tests jobs (GitHub environment cloud-agent-e2e): the Cloudflare
# Access service token of the e2e Worker's ingress (D35/D39, manager ruling M83). The deploy job
# uploads both values as Worker secrets; the tests job sends them. The nightly workflow calls both
# files as reusable workflows; those jobs carry the called file's job_workflow_ref with the
# caller's ref and event, so they are covered too, and any other workflow on main that calls them
# with workflow_dispatch in this environment would get the bundle (README "GitHub Actions callers").
workload: ci-cloud-agent-e2e
environments: [production]
identity:
  kind: github-oidc
  repository: Kilo-Org/cloud
  repositoryId: '1145038391'
  repositoryOwnerId: '201822503'
  environment: cloud-agent-e2e
  refs: [refs/heads/main]
  jobWorkflowRefs:
    - Kilo-Org/cloud/.github/workflows/cloud-agent-e2e-deploy.yml@refs/heads/main
    - Kilo-Org/cloud/.github/workflows/cloud-agent-e2e-tests.yml@refs/heads/main
  events: [workflow_dispatch] # the nightly's schedule is paused; restoring it adds schedule here
secrets: [E2E_ACCESS_CLIENT_ID, E2E_ACCESS_CLIENT_SECRET]
