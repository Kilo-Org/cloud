# The production deploy's db-gate job (README "Migration run attestation", design Q64a): a
# trigger-only policy. Its job's token, with the migration proxy's audience, lets the proxy
# start a run that applies what is on main; it reads no secret and mints nothing. Q71 carve-out
# (Igor, 2026-11-27): workflow_run with the other events in production, for this policy only; the
# workflow's workflow_run trigger stays limited to branches: [main].
workload: ci-db-migrate
environments: [production]
identity:
  kind: github-oidc
  repository: Kilo-Org/cloud
  repositoryId: '1145038391'
  repositoryOwnerId: '201822503'
  environment: production
  refs: [refs/heads/main]
  jobWorkflowRefs: [Kilo-Org/cloud/.github/workflows/deploy-production.yml@refs/heads/main]
  events: [workflow_run, schedule, workflow_dispatch]
secrets: []
dynamic:
  - grant: migration-run
