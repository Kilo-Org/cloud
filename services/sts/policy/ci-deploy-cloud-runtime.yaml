# Kilo-Org/cloud's Cloud Agent runtime publisher: the publish job of
# cloud-agent-runtime-publish.yml in GitHub environment cloud-agent-runtime-publication, when the
# repository variable DEPLOY_TOKEN_SOURCE is `sts` (README "Cloudflare deploy tokens"). It deploys no
# Worker: Containers Write pushes the runtime base image, and R2 Storage Write only asks R2 for
# temporary credentials on the runtime bucket. workflow_run with workflow_dispatch in production
# relies on the Q71 carve-out (Q71b, decided by Igor 2026-11-27; Q71_CLOUDFLARE_DEPLOY_CARVE_OUT).
workload: ci-deploy-cloud-runtime
environments: [production]
identity:
  kind: github-oidc
  repository: Kilo-Org/cloud
  repositoryId: '1145038391'
  repositoryOwnerId: '201822503'
  environment: cloud-agent-runtime-publication
  refs: [refs/heads/main]
  jobWorkflowRefs:
    [Kilo-Org/cloud/.github/workflows/cloud-agent-runtime-publish.yml@refs/heads/main]
  events: [workflow_run, workflow_dispatch]
secrets: []
dynamic:
  - grant: cloudflare-deploy
    permissionSet: cloud-agent-runtime-publish
    permissionGroups:
      - { id: bdbcd690c763475a985e8641dddc09f7, name: Workers Containers Write, scope: account }
      - { id: bf7481a1826f439697cb59a20b22293e, name: Workers R2 Storage Write, scope: account }
    intendedScripts: []
    ttlSeconds: 3600
    maxActive: 1
    maxPerHour: 12
