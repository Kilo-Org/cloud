# Kilo-Org/cloud's staging Worker deploys: the jobs of deploy-workers.yml (called by
# deploy-staging.yml, or dispatched on its own) in GitHub environment staging, when the repository
# variable DEPLOY_TOKEN_SOURCE is `sts` (README "Cloudflare deploy tokens"). Staging and production
# share the Cloudflare account, so this token reaches production Workers too; the staging GitHub
# environment carries production's main-only rule. workflow_run with the other events relies on
# the Q71 carve-out (Q71b, decided by Igor 2026-11-27; Q71_CLOUDFLARE_DEPLOY_CARVE_OUT).
workload: ci-deploy-cloud-staging
environments: [staging]
identity:
  kind: github-oidc
  repository: Kilo-Org/cloud
  repositoryId: '1145038391'
  repositoryOwnerId: '201822503'
  environment: staging
  refs: [refs/heads/main]
  jobWorkflowRefs: [Kilo-Org/cloud/.github/workflows/deploy-workers.yml@refs/heads/main]
  events: [workflow_run, schedule, workflow_dispatch]
secrets: []
dynamic:
  - grant: cloudflare-deploy
    permissionSet: cloud-workers-deploy-staging
    # Staging Workers bind queues and use Custom Domains only: no zone route, container or D1.
    permissionGroups:
      - { id: e086da7e2179491d91ee5f35b3ca210a, name: Workers Scripts Write, scope: account }
      - { id: 366f57075ffc42689627bcf8242a1b6d, name: Queues Write, scope: account }
    # Every staging Worker deploy-workers.yml can deploy (scripts/deployment-workflows.test.mjs
    # holds this list to the env.staging names it discovers).
    intendedScripts:
      - audit-relay-staging
      - cloudflare-scim-sync-staging
      - notifications-staging
      - session-ingest-staging
      - sts-staging
      - usage-ingest-staging
      - uts-feed-staging
      - uts-staging
    ttlSeconds: 3600
    maxActive: 2
    maxPerHour: 12
    maxPerRun: 16
