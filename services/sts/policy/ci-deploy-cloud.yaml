# Kilo-Org/cloud's production Worker deploys: the jobs of deploy-workers.yml (called by
# deploy-production.yml, or dispatched on its own) in GitHub environment production, when the
# repository variable DEPLOY_TOKEN_SOURCE is `sts` (README "Cloudflare deploy tokens"). One token per
# deploy job; maxPerRun counts the limits per run, because one run deploys up to 31 Workers in
# parallel. workflow_run with the other events in production relies on the Q71 carve-out, PENDING
# IGOR (Q71_CLOUDFLARE_DEPLOY_CARVE_OUT in src/policy/schema.ts).
workload: ci-deploy-cloud
environments: [production]
identity:
  kind: github-oidc
  repository: Kilo-Org/cloud
  repositoryId: '1145038391'
  repositoryOwnerId: '201822503'
  environment: production
  refs: [refs/heads/main]
  jobWorkflowRefs: [Kilo-Org/cloud/.github/workflows/deploy-workers.yml@refs/heads/main]
  events: [workflow_run, schedule, workflow_dispatch]
secrets: []
dynamic:
  - grant: cloudflare-deploy
    permissionSet: cloud-workers-deploy
    permissionGroups:
      - { id: e086da7e2179491d91ee5f35b3ca210a, name: Workers Scripts Write, scope: account }
      - { id: bdbcd690c763475a985e8641dddc09f7, name: Workers Containers Write, scope: account }
      - { id: 28f4b596e7d643029c524985477ae49a, name: Workers Routes Write, scope: zone }
      - { id: 366f57075ffc42689627bcf8242a1b6d, name: Queues Write, scope: account }
      - { id: 09b2857d1c31407795e75e3fed8617a1, name: D1 Write, scope: account }
      - { id: bf7481a1826f439697cb59a20b22293e, name: Workers R2 Storage Write, scope: account }
    # kiloapps.io. cloud-agent-next's kiloapps.ai routes need that zone too: setup adds its id here
    # and to CLOUDFLARE_DEPLOY_PINS before DEPLOY_TOKEN_SOURCE becomes `sts`.
    zones: ['9f7103cbcadbe93a052c120f231e8507']
    # Every production Worker deploy-workers.yml can deploy (scripts/deployment-workflows.test.mjs
    # holds this list to the services/*/wrangler.jsonc names it discovers).
    intendedScripts:
      - audit-relay
      - auto-routing
      - auto-routing-benchmark
      - cloud-agent-next
      - cloudflare-gmail-push
      - cloudflare-scim-sync
      - cloudflare-security-sync
      - cloudflare-webhook-agent-ingest
      - container-usage-meter
      - event-service
      - git-token-service
      - kilo-ai-attribution
      - kilo-chat
      - kilo-code-review-worker
      - kilo-mcp
      - kilo-ops
      - kiloclaw-billing
      - kiloclaw-inbound-email
      - latency-ingest
      - model-eval-ingest
      - notifications
      - nteract-pages-outputs
      - o11y
      - pages-dev
      - security-auto-analysis
      - session-ingest
      - session-sync
      - sts
      - usage-ingest
      - uts
      - uts-feed
    intendedRoutes: ['ai-attribution.kiloapps.io/*', 'ops.kiloapps.io/*']
    ttlSeconds: 3600
    maxActive: 2
    maxPerHour: 12
    maxPerRun: 40
