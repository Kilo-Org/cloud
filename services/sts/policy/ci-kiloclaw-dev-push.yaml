# Kilo-Org/cloud's KiloClaw development image push: the `push-dev` job of
# push-dev-kiloclaw.yml, dispatched on main. A development registry token, so it lives in the
# staging manager and binds no GitHub environment.
workload: ci-kiloclaw-dev-push
environments: [staging]
identity:
  kind: github-oidc
  repository: Kilo-Org/cloud
  repositoryId: '1145038391'
  repositoryOwnerId: '201822503'
  refs: [refs/heads/main]
  jobWorkflowRefs: [Kilo-Org/cloud/.github/workflows/push-dev-kiloclaw.yml@refs/heads/main]
  events: [workflow_dispatch]
secrets: [FLY_DEV_API_TOKEN]
