# kilocode watch-opencode-releases (kilocode CI design 6). Only the Slack webhook: the sync call's
# service token (audience opencode-watch-sync) waits until that audience is registered.
# legacySubject: Kilo-Org/kilocode still issues the default subject (npm/cli#9969); see
# GITHUB_LEGACY_SUBJECT_REPOSITORY in src/policy/schema.ts for why and how to upgrade.
workload: ci-kilocode-opencode-watch
environments:
  - production
identity:
  kind: github-oidc
  repository: Kilo-Org/kilocode
  repositoryId: '946087422'
  repositoryOwnerId: '201822503'
  legacySubject: true
  environment: automation
  jobWorkflowRefs:
    - Kilo-Org/kilocode/.github/workflows/watch-opencode-releases.yml@refs/heads/main
  events:
    - schedule
    - workflow_dispatch
secrets:
  - KILOCODE_OPENCODE_WATCH_SLACK_WEBHOOK
