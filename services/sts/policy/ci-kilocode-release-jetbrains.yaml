# kilocode JetBrains release: the publish jobs in the protected `release-jetbrains` environment
# (kilocode CI design 6). A publish-jetbrains.yml run started by a closed pull request is refused:
# only workflow_dispatch is listed.
# Kilo-Org/kilocode issues immutable subjects only after its opt-in; until then STS refuses its tokens.
workload: ci-kilocode-release-jetbrains
environments:
  - production
identity:
  kind: github-oidc
  repository: Kilo-Org/kilocode
  repositoryId: '946087422'
  repositoryOwnerId: '201822503'
  environment: release-jetbrains
  jobWorkflowRefs:
    - Kilo-Org/kilocode/.github/workflows/publish-jetbrains.yml@refs/heads/main
    - Kilo-Org/kilocode/.github/workflows/publish-jetbrains-bundled.yml@refs/heads/main
  events:
    - workflow_dispatch
secrets:
  - KILOCODE_JETBRAINS_MARKETPLACE_TOKEN
  - KILOCODE_JETBRAINS_PRIVATE_KEY
  - KILOCODE_JETBRAINS_PRIVATE_KEY_PASSWORD
  - KILOCODE_JETBRAINS_CERTIFICATE_CHAIN
