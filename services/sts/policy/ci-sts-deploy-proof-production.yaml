# Throwaway proof of Cloudflare deploy tokens in production (README "Cloudflare deploy
# tokens"). Remove this file right after the production proof passes.
workload: ci-sts-deploy-proof-production
environments: [production]
identity:
  kind: github-oidc
  repository: iscekic/sts-deploy-token-proof
  repositoryId: '1473736336'
  repositoryOwnerId: '4062236'
  environment: sts-proof-production
  refs: [refs/heads/main]
  jobWorkflowRefs: [iscekic/sts-deploy-token-proof/.github/workflows/proof.yml@refs/heads/main]
  events: [workflow_dispatch]
secrets: []
dynamic:
  - grant: cloudflare-deploy
    permissionSet: sts-deploy-proof
    permissionGroups:
      - { id: e086da7e2179491d91ee5f35b3ca210a, name: Workers Scripts Write, scope: account }
    intendedScripts: [sts-deploy-proof-production]
    ttlSeconds: 300
    maxActive: 1
    maxPerHour: 2
