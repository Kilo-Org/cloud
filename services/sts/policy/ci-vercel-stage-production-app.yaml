# Kilo-Org/cloud's Vercel stage job for project `app` in production: the `stage` job of the reusable
# stage-vercel-deployment.yml with vercel_project app, called by deploy-production.yml and
# redeploy-web.yml. It runs in the GitHub environment production-vercel-app, which no other job
# names, so this bundle holds only this project's token. workflow_run with the other events in
# production: D53/M112 (D53_M112_CI_BUNDLE_CARVE_OUT in src/policy/schema.ts).
workload: ci-vercel-stage-production-app
environments: [production]
identity:
  kind: github-oidc
  repository: Kilo-Org/cloud
  repositoryId: '1145038391'
  repositoryOwnerId: '201822503'
  environment: production-vercel-app
  refs: [refs/heads/main]
  jobWorkflowRefs: [Kilo-Org/cloud/.github/workflows/stage-vercel-deployment.yml@refs/heads/main]
  events: [workflow_run, schedule, workflow_dispatch]
secrets: [VERCEL_TOKEN_APP]
