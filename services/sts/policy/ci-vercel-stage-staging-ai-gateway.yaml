# Kilo-Org/cloud's Vercel stage job for project `ai-gateway` in staging: the `stage` job of the
# reusable stage-vercel-deployment.yml with vercel_project ai-gateway, called by deploy-staging.yml.
# It runs in the GitHub environment staging-vercel-ai-gateway, which no other job names, so this
# bundle holds only this project's token. The project token can deploy production too, so it stays
# in the production manager. workflow_run with the other events in production: D53/M112
# (D53_M112_CI_BUNDLE_CARVE_OUT in src/policy/schema.ts).
workload: ci-vercel-stage-staging-ai-gateway
environments: [production]
identity:
  kind: github-oidc
  repository: Kilo-Org/cloud
  repositoryId: '1145038391'
  repositoryOwnerId: '201822503'
  environment: staging-vercel-ai-gateway
  refs: [refs/heads/main]
  jobWorkflowRefs: [Kilo-Org/cloud/.github/workflows/stage-vercel-deployment.yml@refs/heads/main]
  events: [workflow_run, schedule, workflow_dispatch]
secrets: [VERCEL_TOKEN_AI_GATEWAY]
