# Kilo-Org/cloud's production Vercel stage job: the `stage` job of the reusable
# stage-vercel-deployment.yml, called by deploy-production.yml, redeploy-web.yml and
# deploy-ai-gateway-secure-proxy.yml in GitHub environment production. One project token per
# project the file stages in production; each caller's job requests only its own. workflow_run with
# the other events in production: D53/M112 (D53_M112_CI_BUNDLE_CARVE_OUT in src/policy/schema.ts).
workload: ci-vercel-stage
environments: [production]
identity:
  kind: github-oidc
  repository: Kilo-Org/cloud
  repositoryId: '1145038391'
  repositoryOwnerId: '201822503'
  environment: production
  refs: [refs/heads/main]
  jobWorkflowRefs: [Kilo-Org/cloud/.github/workflows/stage-vercel-deployment.yml@refs/heads/main]
  events: [workflow_run, schedule, workflow_dispatch]
secrets: [VERCEL_TOKEN_APP, VERCEL_TOKEN_AI_GATEWAY, VERCEL_TOKEN_AI_GATEWAY_SECURE_PROXY]
