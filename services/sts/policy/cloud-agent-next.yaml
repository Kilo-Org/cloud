# The cloud-agent-next Worker (services/cloud-agent-next/wrangler.jsonc). It reads its runtime
# secrets over the `STS` SecretsBroker binding; SECRETS_SOURCE stays `secrets-store` (the Worker
# secret and Secrets Store binding it holds today) until secrets-cutover flips it.
# INTERNAL_API_SECRET and NEXTAUTH_SECRET resolve from /shared; the rest live in
# /workloads/cloud-agent-next.
# Only names the Worker reads are granted: its deployment still holds GITHUB_APP_PRIVATE_KEY,
# GITHUB_LITE_APP_PRIVATE_KEY, SSEC_KEY and R2_SECRET_ACCESS_KEY as unused plain secrets, which are
# deleted rather than copied (src/secrets.ts).
workload: cloud-agent-next
environments:
  - production
identity:
  kind: worker-binding
secrets:
  - INTERNAL_API_SECRET
  - NEXTAUTH_SECRET
  - AGENT_ENV_VARS_PRIVATE_KEY
  - R2_ATTACHMENTS_READONLY_SECRET_ACCESS_KEY
