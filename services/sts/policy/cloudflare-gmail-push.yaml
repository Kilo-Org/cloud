# The cloudflare-gmail-push Worker (services/gmail-push/wrangler.jsonc). It reads its runtime
# secrets over the `STS` SecretsBroker binding; SECRETS_SOURCE stays `env` (the Secrets Store
# binding) until secrets-cutover flips it. INTERNAL_API_SECRET resolves from /shared.
workload: cloudflare-gmail-push
environments:
  - production
identity:
  kind: worker-binding
secrets:
  - INTERNAL_API_SECRET
