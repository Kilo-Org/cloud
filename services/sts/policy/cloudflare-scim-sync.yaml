# The cloudflare-scim-sync Worker (services/scim-sync/wrangler.jsonc). It reads its runtime
# secrets over the `STS` SecretsBroker binding; SECRETS_SOURCE stays `env` (the Secrets Store
# bindings) until secrets-cutover flips it. WORKOS_API_KEY and WORKOS_CLIENT_ID resolve from
# /workloads/cloudflare-scim-sync; INTERNAL_API_SECRET from /shared. `env.staging`
# (cloudflare-scim-sync-staging) deploys no STS binding and reads the `_STAGING` store names.
workload: cloudflare-scim-sync
environments:
  - production
identity:
  kind: worker-binding
secrets:
  - INTERNAL_API_SECRET
  - WORKOS_API_KEY
  - WORKOS_CLIENT_ID
