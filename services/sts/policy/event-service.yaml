# The event-service Worker (services/event-service/wrangler.jsonc). It reads its runtime secrets
# over the `STS` SecretsBroker binding; SECRETS_SOURCE stays `secrets-store` (the Secrets Store binding) until
# secrets-cutover flips it. NEXTAUTH_SECRET resolves from /shared.
workload: event-service
environments:
  - production
identity:
  kind: worker-binding
secrets:
  - NEXTAUTH_SECRET
