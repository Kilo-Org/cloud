# The kilo-ai-attribution Worker (services/ai-attribution/wrangler.jsonc). It reads its runtime
# secrets over the `STS` SecretsBroker binding; SECRETS_SOURCE stays `env` (the Secrets Store
# binding) until secrets-cutover flips it. NEXTAUTH_SECRET resolves from /shared; ADMIN_SECRET
# from /workloads/kilo-ai-attribution/ADMIN_SECRET. The `dev` block deploys no STS binding and
# reads the `_DEV` store names.
workload: kilo-ai-attribution
environments:
  - production
identity:
  kind: worker-binding
secrets:
  - ADMIN_SECRET
  - NEXTAUTH_SECRET
