# The kilo-chat Worker (services/kilo-chat/wrangler.jsonc). It reads its runtime secrets over the
# `STS` SecretsBroker binding; SECRETS_SOURCE stays `env` (the Secrets Store bindings) until
# secrets-cutover flips it. NEXTAUTH_SECRET and INTERNAL_API_SECRET resolve from /shared; the R2
# media credentials resolve from /workloads/kilo-chat (R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY).
workload: kilo-chat
environments:
  - production
identity:
  kind: worker-binding
secrets:
  - NEXTAUTH_SECRET
  - GATEWAY_TOKEN_SECRET
  - R2_ACCESS_KEY_ID
  - R2_SECRET_ACCESS_KEY
  - INTERNAL_API_SECRET
