# The kiloclaw-inbound-email Worker (services/kiloclaw-inbound-email/wrangler.jsonc). It reads its
# runtime secrets over the `STS` SecretsBroker binding; SECRETS_SOURCE stays `env` (the Secrets
# Store binding) until secrets-cutover flips it. INTERNAL_API_SECRET resolves from /shared.
workload: kiloclaw-inbound-email
environments:
  - production
identity:
  kind: worker-binding
secrets:
  - INTERNAL_API_SECRET
