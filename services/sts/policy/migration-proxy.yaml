# Reserved for the migration proxy Worker (services/migration-proxy, design Q64a), which slice B
# adds. Its change replaces this registration with the worker-binding policy: environments
# [staging, production] and secrets MIGRATION_PROXY_DB_PASSWORD and
# MIGRATION_PROXY_GITHUB_APP_KEY in /workloads/migration-proxy. Until then no Worker here binds STS
# as migration-proxy, which the repository check requires of every worker-binding policy.
# attestGithubRun checks the props caller name, not this file.
workload: migration-proxy
registered: true
secrets: []
