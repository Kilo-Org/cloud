# The model-eval-ingest Worker (services/model-eval-ingest/wrangler.jsonc). It reads its runtime
# secrets over the `STS` SecretsBroker binding; SECRETS_SOURCE stays `secrets-store` (the Secrets Store
# binding) until secrets-cutover flips it. INTERNAL_API_SECRET resolves from /shared. The `dev`
# block deploys no STS binding and reads INTERNAL_API_SECRET_DEV from the store.
workload: model-eval-ingest
environments:
  - production
identity:
  kind: worker-binding
secrets:
  - INTERNAL_API_SECRET
