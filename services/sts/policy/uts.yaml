# The UTS mint Worker (services/uts/wrangler.jsonc: `uts`, and `uts-staging` in env.staging, each
# binding STS as caller `uts`). Its sign-in, device grant, mail and attestation readers take these
# names from /workloads/uts (services/uts/src/secrets.ts), but only under SECRETS_SOURCE=sts; each
# environment ships `worker` until its own flip. No development: the uts-local config
# (wrangler.dev.jsonc) binds no STS. UTS_HYPERDRIVE_SWITCH_TOKEN is added only in the change that
# turns the login rotation on, because every request isolate holds the whole bundle.
workload: uts
environments:
  - staging
  - production
identity:
  kind: worker-binding
secrets:
  - DEVICE_USER_CODE_KEY
  - SIGNIN_EMAIL_HASH_KEY
  - SIGNIN_GITHUB_CLIENT_SECRET
  - SIGNIN_GOOGLE_CLIENT_SECRET
  - SIGNIN_GITLAB_CLIENT_SECRET
  - SIGNIN_DISCORD_CLIENT_SECRET
  - SIGNIN_LINKEDIN_CLIENT_SECRET
  - SIGNIN_APPLE_PRIVATE_KEY
  - SIGNIN_OPENAI_CLIENT_SECRET
  - SIGNIN_ANACONDA_CLIENT_SECRET
  - SIGNIN_ANTHROPIC_ASSERTION_PRIVATE_KEY
  - SIGNIN_WORKOS_API_KEY
  - UTS_MAILGUN_SENDING_KEY
  - UTS_TURNSTILE_SECRET_KEY
  - ATTEST_PLAY_INTEGRITY_SERVICE_ACCOUNT_KEY
