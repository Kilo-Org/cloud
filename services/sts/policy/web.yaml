# The web app (Vercel project kilocode-app). Its STS canary route mints usage-ingest:sts.canary
# with the function's own OIDC token, exchanged for the STS audience (decision D6c). Production
# STS serves Vercel production, staging STS the custom environment staging, development STS
# previews (design 6.2); the Vercel development environment is never accepted. Its /api/exa route
# publishes Exa usage to usage-ingest's /exa-usage (usage-ingest:usage.publish); its security agent
# writes API metrics to o11y (o11y:api-metrics.write), and its admin alerts router reads and
# changes o11y's alerting configuration (o11y:alerting.read, o11y:alerting.write).
workload: web
environments:
  - development
  - staging
  - production
identity:
  kind: vercel-oidc
  teamSlug: kilocode
  teamId: team_ItxRShuUkJaEd9GmXMEEgunb
  projectId: prj_AAnAlIuYPrpU0aDbT1kdm0ymL7hR
  projectName: kilocode-app
  environments:
    - production
    - preview
    - customEnvironmentId: env_AWLwIFdyYSjUqXEoh7aH9E8Kg39b
secrets: []
audiences:
  - usage-ingest
  - o11y
scopes:
  - usage-ingest:sts.canary
  - usage-ingest:usage.publish
  - o11y:api-metrics.write
  - o11y:alerting.read
  - o11y:alerting.write
# UTS grants, development only until phase 4's activation go; staging and production get them as
# additions to their keys below. The web app reads the UTS revocation feed (uts-feed), ends or
# revokes a subject's sessions and credentials (uts), and signs its kilo-web client assertion with
# UTS_KILO_WEB_CLIENT_KEY (UTS_KILO_WEB_CLIENT_KEY_NEXT during a rotation).
# Bouncer (repo Kilo-Org/bouncer) runs in production only and accepts only production STS tokens,
# so its scopes are a production grant: the shared Bouncer client sends one token per call
# (bouncer:decide for decide, charge-decide and release; bouncer:usage.write for usage and credit
# events; bouncer:signup.decide for signup), beside the legacy key while Bouncer runs
# STS_AUTH=dual. The web app makes no signup-history call, so it holds no bouncer:signup.history.
# The web app's calls to the Code Review Worker (code-review: dispatch, status read, cancel, fresh
# retry), its session access invalidation at Session Ingest (session-ingest), its manual sync and
# finding dismissal enqueues at Security Sync (security-sync), its calls to the web-called
# /internal/* routes of Security Auto Analysis, Model Eval Ingest, Webhook Agent Ingest, Session
# Sync and the Notifications Worker (one internal.call scope each), its Auto Routing admin reads
# and writes (auto-routing), and its Auto Routing Benchmark admin reads, writes and routing-table
# reads (auto-routing-benchmark) are a production grant, like every phase 2 C1 grant; another
# environment gets them by adding its key.
# INTERNAL_API_SECRET, staging and production only: the internal API secret read under
# SECRETS_SOURCE=sts (packages/web-shared/src/lib/sts-secret-reader.ts); previews keep `env`.
environmentGrants:
  development:
    audiences:
      - uts-feed
      - uts
    scopes:
      - uts-feed:revocation.read
      - uts:subjects.revoke
      - uts:browser-sessions.end
      - uts:api-credentials.revoke
    secrets:
      - UTS_KILO_WEB_CLIENT_KEY
      - UTS_KILO_WEB_CLIENT_KEY_NEXT
  staging:
    secrets:
      - INTERNAL_API_SECRET
  production:
    audiences:
      - bouncer
      - code-review
      - session-ingest
      - security-sync
      - security-auto-analysis
      - model-eval-ingest
      - webhook-agent-ingest
      - session-sync
      - notifications
      - auto-routing
      - auto-routing-benchmark
    scopes:
      - bouncer:decide
      - bouncer:usage.write
      - bouncer:signup.decide
      - code-review:review.dispatch
      - code-review:review.status-read
      - code-review:review.cancel
      - code-review:review.retry-fresh
      - session-ingest:session-access.invalidate
      - security-sync:manual-sync.enqueue
      - security-sync:dismiss-finding.enqueue
      - security-auto-analysis:internal.call
      - model-eval-ingest:internal.call
      - webhook-agent-ingest:internal.call
      - session-sync:internal.call
      - notifications:internal.call
      - auto-routing:admin.read
      - auto-routing:admin.write
      - auto-routing-benchmark:admin.read
      - auto-routing-benchmark:admin.write
      - auto-routing-benchmark:routing-tables.read
    secrets:
      - INTERNAL_API_SECRET
